<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>病人大管家</title>
<!--
  红小涛学习套装 · 病人大管家
  定位：全家资料的"管家"。按病人归堆（血气/呼吸机/脱敏病历，天然有章），
        按知识搜索（笔记/习题，全靠AI名片）。
  v0.1.0 2026-09-02 第①步·名片系统（洪老师拍板"开始吧"）：
    - 扫全家：学习笔记(study_notes_v1) + 习题(xitixuexi_v01) 各多少篇/题，名片覆盖几成
    - AI做名片：每篇压成≤80字（什么病/药/操作+关键词），千问优先、千问罢工自动换Kimi
    - 死命令：只概括原文，一个字都不许外加
    - 分步外显：做哪篇、第几/共几、几秒，一行一行亮出来，不像死机
    - 开门自动做3篇（有Key才动，没Key只提示不花钱）；手动「🔨 做名片」一次做10篇
    - 名片库 hx_cards_v1 全家共享localStorage；源内容变了(sig对不上)自动重打
    - 记账 hx_aibill；名片是派生品，暂不做云备份（重打≈几分钱），待办里记着
-->
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f5f1ea; color:#33302b; font-size:16px; }
  .wrap { max-width:640px; margin:0 auto; padding:14px 14px 60px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  .ver { font-size:12px; color:#8a8178; margin-bottom:12px; }
  .card { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px;
          box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size:17px; margin:0 0 8px; }
  .btn-row { display:flex; flex-wrap:wrap; gap:8px; }
  button { font-size:15px; padding:9px 14px; border:none; border-radius:9px; color:#fff;
           background:#b3742a; cursor:pointer; }
  button.ghost { background:#ece7dd; color:#5b554b; }
  button:disabled { opacity:.5; }
  .stat { display:flex; justify-content:space-between; align-items:center; padding:8px 0;
          border-bottom:1px dashed #e6e0d4; font-size:15px; }
  .stat:last-child { border-bottom:none; }
  .bar { height:8px; background:#ece7dd; border-radius:99px; overflow:hidden; margin-top:4px; }
  .bar>i { display:block; height:100%; background:#4a7c59; border-radius:99px; }
  .msg { font-size:13px; margin-top:8px; padding:8px 10px; border-radius:8px; display:none; }
  .msg.ok { display:block; background:#eef5ee; color:#3c6e47; }
  .msg.err { display:block; background:#fbeeee; color:#a33; }
  .msg.info { display:block; background:#f3efe7; color:#5b554b; }
  #progLog { font-size:13px; line-height:1.9; max-height:260px; overflow:auto;
             background:#faf7f2; border-radius:8px; padding:8px 10px; margin-top:8px; display:none; }
  #progLog .step-doing { color:#b3742a; font-weight:bold; }
  #progLog .step-done { color:#3c6e47; }
  #progLog .step-err { color:#a33; }
  .cc { border-bottom:1px dashed #e6e0d4; padding:9px 0; }
  .cc:last-child { border-bottom:none; }
  .cc .cc-head { font-size:13px; color:#8a8178; margin-bottom:2px; }
  .cc .cc-title { font-size:15px; font-weight:bold; margin-bottom:3px; }
  .cc .cc-card { font-size:14px; line-height:1.7; color:#4a453e; }
  .cc .cc-kw { font-size:12px; color:#b3742a; margin-top:2px; }
  .badge { display:inline-block; font-size:11px; padding:2px 7px; border-radius:99px; margin-right:6px; }
  .badge-notes { background:#e8eef7; color:#34567a; }
  .badge-xiti { background:#f0e8f5; color:#6a4a7c; }
  input[type=text] { width:100%; font-size:15px; padding:9px 10px; border:1px solid #d8d2c6;
                     border-radius:9px; background:#fff; }
  .hidden { display:none !important; }
  /* 自画弹窗（手机壳X5不理系统prompt，全家死规矩） */
  #hxDlg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:99999; overflow:auto; }
  #hxDlg .box { background:#fff; border-radius:14px; max-width:560px; margin:14vh auto; padding:18px 20px; }
  #hxDlgInput { width:100%; min-height:70px; font-size:15px; padding:10px;
                border:1px solid #d8d2c6; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 病人大管家</h1>
  <div class="ver">v<span id="verTop">?</span> · 全家的资料管家：病人归堆 + 知识搜索（名片打底）</div>

  <div class="card">
    <h2>📚 家底总览</h2>
    <div class="stat"><span>📝 学习笔记</span><span id="stNotes">…</span></div>
    <div class="bar"><i id="barNotes" style="width:0%"></i></div>
    <div class="stat"><span>📖 习题</span><span id="stXiti">…</span></div>
    <div class="bar"><i id="barXiti" style="width:0%"></i></div>
    <div class="msg" id="ovMsg"></div>
  </div>

  <div class="card">
    <h2>🔨 做名片</h2>
    <div style="font-size:13px;color:#8a8178;margin-bottom:8px;">
      名片=AI把每篇资料压成80字以内（什么病/药/操作+关键词），以后您问"农药中毒"，
      我翻名片几秒钟就挑出来。<b>只概括您的原文，一个字不外加。</b>
    </div>
    <div class="btn-row">
      <button id="btnCards">🔨 做名片（一次10篇）</button>
      <button class="ghost" id="btnCardsAll">全部做完</button>
    </div>
    <div id="progLog"></div>
    <div class="msg" id="cardMsg"></div>
  </div>

  <div class="card">
    <h2>🔎 名片浏览</h2>
    <input type="text" id="kwFilter" placeholder="筛一筛：输入病名/药名/关键词">
    <div id="cardList" style="margin-top:8px;"></div>
  </div>
</div>

<div id="hxDlg">
  <div class="box">
    <h3 id="hxDlgTitle" style="margin-bottom:8px;"></h3>
    <textarea id="hxDlgInput"></textarea>
    <div class="btn-row" style="margin-top:10px;">
      <button id="hxDlgOk">确定</button>
      <button class="ghost" id="hxDlgCancel">取消</button>
    </div>
  </div>
</div>

<script>
var SW_VERSION = "0.1.0";
document.getElementById('verTop').textContent = SW_VERSION;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showMsg(el, txt, cls){ el.className='msg '+(cls||'info'); el.textContent=txt; }
function toast(msg, ms){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(46,42,38,.92);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:99998;max-width:86%;text-align:center;';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, ms||2600);
}

/* ── 自画弹窗（X5不理系统prompt，全家死规矩；与PPT v0.7.5同款） ── */
var hxDlgCb=null;
function hxAsk(title, defVal, placeholder, cb, okText){
  if($('hxDlg').style.display==='block') hxDlgClose(null);
  $('hxDlgTitle').textContent=title;
  var inp=$('hxDlgInput'); inp.value=defVal||''; inp.placeholder=placeholder||''; inp.style.display='';
  $('hxDlgOk').textContent=okText||'确定';
  hxDlgCb=cb;
  $('hxDlg').style.display='block';
  setTimeout(function(){ inp.focus(); },50);
}
function hxDlgClose(v){ $('hxDlg').style.display='none'; var cb=hxDlgCb; hxDlgCb=null; if(cb) cb(v); }
$('hxDlgOk').onclick=function(){ hxDlgClose($('hxDlgInput').value); };
$('hxDlgCancel').onclick=function(){ hxDlgClose(null); };

/* ── 记账（全家同款 hx_aibill） ── */
var HX_PRICE={"kimi-k2.5":[4,16],"kimi-k2.6":[4,16],"kimi-k2.7":[7,27],"kimi-k3":[21,105],"qwen-vl-max":[3,9],"qwen-plus":[0.8,2],"moonshot-v1-8k":[12,12],"moonshot-v1-32k":[24,24],"moonshot-v1-128k":[60,60]};
function hxBillYuan(model,inC,outC,imgs){var p=HX_PRICE["kimi-k2.5"];for(var k in HX_PRICE){if(model&&String(model).indexOf(k)===0){p=HX_PRICE[k];break;}}return Math.ceil((inC||0)/2)/1e6*p[0]+Math.ceil((outC||0)/2)/1e6*p[1]+(imgs||0)*0.005;}
function hxBill(app,what,inC,outC,model,imgs){try{var c=hxBillYuan(model,inC,outC,imgs);var arr=JSON.parse(localStorage.getItem("hx_aibill")||"[]");arr.unshift({app:app,what:what||"",cost:+c.toFixed(4),t:Date.now()});if(arr.length>500)arr.length=500;localStorage.setItem("hx_aibill",JSON.stringify(arr));return c;}catch(e){return 0;}}
function hxBillToast(c){ if(c>0) toast('💰 这一笔约 '+c.toFixed(4)+' 元（已记账）'); }

/* ── AI通道：千问优先，罢工自动换Kimi（与PPT同款药方） ── */
function qwenKey(){ return (localStorage.getItem('hx_qwenkey')||localStorage.getItem('bg_qwen_key')||'').replace(/^\s+|\s+$/g,''); }
function kimiKey(){ return (localStorage.getItem('hx_apikey')||localStorage.getItem('bg_apikey')||'').replace(/^\s+|\s+$/g,''); }
function kimiModel(){ return localStorage.getItem('hx_aimodel')||'kimi-k2.6'; }

function aiChat(sys, usr, onOk, onErr){
  var used={model:'', sys:sys, usr:usr};
  function doQwen(){
    var k=qwenKey(); if(!k) return false;
    used.model='qwen-plus';
    fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
      body:JSON.stringify({model:'qwen-plus',messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:1024})
    }).then(function(r){
      if(!r.ok) return r.text().then(function(tx){ throw new Error('千问 HTTP '+r.status+'：'+String(tx||'').slice(0,100)); });
      return r.json();
    }).then(function(j){
      var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!c) throw new Error('千问没说出话来');
      hxBillToast(hxBill('大管家','名片(qwen-plus)',(sys||'').length+(usr||'').length,(c||'').length,'qwen-plus'));
      onOk(c);
    }).catch(function(e){
      if(kimiKey()){ toast('千问这条路不通（'+e.message.slice(0,40)+'），自动换Kimi接着干',3500); doKimi(); }
      else onErr(e.message);
    });
    return true;
  }
  function doKimi(){
    var k=kimiKey(); if(!k){ onErr('还没有API Key（千问、Kimi都没有）'); return; }
    var model=kimiModel(); used.model=model;
    fetch('https://api.moonshot.cn/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
      body:JSON.stringify({model:model,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:16384})
    }).then(function(r){
      if(!r.ok) return r.text().then(function(tx){ throw new Error('Kimi HTTP '+r.status+'：'+String(tx||'').slice(0,100)); });
      return r.json();
    }).then(function(j){
      var msg=j.choices&&j.choices[0]&&j.choices[0].message;
      var c=msg?msg.content:'';
      if(Array.isArray(c)) c=c.map(function(x){return x.text||x.content||'';}).join('');
      if(!c) throw new Error('Kimi没说出话来');
      hxBillToast(hxBill('大管家','名片('+model+')',(sys||'').length+(usr||'').length,(c||'').length,model));
      onOk(c);
    }).catch(function(e){ onErr(e.message); });
  }
  if(!doQwen()) doKimi();
}

function keyInputAsk(){
  hxAsk('把千问或Kimi的API key贴这里（sk-开头）：','', 'sk-...', function(k){
    if(k===null) return;
    k=k.replace(/^\s+|\s+$/g,'');
    if(!k) return;
    hxAsk('这是哪家的Key？输入 qwen=千问 / kimi=Kimi','kimi','',function(w){
      if(w===null) return;
      w=(w||'').toLowerCase();
      if(w.indexOf('qwen')>=0||w==='千问'){ localStorage.setItem('hx_qwenkey',k); toast('✅ 千问Key已存进公共钱罐'); }
      else { localStorage.setItem('hx_apikey',k); toast('✅ Kimi Key已存进公共钱罐'); }
    },'存');
  });
}

/* ── 名片库 hx_cards_v1（全家共享） ── */
var LS_CARDS='hx_cards_v1';
function cardsLoad(){ try{ var c=JSON.parse(localStorage.getItem(LS_CARDS)); return (c&&c.items&&typeof c.items==='object')?c:{v:1,items:{}}; }catch(e){ return {v:1,items:{}}; } }
function cardsSave(cs){ try{ localStorage.setItem(LS_CARDS, JSON.stringify(cs)); }catch(e){ toast('名片库存储失败：'+e.message); } }

/* ── 扫描全家资料 ── */
function scanSources(){
  var out=[];
  try{
    var notes=JSON.parse(localStorage.getItem('study_notes_v1'))||[];
    if(!Array.isArray(notes)) notes=[];
    notes.forEach(function(n){
      var title=n.title||'无题', body=n.content||'';
      out.push({key:'notes:'+n.id, app:'notes', appName:'笔记', title:title,
                text:title+'\n'+body, sig:title.length+'/'+body.length+'/'+(n.updatedAt||0)});
    });
  }catch(e){}
  try{
    var store=JSON.parse(localStorage.getItem('xitixuexi_v01'))||{};
    var banks=store.banks||[];
    banks.forEach(function(b){
      (b.questions||[]).forEach(function(q,idx){
        var stem=(q.q||'').slice(0,60);
        var ans=q.a||'';
        out.push({key:'xiti:'+(b.id||b.name)+'::'+idx, app:'xiti', appName:'习题',
                  title:'【'+(b.name||'题库')+'】'+stem+(stem.length>=60?'…':''),
                  text:'题目：'+(q.q||'')+'\n答案：'+ans,
                  sig:((q.q||'').length)+'/'+ans.length+'/'+(b.id||b.name)});
      });
    });
  }catch(e){}
  return out;
}

/* ── 家底总览 ── */
function renderOverview(){
  var src=scanSources(), cs=cardsLoad();
  var nN=src.filter(function(x){return x.app==='notes';}).length;
  var nX=src.length-nN;
  var cN=0,cX=0,stale=0;
  src.forEach(function(s){
    var c=cs.items[s.key];
    if(c&&c.sig===s.sig){ if(s.app==='notes')cN++; else cX++; }
    else if(c) stale++;
  });
  $('stNotes').textContent='共 '+nN+' 篇，名片 '+cN+' 张'+(nN?'（'+Math.round(cN/nN*100)+'%）':'');
  $('stXiti').textContent='共 '+nX+' 题，名片 '+cX+' 张'+(nX?'（'+Math.round(cX/nX*100)+'%）':'');
  $('barNotes').style.width=nN?Math.round(cN/nN*100)+'%':'0%';
  $('barXiti').style.width=nX?Math.round(cX/nX*100)+'%':'0%';
  var missing=src.length-(cN+cX);
  if(src.length===0) showMsg($('ovMsg'),'还没扫到学习笔记和习题。先去那两个软件里写一点，再回来。','info');
  else if(missing>0) showMsg($('ovMsg'),'还有 '+missing+' 篇没名片（含源内容改过的）。开门我自动做3篇，着急就点「做名片」。','info');
  else showMsg($('ovMsg'),'✅ 名片全部齐了，随时来问我。','ok');
  return missing;
}

/* ── 做名片（分步外显） ── */
var cardRunning=false;
function progLine(html, cls){
  var log=$('progLog'); log.style.display='block';
  var d=document.createElement('div'); if(cls) d.className=cls; d.innerHTML=html;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function makeCardQueue(limit){
  var src=scanSources(), cs=cardsLoad(), q=[];
  for(var i=0;i<src.length;i++){
    var c=cs.items[src[i].key];
    if(!c||c.sig!==src[i].sig) q.push(src[i]);
    if(limit&&q.length>=limit) break;
  }
  return q;
}
function runCards(limit){
  if(cardRunning){ toast('正在做着呢，别急'); return; }
  if(!qwenKey()&&!kimiKey()){ showMsg($('cardMsg'),'还没有API Key，先贴一个（千问便宜，做名片首推）。','err'); keyInputAsk(); return; }
  var q=makeCardQueue(limit);
  if(!q.length){ showMsg($('cardMsg'),'✅ 没有欠账，名片都是新的。','ok'); return; }
  cardRunning=true; $('btnCards').disabled=true; $('btnCardsAll').disabled=true;
  $('progLog').innerHTML=''; 
  progLine('🤖 开工：这一批做 <b>'+q.length+'</b> 张名片（千问优先，罢工自动换Kimi）');
  var t0=Date.now(), done=0, fail=0;
  (function next(){
    if(!q.length){
      cardRunning=false; $('btnCards').disabled=false; $('btnCardsAll').disabled=false;
      progLine('🏁 收工：成功 '+done+' 张'+(fail?'，失败 '+fail+' 张（下批重试）':'')+'，用时 '+Math.round((Date.now()-t0)/1000)+' 秒','step-done');
      renderOverview(); renderCardList();
      return;
    }
    var s=q.shift(), no=done+fail+1, total=done+fail+q.length+1;
    progLine('🔨 第 '+no+'/'+total+' 张：<span id="curStep">'+esc(s.title.slice(0,40))+'</span> <span style="color:#8a8178">（'+s.appName+'）</span>','step-doing');
    var ts=Date.now();
    var sys='您是医学学习资料浓缩助手。把用户给的资料压成"名片"，规矩：\n'+
            '1. 第一行写"名片："+80字以内的概括（什么病/什么药/什么操作/核心要点）\n'+
            '2. 第二行写"关键词："+3~6个词，顿号隔开\n'+
            '3. 只许概括原文，一个字都不许外加；原文没有的内容不许编\n'+
            '4. 只输出这两行，不要任何解释';
    var usr=s.text.slice(0,4000);
    aiChat(sys, usr, function(ans){
      var card='', kw='';
      String(ans).split('\n').forEach(function(ln){
        if(/^名片[:：]/.test(ln)) card=ln.replace(/^名片[:：]\s*/,'').trim();
        else if(/^关键词[:：]/.test(ln)) kw=ln.replace(/^关键词[:：]\s*/,'').trim();
      });
      if(!card) card=String(ans).replace(/\n/g,' ').slice(0,80);
      card=card.slice(0,80); /* 自家契约：名片≤80字，AI啰嗦也截（验证员D3抓到） */
      if(!card.replace(/^\s+|\s+$/g,'')){ fail++; progLine('❌ 这张AI交了白卷，下批重试：'+esc(s.title.slice(0,30)),'step-err'); next(); return; } /* 白卷不入库不占sig（验证员D2抓到） */
      var cs=cardsLoad();
      cs.items[s.key]={app:s.app,title:s.title,card:card,kw:kw,sig:s.sig,t:Date.now()};
      cardsSave(cs);
      done++;
      progLine('✅ '+esc(card.slice(0,50))+' <span style="color:#8a8178">（'+Math.round((Date.now()-ts)/1000)+'秒）</span>','step-done');
      next();
    }, function(e){
      fail++;
      progLine('❌ 这张没做成：'+esc(s.title.slice(0,30))+'（'+esc(e.slice(0,40))+'）','step-err');
      next();
    });
  })();
}
$('btnCards').onclick=function(){ runCards(10); };
$('btnCardsAll').onclick=function(){ runCards(0); };

/* ── 名片浏览 ── */
function renderCardList(){
  var cs=cardsLoad(), f=$('kwFilter').value.replace(/^\s+|\s+$/g,'').toLowerCase();
  var keys=Object.keys(cs.items);
  var html='', shown=0;
  keys.sort(function(a,b){ return (cs.items[b].t||0)-(cs.items[a].t||0); });
  for(var i=0;i<keys.length;i++){
    var c=cs.items[keys[i]];
    if(f && (c.title+' '+c.card+' '+c.kw).toLowerCase().indexOf(f)<0) continue;
    shown++;
    if(shown>100){ html+='<div style="font-size:13px;color:#8a8178;padding:6px 0;">…还有，用上面筛选缩小范围</div>'; break; }
    html+='<div class="cc"><div class="cc-head"><span class="badge badge-'+c.app+'">'+(c.app==='notes'?'笔记':'习题')+'</span></div>'+
          '<div class="cc-title">'+esc(c.title)+'</div>'+
          '<div class="cc-card">'+esc(c.card)+'</div>'+
          (c.kw?'<div class="cc-kw">🏷 '+esc(c.kw)+'</div>':'')+'</div>';
  }
  if(!shown) html='<div style="font-size:13px;color:#8a8178;padding:6px 0;">'+(keys.length?'没有符合筛选的名片':'还没有名片，点上面「做名片」')+'</div>';
  $('cardList').innerHTML=html;
}
$('kwFilter').oninput=renderCardList;

/* ── 开门：总览 + 自动做3篇（有Key才动） ── */
renderOverview(); renderCardList();
(function(){
  var missing=makeCardQueue(1).length;
  if(missing && (qwenKey()||kimiKey())){
    toast('📇 有资料还没名片，自动先做3张…');
    runCards(3);
  }
})();
</script>
