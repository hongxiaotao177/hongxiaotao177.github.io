<style>

.pcard .nm{font-size:19px;font-weight:600}

.pcard .cnt{margin-left:auto;background:#efe4cd;color:var(--brown2);border-radius:999px;padding:3px 10px;font-size:13px}

.btn.sec{background:#e9dfc8;color:var(--brown2)}
.btn.red{background:var(--red)}
.btn.grn{background:var(--grn)}

<script>
'use strict';
const SW_VERSION='0.2.0';
const $=id=>document.getElementById(id);
const esc=s=>s; // 一律textContent渲染
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200);}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');}
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};

/* ---------- v0.2.0 照片存档:IndexedDB 'pai-db'/store 'photos', key=照片id ----------
   localStorage只存台账,照片只在本机IndexedDB(不进备份)。idb全异步且可能不可用(隐私模式/老浏览器),
   所有读写带兜底:失败返回false/null,调用方降级为"不存图"并提示,绝不崩。 */
const IDB={
  _db:null,_broken:false,
  open(){return new Promise(res=>{
    if(IDB._db)return res(IDB._db);
    if(IDB._broken||!window.indexedDB){IDB._broken=true;return res(null);}
    try{
      const rq=indexedDB.open('pai-db',1);
      rq.onupgradeneeded=()=>{rq.result.createObjectStore('photos');};
      rq.onsuccess=()=>{IDB._db=rq.result;res(IDB._db);};
      rq.onerror=()=>{IDB._broken=true;res(null);};
    }catch(e){IDB._broken=true;res(null);}
  });},
  async put(k,v){const db=await IDB.open();if(!db)return false;
    return new Promise(res=>{try{const tx=db.transaction('photos','readwrite');
      tx.objectStore('photos').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});},
  async get(k){const db=await IDB.open();if(!db)return null;
    return new Promise(res=>{try{const rq=db.transaction('photos','readonly').objectStore('photos').get(k);
      rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(e){res(null);}});},
  async del(k){const db=await IDB.open();if(!db)return false;
    return new Promise(res=>{try{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(k);
      tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
};
/* 存档图:最长边1600px jpeg0.75(约200-400KB),idb存的就是它 */
async function makeArchive(dataURL){
  const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=dataURL;});
  let w=img.naturalWidth,h=img.naturalHeight;const m=1600;
  if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',0.75);
}
/* 缩略图:异步从idb读,读不到用内存data兜底,再不行灰块;点它全屏看大图 */
function thumbEl(phOrEntry){
  const img=document.createElement('img');img.className='thumb';img.alt='图';
  const id=phOrEntry.photoId||phOrEntry.id;
  (async()=>{const d=await IDB.get(id);img.src=d||phOrEntry.data||'';})();
  img.addEventListener('click',e=>{e.stopPropagation();if(img.src)openImgView(img.src);});
  return img;
}
function openImgView(src){$('imgViewImg').src=src;$('imgView').style.display='flex';}
$('imgView').addEventListener('click',()=>{$('imgView').style.display='none';});

/* ---------- 数据 ---------- */
const STEMS='甲乙丙丁戊己庚辛壬癸';
function patients(){return LS.get('pai_patients',[])}
function savePatients(p){LS.set('pai_patients',p)}
function entries(){return LS.get('pai_entries',[])}
function saveEntries(e){LS.set('pai_entries',e)}
function genCode(){
  const now=new Date(),mm=String(now.getMonth()+1).padStart(2,'0'),dd=String(now.getDate()).padStart(2,'0');
  let seq=LS.get('pai_seq',0);LS.set('pai_seq',seq+1);
  const s=STEMS[seq%10]+(seq>=10?Math.floor(seq/10)+1:'');
  return 'P-'+mm+dd+'-'+s;
}
function addPatient(name,bed){
  const p={id:'p'+Date.now()+Math.random().toString(36).slice(2,6),code:genCode(),name:name.trim(),bed:(bed||'').trim(),archived:false,created:Date.now()};
  const ps=patients();ps.push(p);savePatients(ps);return p;
}
function todayCount(pid){
  const d=new Date();const key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  return entries().filter(e=>e.pid===pid&&new Date(e.time).getFullYear()+'-'+(new Date(e.time).getMonth()+1)+'-'+new Date(e.time).getDate()===key).length;
}
function guardLog(){return LS.get('pai_guardlog',[])}
/* 看门人:真名->代号 */
function guardOut(text){
  let out=String(text),hits=[];
  for(const p of patients()){
    if(p.name&&out.includes(p.name)){out=out.split(p.name).join(p.code);hits.push(p.code);}
  }
  if(hits.length){const lg=guardLog();lg.push({t:Date.now(),codes:hits});LS.set('pai_guardlog',lg);}
  return out;
}

/* ---------- v0.1.4 识别账本（pai_bill_v1,别串小涛的xt_aibill_v1） ---------- */
const PAI_PRICE={ // 2026-08-14官价,每月复查
  'moonshot-v1-8k-vision-preview':{in:12,out:12},
  'moonshot-v1-32k-vision-preview':{in:24,out:24},
  'moonshot-v1-128k-vision-preview':{in:60,out:60},
  'kimi-k2.5':{in:4,out:16},
  'kimi-k2.6':{in:4,out:16}
}; // 元/百万tokens,未知模型按8k-vision估
function bill(){const b=LS.get('pai_bill_v1',null);return b||{calls:0,in:0,out:0,est:0,byModel:{},byPatient:{},log:[]};}
function billAiUse(pid,model,usage,inChars,outChars,what){
  const b=bill();let est=false,tin=0,tout=0;
  if(usage&&(usage.prompt_tokens!=null||usage.completion_tokens!=null)){
    tin=usage.prompt_tokens|0;tout=usage.completion_tokens|0; // 视觉模型的图片token含在prompt_tokens里
  }else{est=true;tin=1000+Math.ceil((inChars|0)/2);tout=Math.ceil((outChars|0)/2);} // 图约1000token+文字字符/2
  model=model||'moonshot-v1-8k-vision-preview';
  b.calls++;b.in+=tin;b.out+=tout;if(est)b.est++;
  if(!b.byModel[model])b.byModel[model]={calls:0,in:0,out:0};
  const bm=b.byModel[model];bm.calls++;bm.in+=tin;bm.out+=tout;
  if(pid){if(!b.byPatient[pid])b.byPatient[pid]={calls:0,in:0,out:0,yuan:0};
    const bp=b.byPatient[pid];bp.calls++;bp.in+=tin;bp.out+=tout;
    const pr=PAI_PRICE[model]||PAI_PRICE['moonshot-v1-8k-vision-preview'];
    bp.yuan+=(tin*pr.in+tout*pr.out)/1e6;}
  b.log.push({t:Date.now(),model:model,in:tin,out:tout,what:what||'识别'}); // what预留
  if(b.log.length>50)b.log=b.log.slice(-50);
  LS.set('pai_bill_v1',b);
}
function billYuan(){const b=bill();let y=0;for(const m in b.byModel){const p=PAI_PRICE[m]||PAI_PRICE['moonshot-v1-8k-vision-preview'],e=b.byModel[m];y+=(e.in*p.in+e.out*p.out)/1e6;}return y;}
function billYuanOf(pid){const bp=bill().byPatient[pid];return bp?bp.yuan:0;}
function billFmt(y,fix){return y<0.01?'不足1分钱':'¥'+y.toFixed(fix);}

let maskNat={w:1,h:1};
function openMask(){show('vMask');loadMaskPhoto();}
function rawPhotos(){return S.photos.filter(x=>x.status==='raw');}
function loadMaskPhoto(){
  const list=rawPhotos();if(S.maskIdx>=list.length){finishMaskAll();return;}
  const ph=list[S.maskIdx];
  fitMode='fill'; // v0.2.0 每张默认铺满工作区(横图铺满高度/竖图铺满宽度),⇄切'fit'全图适应

/* v0.2.0 显式显示尺寸体系(不靠CSS自适应):
   MD.w/MD.h = 图片在工作区内的contain显示尺寸, MD.ox/MD.oy = 居中偏移;
   #maskZoom显式width/height=MD.w/MD.h、left/top=偏移; 黑块坐标=图片0~1相对坐标×MD.w/MD.h, 所见即所得 */
const MD={w:0,h:0,ox:0,oy:0};
function fitImage(){
  const wrap=$('maskWrap'),zoom=$('maskZoom'),img=$('maskImg');
  if(!maskNat.w||!maskNat.h)return;
  const W=wrap.clientWidth,H=wrap.clientHeight;
  const scale=Math.min(W/maskNat.w,H/maskNat.h); // contain算法
  MD.w=Math.max(1,Math.round(maskNat.w*scale));MD.h=Math.max(1,Math.round(maskNat.h*scale));
  MD.ox=(W-MD.w)/2;MD.oy=(H-MD.h)/2;
  img.style.width=MD.w+'px';img.style.height=MD.h+'px';
  zoom.style.width=MD.w+'px';zoom.style.height=MD.h+'px';
  zoom.style.left=MD.ox+'px';zoom.style.top=MD.oy+'px';
}
/* v0.2.0 适配模式:'fill'铺满工作区(初始缩放见zoomReset) / 'fit'全图适应(s=1) */
let fitMode='fill';
/* v0.1.5 顺时针转90°:canvas把dataURL转正替换当前照片(横拍转正再遮,AI收到的也是正图) */
function rotateMaskPhoto(){
  const list=rawPhotos();const ph=list[S.maskIdx];if(!ph)return;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=img.naturalHeight;c.height=img.naturalWidth;
    const g=c.getContext('2d');
    g.translate(c.width,0);g.rotate(Math.PI/2);
    g.drawImage(img,0,0);
    ph.data=c.toDataURL('image/jpeg',0.92);
    S.maskBlocks=[]; // 坐标系变了不硬套,清空重摆默认顶部块
    loadMaskPhoto(); // v0.2.0 load内部会重算fitImage+zoomReset
    toast('已顺时针转90°，不满意可再点');
  };
  img.src=ph.data;
}
$('btnRotate').addEventListener('click',rotateMaskPhoto);
function buildBlocks(){
  const w=$('maskWrap');w.querySelectorAll('.blk').forEach(b=>b.remove());
  // v0.1.4 有老块(老数据/老会话)不丢,越界的拉回图内最近位置;没块才给默认黑块1
  if(S.maskBlocks&&S.maskBlocks.length){S.maskBlocks.forEach(clampBlk);}else{S.maskBlocks=[{x:0,y:0,w:1,h:0.08}];}
  renderBlocks();
}
function addBlock(){
  // 新块落在当前可视区域中心对应的图片坐标(v0.2.0:可视中心→减zoom偏移/Z→除MD显式尺寸)
  const wrap=$('maskWrap'),W=wrap.clientWidth,H=wrap.clientHeight;
  const cx=((W/2-MD.ox-Z.tx)/Z.s)/MD.w,cy=((H/2-MD.oy-Z.ty)/Z.s)/MD.h;
  const b={x:cx-0.2,y:cy-0.06,w:0.4,h:0.12};
  clampBlk(b);S.maskBlocks.push(b);renderBlocks();
}
$('btnAddBlk').addEventListener('click',addBlock);
function clampBlk(b){b.w=Math.max(0.03,Math.min(b.w,1));b.h=Math.max(0.02,Math.min(b.h,1));b.x=Math.max(0,Math.min(b.x,1-b.w));b.y=Math.max(0,Math.min(b.y,1-b.h));}
function renderBlocks(){
  const w=$('maskZoom');w.querySelectorAll('.blk').forEach(b=>b.remove()); // 挂进缩放层,随图transform
  const W=MD.w,H=MD.h; // v0.2.0 显式显示尺寸,不读clientWidth(clientHeight会被缩放外的布局影响)
  if(!W||!H)return;
  S.maskBlocks.forEach((b,i)=>{
    clampBlk(b);
    const d=document.createElement('div');d.className='blk';d.dataset.i=i;
    d.style.left=(b.x*W)+'px';d.style.top=(b.y*H)+'px';d.style.width=(b.w*W)+'px';d.style.height=(b.h*H)+'px';
    const h=document.createElement('div');h.className='hdl';d.appendChild(h);
    w.appendChild(d);bindBlk(d,h,b,i);
  });
}
function bindBlk(el,hdl,b,idx){
  let mode=null,sx=0,sy=0,ox=0,oy=0,ow=0,oh=0,moved=0;
  function down(e){
    if(e.touches&&e.touches.length>1){mode=null;return;} // v0.1.2 两指交给画布缩放
    const t=e.target===hdl?'resize':'move';mode=t;moved=0;
    const pt=e.touches?e.touches[0]:e;sx=pt.clientX;sy=pt.clientY;ox=b.x;oy=b.y;ow=b.w;oh=b.h;
    e.preventDefault();e.stopPropagation();
  }
  function move(e){
    if(!mode)return;if(e.touches&&e.touches.length>1){mode=null;return;}
    const pt=e.touches?e.touches[0]:e;
    const W=MD.w,H=MD.h; // v0.2.0 屏幕位移/(显示尺寸*缩放)=图片相对位移
    const dx=(pt.clientX-sx)/(W*Z.s),dy=(pt.clientY-sy)/(H*Z.s);moved+=Math.abs(dx)+Math.abs(dy);
    if(mode==='move'){b.x=ox+dx;b.y=oy+dy;}else{b.w=ow+dx;b.h=oh+dy;b.w=Math.min(b.w,1-ox);b.h=Math.min(b.h,1-oy);} // v0.1.4 把手缩放也不许越右下界
    clampBlk(b); // v0.1.4 全程硬夹图内(0~1,角都不许出)
    el.style.left=(b.x*W)+'px';el.style.top=(b.y*H)+'px';el.style.width=(b.w*W)+'px';el.style.height=(b.h*H)+'px';
    e.preventDefault();
  }
  function up(){mode=null;}
  el.addEventListener('mousedown',down);hdl.addEventListener('mousedown',down);
  el.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
  el.addEventListener('touchmove',move,{passive:false});el.addEventListener('touchend',up);
  el.addEventListener('dblclick',()=>{S.maskBlocks.splice(idx,1);renderBlocks();});
  let lt=0;
  el.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<350&&moved<0.01){S.maskBlocks.splice(idx,1);renderBlocks();}lt=n;});
}
/* v0.1.2 双指捏合缩放+双指平移:transform包一层maskZoom,黑块在内随图动,图片相对坐标不变,合成不用改 */
const Z={s:1,tx:0,ty:0};
function zoomApply(){$('maskZoom').style.transform='translate('+Z.tx+'px,'+Z.ty+'px) scale('+Z.s+')';}
function zoomSet(s){Z.s=Math.max(1,Math.min(4,s));zoomApply();}
function zoomBy(d){zoomSet(Z.s+d);}
/* v0.2.0 复位=回当前适配初始态:
   fill铺满:s=夹取(1~4, max(区宽/imgW,区高/imgH))——横图=区高/imgH铺满高度,竖图=区宽/imgW铺满宽度,tx/ty居中,超出双指平移看;
   fit全图:s=1,contain整图居中 */
function zoomReset(){
  const wrap=$('maskWrap'),W=wrap.clientWidth,H=wrap.clientHeight;
  if(!MD.w||!MD.h){Z.s=1;Z.tx=0;Z.ty=0;zoomApply();return;}
  Z.s=fitMode==='fill'?Math.max(1,Math.min(4,Math.max(W/MD.w,H/MD.h))):1;
  Z.tx=(W-MD.w*Z.s)/2;Z.ty=(H-MD.h*Z.s)/2;
  zoomApply();
}
$('btnFit').addEventListener('click',()=>{fitMode=fitMode==='fill'?'fit':'fill';zoomReset();toast(fitMode==='fill'?'已铺满工作区':'已显示全图');}); // v0.2.0 ⇄铺满/全图切换
$('btnZoomIn').addEventListener('click',()=>zoomBy(0.5));
$('btnZoomOut').addEventListener('click',()=>zoomBy(-0.5));
$('btnZoomReset').addEventListener('click',zoomReset);
(function(){
  const w=$('maskWrap');let prev=null;
  function cent(t1,t2){const r=w.getBoundingClientRect();return{d:Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY)||1,
    cx:(t1.clientX+t2.clientX)/2-r.left,cy:(t1.clientY+t2.clientY)/2-r.top};}
  w.addEventListener('touchstart',e=>{if(e.touches.length===2)prev=cent(e.touches[0],e.touches[1]);},{passive:false});
  w.addEventListener('touchmove',e=>{
    if(e.touches.length!==2)return;e.preventDefault(); // 防浏览器抢走手势
    const c=cent(e.touches[0],e.touches[1]);
    if(prev){
      const s0=Z.s;zoomSet(s0*c.d/prev.d);const k=Z.s/s0;
      Z.tx=c.cx-k*(prev.cx-Z.tx);Z.ty=c.cy-k*(prev.cy-Z.ty);zoomApply(); // 指尖下的内容点不动
    }
    prev=c;
  },{passive:false});
  w.addEventListener('touchend',e=>{prev=e.touches.length===2?cent(e.touches[0],e.touches[1]):null;});
  w.addEventListener('touchcancel',()=>{prev=null;});
  w.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?0.5:-0.5);},{passive:false}); // 鼠标后备
})();
/* 把黑块真正画进图片 */
function compositeMask(dataURL,blocks){
  return new Promise(res=>{
    const img=new Image();img.onload=()=>{
      const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
      const g=c.getContext('2d');g.drawImage(img,0,0);g.fillStyle='#000';
      for(const b of blocks){clampBlk(b);g.fillRect(b.x*c.width,b.y*c.height,b.w*c.width,b.h*c.height);}
      res(c.toDataURL('image/jpeg',0.9));
    };img.src=dataURL;
  });
}

    if(ph.status==='done'){const b=document.createElement('button');b.className='btn sm';b.textContent='去过目';b.addEventListener('click',()=>openReview(ph.id));r.appendChild(b);}
    if(ph.status==='fail'){
      const b=document.createElement('button');b.className='btn sec sm';b.textContent='重试';b.addEventListener('click',()=>{ph.status='queued';runQueue();renderQueue();});r.appendChild(b);
      const er=document.createElement('span');er.className='small';er.textContent=ph.err||'';r.appendChild(er);
    }
    c.appendChild(r);l.appendChild(c);
  });
}
async function encodeForVision(dataURL){
  const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=dataURL;});
  let w=img.naturalWidth,h=img.naturalHeight;const m=1600;
  if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',0.8);
}
const OCR_PROMPT='你是医疗文书OCR助手。把这张病历/化验/检查照片里的文字原样转录成文本。要求：①数值、单位、上下箭头一个不错；②不同检验/检查项目之间输出 ━━ 分隔；③只输出文字内容，不要评论；④看不到/认不出的字用〔?〕标出，不许猜编。';
/* v0.1.2 花名册自愈:调/v1/models按喜好挑视觉模型,缓存pai_vmodel;v1系2026-08-31下线后kimi兜底 */
const VMODEL_PREFS=['moonshot-v1-8k-vision-preview','moonshot-v1-32k-vision-preview','moonshot-v1-128k-vision-preview','kimi-k2.5','kimi-k2.6'];
async function visionModelPick(key){
  const cached=LS.get('pai_vmodel',null);if(cached)return cached;
  const k=(key||localStorage.getItem('xt_apikey')||'').replace(/^"|"$/g,'');
  const r=await fetch('https://api.moonshot.cn/v1/models',{headers:{'Authorization':'Bearer '+k}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();const ids=(j.data||[]).map(m=>m.id);
  const pick=VMODEL_PREFS.find(p=>ids.includes(p))||ids.find(id=>/vision/i.test(id));
  if(!pick)throw new Error('花名册里没有视觉模型');
  LS.set('pai_vmodel',pick);return pick;
}
async function callVision(dataURL){
  if(window.__mockVision){ // v0.1.4 mock可回{text,usage,model}顺便记账
    const m=await window.__mockVision(dataURL);
    if(m&&typeof m==='object'&&m.text!=null){callVision._usage=m.usage||null;callVision._model=m.model||'moonshot-v1-8k-vision-preview';return m.text;}
    callVision._usage=null;callVision._model='moonshot-v1-8k-vision-preview';return m;
  }
  const key=localStorage.getItem('xt_apikey');if(!key)throw new Error('未设置API Key');
  const img=await encodeForVision(dataURL);
  const H={'Content-Type':'application/json','Authorization':'Bearer '+key.replace(/^"|"$/g,'')};
  const mk=mdl=>JSON.stringify({model:mdl,messages:[{role:'user',content:[{type:'text',text:guardOut(OCR_PROMPT)},{type:'image_url',image_url:{url:img}}]}]});
  const post=mdl=>fetch('https://api.moonshot.cn/v1/chat/completions',{method:'POST',headers:H,body:mk(mdl)});
  let mdl=await visionModelPick(key),r=await post(mdl);
  if(r.status===404){localStorage.removeItem('pai_vmodel');mdl=await visionModelPick(key);r=await post(mdl);} // 自愈:清缓存重挑再试一次
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  callVision._usage=j.usage||null;callVision._model=mdl; // v0.1.4 记下usage给账本
  return j.choices[0].message.content;
}
async function runQueue(){
  if(S.qRunning)return;S.qRunning=true;
  try{
    let ph;
    while((ph=S.photos.find(x=>x.status==='queued'))){
      ph.status='doing';if($('vQueue').classList.contains('on'))renderQueue();
      try{ph.text=await callVision(ph.data);
        billAiUse(ph.pid,callVision._model,callVision._usage,OCR_PROMPT.length,(ph.text||'').length,'识别'); // v0.1.4 记账
        ph.status='done';
        if(ph.hasArch)ph.data=null; // v0.2.0 识别完成且idb已存档:内存丢原始大图防内存爆(重试的fail不丢)
      }
      catch(e){ph.status='fail';ph.err=String(e.message||e);}
      if($('vQueue').classList.contains('on'))renderQueue();
    }
  }finally{S.qRunning=false;}
}

function guessCat(t){

  if(/(CT|胸片|超声|MRI|报告|所见|印象)/.test(t))return'检查报告';
  if(/(查房|病程|今日|处理)/.test(t))return'病程记录';
  return'其他';
}

/* 趋势解析: 指标:数值+单位+↑↓ */
const VAL_RE=/([一-龥A-Za-z][一-龥A-Za-z0-9%·\/\(\)-]{0,15})\s*[:：]?\s*(-?\d+(?:\.\d+)?)\s*([A-Za-zμµ%\/\*\.\^\d-]{0,12})\s*([↑↓])?/g;
const SKIP_W=['日期','时间','姓名','床号','科室','标本','备注','2026','2025'];
function parseLabs(text){
  const out=[];let m;VAL_RE.lastIndex=0;
  while((m=VAL_RE.exec(text))){
    const name=m[1].trim();
    if(SKIP_W.some(w=>name.includes(w)))continue;
    if(!m[3]&&!m[4])continue; // 至少要单位或箭头
    out.push({name:name,value:parseFloat(m[2]),unit:m[3]||'',arrow:m[4]||''});
  }
  return out;
}
function buildTrends(list){
  const labs=list.filter(e=>e.cat==='化验').sort((a,b)=>a.time-b.time);
  const map={};
  for(const e of labs){
    const items=parseLabs(e.text);
    e._parsed=items;
    for(const it of items){(map[it.name]=map[it.name]||[]).push({t:e.time,value:it.value,unit:it.unit,arrow:it.arrow});}
  }
  return{labs,map};
}
function renderTrends(body,list){
  const{labs,map}=buildTrends(list);
  if(!labs.length){const d=document.createElement('div');d.className='card small';d.textContent='还没有「化验」类条目';body.appendChild(d);return;}
  const names=Object.keys(map);
  if(!names.length){const d=document.createElement('div');d.className='card small';d.textContent='这张没解析出指标';body.appendChild(d);return;}
  for(const nm of names){
    const c=document.createElement('div');c.className='card';
    const t=document.createElement('b');t.textContent=nm;c.appendChild(t);
    const tb=document.createElement('table');tb.className='tt';
    const hr=document.createElement('tr');['日期','值','单位','箭头'].forEach(x=>{const th=document.createElement('th');th.textContent=x;hr.appendChild(th);});tb.appendChild(hr);
    for(const r of map[nm]){
      const tr=document.createElement('tr');
      [fmtT(r.t).slice(0,10),String(r.value),r.unit,r.arrow].forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.appendChild(td);});
      tb.appendChild(tr);
    }
    c.appendChild(tb);body.appendChild(c);
  }
  const d=document.createElement('div');d.className='small';d.style.marginTop='8px';d.textContent='没解析出的化验条目会忽略，不硬凑。';body.appendChild(d);
}

/* 完整资料:标准Markdown,分类分节,按时间 */
function buildFullDoc(p,list){
  const lines=['# '+p.code+' 完整资料','','> 导出时间:'+fmtT(Date.now()),''];
  for(const cat of CATS){
    const items=list.filter(e=>e.cat===cat).sort((a,b)=>a.time-b.time);
    if(!items.length)continue;
    lines.push('## '+cat,'');
    for(const e of items){lines.push('### '+fmtT(e.time),'',e.text,'');}
  }
  return lines.join('\n');
}
function renderFull(body,p,list){
  const md=buildFullDoc(p,list);
  const c=document.createElement('div');c.className='card';
  const ta=document.createElement('textarea');ta.id='fullMd';ta.value=md;ta.style.minHeight='320px';c.appendChild(ta);
  const r=document.createElement('div');r.className='row';r.style.marginTop='8px';

  b1.addEventListener('click',()=>{copyText(md);});

  b2.addEventListener('click',()=>{

    }else{toast('无壳桥,已退化复制');copyText(md);}
  });
  r.appendChild(b1);r.appendChild(b2);c.appendChild(r);body.appendChild(c);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制'),()=>fallbackCopy(t));}
  else fallbackCopy(t);
}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}a.remove();}

/* 备份包:只有代号+内容,无真名。照片只在本机IndexedDB('pai-db'),不随备份走,换机需重拍/重传 */
function buildBackup(){
  return{app:'pai',ver:SW_VERSION,time:Date.now(),
    patients:patients().map(p=>({code:p.code,bed:p.bed,archived:p.archived,created:p.created})),
    entries:entries().map(e=>({code:(patients().find(p=>p.id===e.pid)||{}).code||'?',cat:e.cat,time:e.time,text:guardOut(e.text)}))};
}
async function ghPut(content){
  const u=LS.get('xt_gh_user',''),t=LS.get('xt_gh_tok',''),r=LS.get('xt_gh_repo','');
  if(!u||!t||!r)throw new Error('请先填GitHub三项');
  const url='https://api.github.com/repos/'+u+'/'+r+'/contents/pai-backup.json';
  const H={Authorization:'token '+t,'Content-Type':'application/json'};
  let sha;
  const g=await fetch(url,{headers:H});
  if(g.ok)sha=(await g.json()).sha;
  const body={message:'pai backup',content:btoa(unescape(encodeURIComponent(JSON.stringify(content))))};
  if(sha)body.sha=sha;
  const p=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify(body)});
  if(!p.ok)throw new Error('HTTP '+p.status);
}
async function ghGet(){
  const u=LS.get('xt_gh_user',''),t=LS.get('xt_gh_tok',''),r=LS.get('xt_gh_repo','');
  const url='https://api.github.com/repos/'+u+'/'+r+'/contents/pai-backup.json';
  const g=await fetch(url,{headers:{Authorization:'token '+t}});
  if(!g.ok)throw new Error('HTTP '+g.status);
  const j=await g.json();return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
}

function restoreBackup(data){
  for(const bp of data.patients||[]){
    let p=patients().find(x=>x.code===bp.code);
    if(!p){
      const name=prompt('恢复病人 '+bp.code+'，请填真名（可留空用代号）:')||bp.code;
      p=addPatient(name,bp.bed||'');p.code=bp.code;p.archived=!!bp.archived;
      const ps=patients();ps[ps.findIndex(x=>x.id===p.id)]=p;savePatients(ps);
    }
    for(const be of (data.entries||[]).filter(x=>x.code===bp.code)){
      const es=entries();
      if(!es.some(x=>x.pid===p.id&&x.time===be.time)){es.push({id:'e'+be.time+Math.random().toString(36).slice(2,5),pid:p.id,cat:be.cat,time:be.time,text:be.text});saveEntries(es);}
    }
  }
}
