<script>
(function(){
if(window.__CACHED_WEB_UPDATE__){try{
 var u=window.__CACHED_WEB_UPDATE__,doc=new DOMParser().parseFromString(u.html,'text/html'),code='';
 doc.querySelectorAll('script').forEach(function(s){if(!s.src&&s.textContent.indexOf("var STORE='aimanager_learning_state_v1'")>=0)code=s.textContent;});
 if(!code)throw new Error('cached_main_missing');
 var st=doc.querySelector('style');if(st){var old=document.querySelector('style');if(old)old.textContent=st.textContent;}
 document.body.innerHTML=doc.body.innerHTML;window.__APP_VERSION__=u.version;window.__CACHED_WEB_UPDATE__=null;(0,eval)(code);return;
}catch(e){try{console.error('缓存更新接管失败',e);localStorage.removeItem('aimanager_web_update_v1');}catch(e2){}location.reload();return;}}
(function(){
'use strict';
var STORE='aimanager_learning_state_v1', VERSION=window.__APP_VERSION__||'1.4.0';
var state={chats:[],currentId:'',books:[],presets:[]}, tab='ask', busy=false, bookBusy=false, migrated=false;
var glowRegistry={}, glowSeq=0, mapSeq={}, nativeSelection=null, pendingNative=null;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function now(){return Date.now();}
function defaults(){return [
 {name:'一步一步学明白',text:'请用清楚的大白话回答，重要观点附支持它的高质量参考文献，按参考文献格式列在末尾。'},
 {name:'帮我挑毛病',text:'请指出不严谨、遗漏和容易误解之处，再给出更稳妥的说法；重要判断附高质量参考文献。'},
 {name:'继续扩张知识地图',text:'从这个知识点向外扩一层，说明它和原有知识的关系；重要观点附高质量参考文献。'}
];}
function showToast(s){$('toastText').textContent=String(s);$('toast').classList.add('show');}
function hideToast(){$('toast').classList.remove('show');}
function logAct(event,ok,detail){
 try{if(!window.HX||!HX.bb)return;var d=detail||{};var text='学习 '+event+' '+Object.keys(d).map(function(k){return k+'='+String(d[k]).slice(0,60);}).join(' ');if(HX.bb.log)HX.bb.log(ok===false?'err':'act',text.slice(0,280));if(ok!==undefined&&HX.bb.job)HX.bb.job('学习 '+event,ok===true,ok===false?text:'');}catch(e){}
}
function normalize(s){
 if(!s||typeof s!=='object')throw new Error('bad_state');
 s.format='aimanager_learning_v1';
 s.chats=Array.isArray(s.chats)?s.chats:[];s.books=Array.isArray(s.books)?s.books:[];s.presets=Array.isArray(s.presets)&&s.presets.length?s.presets:defaults();
 s.chats.forEach(function(c){c.messages=Array.isArray(c.messages)?c.messages:[];c.annotations=Array.isArray(c.annotations)?c.annotations:[];c.map=c.map&&Array.isArray(c.map.nodes)?c.map:{nodes:[]};c.mapStatus=c.mapStatus||'';c.messages.forEach(function(m){if(m.status==='sending'){m.status='failed';m.failureReason='上次中途退出，请原样重发';}});});
 s.currentId=s.currentId||(s.chats[0]&&s.chats[0].id)||'';return s;
}
function loadLegacy(){var raw='';try{raw=localStorage.getItem('aimanager_state_v2')||'';}catch(e){}if(!raw){try{if(window.HX&&HX.store)raw=HX.store.get('aimanager_state_v2','')||'';}catch(e){}}if(!raw)return null;var old=JSON.parse(raw),presets=Array.isArray(old.presets)&&old.presets.length?old.presets:defaults();var chats=(Array.isArray(old.chats)?old.chats:[]).map(function(c){return {id:c.id||uid('chat'),title:c.title||'旧问话',created:c.created||now(),annotations:[],map:{nodes:[]},mapStatus:'',messages:(Array.isArray(c.messages)?c.messages:[]).map(function(m){var pi=presets.findIndex(function(p){return p.name===m.presetName;});return {id:m.id||uid('msg'),question:String(m.question||''),presetIndex:pi<0?0:pi,status:m.status==='answered'&&m.answer?'answered':'failed',failureReason:m.status==='answered'?'':'旧问话可原样重发',answer:m.answer?{text:String(m.answer.text||''),provider:m.answer.provider||'',ms:m.answer.ms||0}:undefined,attempts:m.attempts||[]};})};});migrated=true;return normalize({chats:chats,currentId:old.currentId||'',books:[],presets:presets});}
function loadState(){var raw='';try{raw=localStorage.getItem(STORE)||'';}catch(e){}if(!raw){try{if(window.HX&&HX.store)raw=HX.store.get(STORE,'')||'';}catch(e){}}if(raw){try{return normalize(JSON.parse(raw));}catch(e){logAct('旧学习账读取失败',false,{reason:'format'});}}try{var legacy=loadLegacy();if(legacy)return legacy;}catch(e){logAct('旧管家问话接回失败',false,{reason:'format'});}return normalize({chats:[],books:[],presets:defaults()});}
function saveState(){var json=JSON.stringify(state),errs=[];try{localStorage.setItem(STORE,json);}catch(e){errs.push('网页');}try{if(window.HX&&HX.store){var ok=HX.store.set(STORE,json);if(ok===false)errs.push('套装');}}catch(e2){errs.push('套装');}if(errs.length)throw new Error(errs.join('、')+'保存未成功');}
function currentChat(){return state.chats.find(function(c){return c.id===state.currentId;});}
function ensureChat(){var c=currentChat();if(c)return c;c={id:uid('chat'),title:'新问话',created:now(),messages:[],annotations:[],map:{nodes:[]},mapStatus:''};state.chats.unshift(c);state.currentId=c.id;return c;}
function cleanText(s){return String(s||'').replace(/\r/g,'').replace(/^\s{0,3}#{1,6}\s+/gm,'').replace(/\*\*|__|`/g,'').replace(/^\s*[-*]\s+/gm,'').replace(/^\s*[-—_]{3,}\s*$/gm,'').replace(/【三核：[^\n]*】/g,'').replace(/\n{3,}/g,'\n\n').trim();}
function splitRefs(text){var s=cleanText(text),m=s.match(/(?:^|\n)\s*(?:参考文献|参考资料|文献)[:：]?\s*\n?/i);if(!m||m.index<40)return {body:s,refs:[]};var at=m.index+(m[0].startsWith('\n')?1:0),body=s.slice(0,at).trim(),tail=s.slice(at+m[0].length-(m[0].startsWith('\n')?1:0)).trim();var refs=tail.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);return {body:body,refs:refs};}
function sentences(text){var parts=splitRefs(text),body=parts.body;var arr=(body.match(/[^。！？!?；;\n]+[。！？!?；;]?/g)||[]).map(function(x){return x.trim();}).filter(Boolean);return {sentences:arr,refs:parts.refs};}
function registerGlow(text,kind,ctx){var id='g'+(++glowSeq);glowRegistry[id]={text:String(text||''),kind:kind,ctx:ctx||{}};return id;}
function nativeAnnotationsFor(text,kind,ctx){
 var c=state.chats.find(function(x){return x.id===(ctx&&ctx.chatId);});if(!c)return [];
 return c.annotations.filter(function(a){return a.nativeSelection===true&&a.status==='done'&&a.sourceKind===kind&&a.sourceFullText===String(text||'')&&(a.messageId||'')===(ctx.messageId||'')&&(a.nodeId||'')===(ctx.nodeId||'')&&(a.bookId||'')===(ctx.bookId||'')&&(typeof a.sourceIndex==='number'?a.sourceIndex:-1)===(typeof ctx.sourceIndex==='number'?ctx.sourceIndex:-1)&&Number.isInteger(a.selectionStart)&&Number.isInteger(a.selectionEnd)&&a.selectionStart>=0&&a.selectionEnd>a.selectionStart&&a.selectionEnd<=String(text||'').length&&String(text||'').slice(a.selectionStart,a.selectionEnd)===a.sourceText;}).sort(function(a,b){return a.selectionEnd-b.selectionEnd||a.selectionStart-b.selectionStart;});
}
function glow(text,kind,ctx,cls){
 var raw=String(text||'');if(!raw.trim())return '';var id=registerGlow(raw,kind,ctx),marks=nativeAnnotationsFor(raw,kind,ctx),h='',pos=0;
 marks.forEach(function(a){if(a.selectionEnd<pos)return;h+=esc(raw.slice(pos,a.selectionEnd))+'<button class="badge selection-badge" data-annotation="'+a.id+'" aria-label="查看所选文字的概念解释">'+(a.number||1)+'</button>';pos=a.selectionEnd;});
 h+=esc(raw.slice(pos));return '<span class="glow '+(cls||'')+'" data-glow="'+id+'">'+h+'</span>';
}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open');}
function closeModal(){$('modal').classList.remove('open');}
function providerName(p){return p==='qwen'?'千问':p==='kimi'?'Kimi':p==='ds'?'DeepSeek':String(p||'');}
function callOne(which,sys,usr,opt){return new Promise(function(resolve){var done=false,timer=setTimeout(function(){if(done)return;done=true;logAct('问话超时',false,{provider:which,ms:25000});resolve({ok:false,reason:'timeout',provider:which,ms:25000});},(opt&&opt.timeoutMs)||window.__TEST_TIMEOUT__||25000);try{if(!window.HX||!HX.aip||typeof HX.aip.go!=='function')throw new Error('套装问话能力未准备好');HX.aip.go(sys,usr,{which:which},function(ok,txt,by){if(done)return;done=true;clearTimeout(timer);var valid=!!(ok&&typeof txt==='string'&&txt.trim());resolve(valid?{ok:true,text:txt.trim(),provider:by||which,ms:0}:{ok:false,reason:txt||'empty',provider:which,ms:0});});}catch(e){if(done)return;done=true;clearTimeout(timer);resolve({ok:false,reason:String(e.message||e),provider:which,ms:0});}});}
async function relay(sys,usr,opt){
 opt=opt||{};var order=(opt.order||['qwen','kimi','ds']).slice(),attempts=[];logAct(opt.event||'问话开始',undefined,{chars:String(usr||'').length});
 for(var i=0;i<order.length;i++){var p=order[i],started=now();logAct('问话尝试',undefined,{provider:p});var r=await callOne(p,sys,usr,opt);r.ms=now()-started;attempts.push({provider:p,ok:r.ok,reason:r.reason||'',ms:r.ms});if(r.ok){r.attempts=attempts;logAct(opt.event||'问话成功',true,{provider:r.provider,ms:r.ms,chars:r.text.length});return r;}logAct('问话失败换家',false,{provider:p,reason:String(r.reason).slice(0,70)});}
 return {ok:false,reason:'all_failed',attempts:attempts};
}
function reviewOrder(primary){return ['qwen','kimi','ds'].filter(function(x){return x!==primary;});}

function renderChats(){$('chatList').innerHTML=state.chats.map(function(c){return '<button class="chat-item" data-chat="'+c.id+'">'+esc(c.title||'问话')+'<br><small>'+c.messages.length+'条问话</small></button>';}).join('')||'<div class="empty">还没有历史对话</div>';}
function renderPresets(){var el=$('preset'),old=el.value;el.innerHTML=state.presets.map(function(p,i){return '<option value="'+i+'">'+esc(p.name)+'</option>';}).join('');if(old&&state.presets[parseInt(old,10)])el.value=old;$('presetList').innerHTML=state.presets.map(function(p){return '<div class="chat-item">'+esc(p.name)+'</div>';}).join('');}
function reviewHtml(r){if(!r)return '';var label=r.status==='pending'?'另一家AI正在核对':r.status==='done'?'另一家AI核对（只作复核，不当作真实性证明）':'另一家AI核对未完成';return '<div class="review"><b>'+esc(label)+'</b>'+(r.provider?' · '+esc(providerName(r.provider)):'')+'\n'+esc(r.text||'')+'</div>';}
function annotationsHtml(c,messageId){return c.annotations.filter(function(a){return a.messageId===messageId&&!a.nativeSelection;}).map(function(a){var title=a.kind==='explain'?'解释':'文献';return '<div class="annotation"><button class="link" data-annotation="'+a.id+'">'+esc(title)+'：'+esc(a.sourceText.slice(0,45))+'</button><div class="meta">'+(a.status==='pending'?'正在整理':a.status==='failed'?'这次没整理成':'已整理')+'</div></div>';}).join('');}

function validateMap(m,c){if(!m||!Array.isArray(m.nodes)||!m.nodes.length||m.nodes.length>60)throw new Error('map_shape');var ids={},validAnnotations={};c.annotations.forEach(function(a){validAnnotations[a.id]=true;});var validMessages={};c.messages.forEach(function(x){if(x.answer)validMessages[x.id]=true;});m.nodes=m.nodes.map(function(n,i){var id=String(n.id||('n'+i));if(ids[id])throw new Error('map_duplicate');ids[id]=true;var title=String(n.title||n.label||'').trim();if(!title)throw new Error('map_title');return {id:id,title:title.slice(0,40),parentId:n.parentId==null?'':String(n.parentId),summary:String(n.summary||'').slice(0,180),annotationIds:(Array.isArray(n.annotationIds)?n.annotationIds:[]).filter(function(x){return validAnnotations[x];}),messageIds:(Array.isArray(n.messageIds)?n.messageIds:[]).filter(function(x){return validMessages[x];})};});m.nodes.forEach(function(n){if(n.parentId&&!ids[n.parentId])n.parentId='';var seen={};while(n.parentId){if(seen[n.id]){n.parentId='';break;}seen[n.id]=true;n=m.nodes.find(function(x){return x.id===n.parentId;});if(!n)break;}});return {nodes:m.nodes};}
async function updateMap(c){if(!c||!c.messages.some(function(m){return m.answer;}))return;var seq=(mapSeq[c.id]||0)+1;mapSeq[c.id]=seq;c.mapStatus='pending';renderMap();var compact={nodes:c.map.nodes.map(function(n){return {id:n.id,title:n.title,parentId:n.parentId,summary:n.summary,annotationIds:n.annotationIds,messageIds:n.messageIds};})};var learning=c.messages.filter(function(m){return m.answer;}).slice(-8).map(function(m){return {messageId:m.id,question:m.question,answer:m.answer.text};});var notes=c.annotations.filter(function(a){return a.status==='done';}).map(function(a){return {annotationId:a.id,kind:a.kind,source:a.sourceText,text:a.text};});var sys='你是知识地图编辑。只返回一个JSON对象，不要Markdown。把学习问答和解释自动归置到合适知识点，可合并同义项、修复不当归属，但不得删除仍有内容的知识点。结构={"nodes":[{"id":"稳定短字符串","title":"人话短标题","parentId":"父节点id或空字符串","summary":"80字内摘要","annotationIds":["相关解释或文献id"],"messageIds":["相关问答id"]}]}。最多60个节点，层次清楚；所有给出的annotationId都要归置，未知id不得编造。';var usr='旧图：'+JSON.stringify(compact)+'\n问答：'+JSON.stringify(learning)+'\n解释和文献：'+JSON.stringify(notes);var r=await relay(sys,usr,{event:'脑图整理',timeoutMs:25000});if(mapSeq[c.id]!==seq)return;if(!r.ok){c.mapStatus='failed';logAct('脑图整理保留旧图',false,{reason:r.reason});renderMap();return;}try{var map=validateMap(parseJsonText(r.text),c);var linked={};map.nodes.forEach(function(n){n.annotationIds.forEach(function(id){linked[id]=true;});});var missing=c.annotations.filter(function(a){return a.status==='done'&&!linked[a.id];});if(missing.length){if(!map.nodes.length)throw new Error('empty_map');missing.forEach(function(a){map.nodes[0].annotationIds.push(a.id);});}c.map=map;c.mapStatus='done';saveState();logAct('脑图已保存',true,{nodes:map.nodes.length});}catch(e){c.mapStatus='failed';logAct('脑图结果不合格保留旧图',false,{reason:String(e.message||e)});}renderAll();}
async function reviewItem(c,owner,slot){if(!owner||!owner.text)return;slot=slot||owner;slot.review={status:'pending',text:'',provider:''};renderAll();var primary=owner.provider,sys='你是另一家AI的复核员。请核对解释是否准确、参考文献是否看起来真实且确实支持观点。只报告能确定的问题；无法联网核实时明确说无法确认，不能把另一家AI的认可当成文献真实性证明。';var r=await relay(sys,'待复核内容：\n'+owner.text.slice(0,12000),{order:reviewOrder(primary),event:'另一家核对'});if(r.ok)slot.review={status:'done',text:r.text,provider:r.provider};else slot.review={status:'failed',text:'这次没有核对成，原内容仍保留。',provider:''};try{saveState();}catch(e){logAct('核对结果保存失败',false,{reason:String(e.message||e)});}renderAll();}

function selectionNodeLength(n){if(n.nodeType===3)return n.nodeValue.length;if(n.nodeType===1&&n.hasAttribute('data-annotation'))return 0;var total=0;for(var i=0;i<n.childNodes.length;i++)total+=selectionNodeLength(n.childNodes[i]);return total;}

 var sel=window.getSelection&&window.getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return;var range=sel.getRangeAt(0),startEl=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,endEl=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement;var el=startEl&&startEl.closest?startEl.closest('.glow'):null;if(!el||!endEl||el!==endEl.closest('.glow')){nativeSelection=null;return;}var g=glowRegistry[el.getAttribute('data-glow')];if(!g){nativeSelection=null;return;}var start=selectionOffset(el,range.startContainer,range.startOffset),end=selectionOffset(el,range.endContainer,range.endOffset);if(start<0||end<=start||end>g.text.length){nativeSelection=null;return;}var text=g.text.slice(start,end);if(!text.trim()){nativeSelection=null;return;}nativeSelection={text:text,start:start,end:end,kind:g.kind,fullText:g.text,ctx:{chatId:g.ctx.chatId||'',messageId:g.ctx.messageId||'',nodeId:g.ctx.nodeId||'',bookId:g.ctx.bookId||'',sourceIndex:typeof g.ctx.sourceIndex==='number'?g.ctx.sourceIndex:-1}};$('selectionHint').textContent='已选 '+text.length+' 个字，点按钮确认';

 document.addEventListener('click',function(e){var t=e.target,el;
  if((el=t.closest('[data-update-check]'))){if(window.AppUpdater)AppUpdater.check(true);return;}
  if((el=t.closest('[data-native-confirm]'))){confirmNativeSelection();return;}
  if(t.closest('#nativeReselect')){closeModal();return;}
  if((el=t.closest('[data-tab-link]'))){setTab(el.getAttribute('data-tab-link'));return;}
  if((el=t.closest('[data-retry]'))){var c=currentChat(),m=c&&c.messages.find(function(x){return x.id===el.getAttribute('data-retry');});if(m)executeMessage(c,m,true);return;}
  if((el=t.closest('[data-save]'))){var c2=currentChat(),m2=c2&&c2.messages.find(function(x){return x.id===el.getAttribute('data-save');});if(m2){try{saveState();m2.saveFailed=false;logAct('重试保存成功',true,{});}catch(e2){m2.saveFailed=true;}renderMessages();}return;}
  if((el=t.closest('[data-repo]'))){var ri=el.getAttribute('data-repo'),item=document.querySelector('[data-repo-item="'+ri+'"]');state.currentId=ri;if(item)item.classList.toggle('open');return;}
  if((el=t.closest('[data-book]'))){var bi=el.getAttribute('data-book'),bitem=document.querySelector('[data-book-item="'+bi+'"]');if(bitem)bitem.classList.toggle('open');return;}
  if((el=t.closest('[data-node]'))){openNode(el.getAttribute('data-node'));return;}
  if((el=t.closest('[data-annotation]'))){var f=findAnnotation(el.getAttribute('data-annotation'));if(f&&f.annotation.nativeSelection&&el.classList.contains('selection-badge'))logAct('原生数字标点按',true,{chars:f.annotation.sourceText.length,start:f.annotation.selectionStart,end:f.annotation.selectionEnd});openAnnotation(el.getAttribute('data-annotation'));return;}
  if((el=t.closest('[data-annotation-retry]'))){var f2=findAnnotation(el.getAttribute('data-annotation-retry'));if(f2)runAnnotation(f2.chat,f2.annotation);return;}
 });
 document.addEventListener('selectionchange',captureNativeSelection);
}
function init(){state=loadState();bind();if(migrated){try{saveState();logAct('旧管家问话已接回',true,{chats:state.chats.length});}catch(e){showToast('旧问话已接回，但保存未完全成功。');}}renderAll();logAct('学习成员打开',undefined,{version:VERSION,chats:state.chats.length});var restored=0;state.chats.forEach(function(c){restored+=c.annotations.filter(function(a){return a.nativeSelection&&a.status==='done';}).length;});if(restored){var badges=document.querySelectorAll('.selection-badge').length;logAct('原生选字重开恢复',badges>0,{count:restored,badges:badges});}if(window.Standalone)Standalone.init();if(window.AppUpdater)AppUpdater.init(VERSION);}
window.__LEARNING_TEST__={getState:function(){return state;},setState:function(s){state=normalize(s);renderAll();},relay:relay,validateMap:validateMap,parseJsonText:parseJsonText,cleanText:cleanText,splitRefs:splitRefs,saveState:saveState,updateMap:updateMap,executeMessage:executeMessage,makeBook:makeBook,registerGlow:registerGlow,captureNativeSelection:captureNativeSelection,getNativeSelection:function(){return nativeSelection;}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
