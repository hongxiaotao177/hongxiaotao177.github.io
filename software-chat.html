function chatParsePdf(arrayBuffer, fileName, cb) {
  /* 照大管家 dsm_parsePDFWithEngine 真用法仿写：逐页getTextContent抽字join；空=扫描件 */
  try {

      var totalPages = pdf.numPages;
      var promises = [];
      for (var i = 1; i <= totalPages; i++) {
        promises.push(pdf.getPage(i).then(function(page) {
          return page.getTextContent().then(function(data) {
            return data.items.map(function(item) { return item.str; }).join(' ');
          });
        }));
      }
      Promise.all(promises).then(function(pagesText) {
        var textContent = pagesText.join('\n\n');
        if (textContent.replace(/^\s+|\s+$/g, '') === '') {
          cb(false, '这份PDF读不出字，可能是扫描件');
        } else {
          cb(true, textContent, totalPages);
        }
      }).catch(function(err) { cb(false, 'PDF没读成: ' + err.message); });
    }).catch(function(err) { cb(false, 'PDF没读成: ' + err.message); });
  } catch (e) { cb(false, 'PDF没读成: ' + e.message); }

/* ---------- 终审翻案①：AI直调（端点/模型名照HX.chat内部口径；which='kimi'|'qwen'|'auto'） ---------- */
function presetCallAI(sys, userText, which, cb) {
  try {
    /* v0.10.0 刀1（SPEC_t113 AI总泵归拢一期）：总泵在且未关→走HX.aip.go（trim/8192/截断续写/400哨兵=千问四治法总泵自带），aip不在或hx_aip_off=1→走老链（老体全保留）。注意：老链缺省序kimi→qwen→deepseek，归拢后照总泵口径千问→Kimi→DS */
    var _paAip = false;
    try { _paAip = !!(HX.aip && typeof HX.aip.go === 'function' && localStorage.getItem('hx_aip_off') !== '1'); } catch (eA) { _paAip = false; }
    if (_paAip) {
      try {
        var _paWhich = (which === 'kimi' || which === 'qwen') ? which : (which === 'deepseek' ? 'ds' : undefined);
        HX.aip.go(sys, userText, { which: _paWhich, maxTokens: 8192 }, function (ok, txt, by) {
          try { cb(!!ok, ok ? txt : ('没通：' + String(txt || 'AI都没回'))); } catch (eB) {}
        });
        return;
      } catch (eC) { /* 掉回老链 */ }
    }
    var tries = [];
    if (which === 'kimi') tries = ['kimi'];
    else if (which === 'qwen') tries = ['qwen'];
    else tries = ['kimi', 'qwen', 'deepseek'];
    function keyOf(w) {
      try {
        if (w === 'kimi') return (HX.keys.get && HX.keys.get()) || '';
        if (w === 'qwen') return (HX.keys.getQwen && HX.keys.getQwen()) || '';
        if (w === 'deepseek') { var o = HX.keys._loadFile ? HX.keys._loadFile() : null; return (o && o.deepseek) ? o.deepseek : ''; }
      } catch (e) {}
      return '';
    }
    var conf = {
      kimi: { url: 'https://api.moonshot.cn/v1/chat/completions', model: (function(){ try { return localStorage.getItem('hx_aimodel') || 'kimi-k2.7-code-highspeed'; } catch (e) { return 'kimi-k2.7-code-highspeed'; } })() },
      qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
      deepseek: { url: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' }
    };
    function attempt(idx) {
      if (idx >= tries.length) { cb(false, '没通：钥匙都没有或AI都没回'); return; }
      var w = tries[idx];
      var key = keyOf(w);
      key = String(key || '').replace(/^\s+|\s+$/g, ''); /* v0.4.1刀④（千问实现+Kimi终审）：钥匙trim去首尾空格 */
      if (!key) { attempt(idx + 1); return; }
      var c = conf[w];
      var _continued = false; /* v0.4.1刀②：截断续写硬上限1次（Kimi终审翻案1：千问把_continued写进then里每次重置=没闸，挪进attempt闭包成真闸） */
      function _send(msgs, acc) { /* v0.4.1刀②：发信收进函数，acc=已拼半截 */
        fetch(c.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model: c.model, messages: msgs, max_tokens: 8192 }) /* v0.4.1刀①：2048→8192（三家统一，治腰斩） */
        }).then(function (r) {
          if (!r.ok) { attempt(idx + 1); return { __skip: 1 }; } /* v0.4.1真bug修（千问实现+Kimi终审翻案2：千问!r.ok直return致下个then拿到undefined又跳一次=一家被跳过两次，补__skip哨兵）：HTTP400等不收→换下一家，不再当JSON误解析 */
          return r.json();
        }).then(function (j) {
          if (j && j.__skip) return; /* v0.4.1：哨兵路收工 */
          try {
            var txt = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
            var fr = j && j.choices && j.choices[0] ? j.choices[0].finish_reason : ''; /* v0.4.1刀②：读finish_reason判截断 */
            if (txt && fr === 'length' && !_continued) {
              _continued = true;
              var _m2 = msgs.slice(); /* slice拷贝不动原数组 */
              _m2.push({ role: 'assistant', content: txt });
              _m2.push({ role: 'user', content: '接着断处写，别重头' });
              _send(_m2, acc + txt);
              return;
            }
            if (txt && fr !== 'length') { cb(true, acc + txt); return; }
            /* 续写仍截断：半截信（多半是半截JSON）交了也解析不了，照SPEC换下一家 */
          } catch (e) {}
          attempt(idx + 1);
        }).catch(function () { attempt(idx + 1); });
      }
      _send([{ role: 'system', content: sys }, { role: 'user', content: userText }], '');
    }
    attempt(0);
  } catch (e) { cb(false, e && e.message ? e.message : 'AI调用失败'); }
}

/* ===== t127 鱼骨版面三期（SPEC_t127，洪老师2026-10-26晚拍板最高优先）：fbParse/fbRender/fbFull新增+applyFishbone重写；DS出稿+Kimi终审翻案2处亲手落地（①异步重排只重建鱼骨容器fbBox不抹🗑/by/点亮块②无子级行一律按叶走全屏）；✕常驻另治=drawer-header改sticky（想法17:09病根=整个抽屉滚头顶栏跟着跑） ===== */
/* 刀1：fbParse(text)→树。行首「- 」一级、「-- 」二级、「--- 」三级（容忍全角／记号后无空格）；无记号行=上一节点正文续行；三级之外并进三级正文；全文无记号行→return []。返回 [{t:标题,c:正文,k:[子级]}] */
function fbParse(text) {
  try {
    var src = String(text == null ? '' : text).replace(/\r/g, '');
    var lines = src.split('\n');
    var root = [];
    var cur1 = null, cur2 = null, cur3 = null;
    var hasMark = false;
    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var s = String(raw).replace(/^\s+/, '');
      s = s.replace(/　/g, ' ').replace(/－/g, '-').replace(/—/g, '-').replace(/–/g, '-'); /* t127：全角空格/全角减号/破折号转半角 */
      var m3 = /^---\s*(.*)$/.exec(s);
      var m2 = /^--\s*(.*)$/.exec(s);
      var m1 = /^-\s*(.*)$/.exec(s);
      if (m3) {
        hasMark = true;
        var t3 = String(m3[1] || '').replace(/^\s+|\s+$/g, '');
        if (!cur2) { if (!cur1) { cur1 = { t: '', c: '', k: [] }; root.push(cur1); } cur2 = { t: '', c: '', k: [] }; cur1.k.push(cur2); }
        cur3 = { t: t3, c: '', k: [] };
        cur2.k.push(cur3);
      } else if (m2) {
        hasMark = true;
        var t2 = String(m2[1] || '').replace(/^\s+|\s+$/g, '');
        if (!cur1) { cur1 = { t: '', c: '', k: [] }; root.push(cur1); }
        cur2 = { t: t2, c: '', k: [] };
        cur1.k.push(cur2);
        cur3 = null;
      } else if (m1) {
        hasMark = true;
        var t1 = String(m1[1] || '').replace(/^\s+|\s+$/g, '');
        cur1 = { t: t1, c: '', k: [] };
        root.push(cur1);
        cur2 = null; cur3 = null;
      } else {
        var body = String(raw).replace(/^\s+|\s+$/g, '');
        if (!body) continue;
        if (cur3) { cur3.c = cur3.c ? (cur3.c + '\n' + body) : body; }
        else if (cur2) { cur2.c = cur2.c ? (cur2.c + '\n' + body) : body; }
        else if (cur1) { cur1.c = cur1.c ? (cur1.c + '\n' + body) : body; }
        else { cur1 = { t: '', c: body, k: [] }; root.push(cur1); }
      }
    }
    if (!hasMark) return [];
    return root;
  } catch (e) { return []; }
}

function loadCurrentChat() {
  if (!window.HX || !HX.chat) {
    $warnBar.style.display = 'block';
    return;
  }
  
  var id = HX.chat.getCur();
  if (!id) {
    id = HX.chat.newChat();
    HX.chat.setCur(id);

  curChatId = id;
  var chatObj = HX.chat.load(id);
  if (!chatObj || !(chatObj.msgs && chatObj.msgs.length)) { /* Kimi终审翻案E：新对话有存档但msgs空，也要出欢迎泡（原判null欢迎泡永不出） */

    $memLine.style.display = 'none';

function showDrawer() {
  $drawer.className = 'drawer open';
}

function hideDrawer() {
  $drawer.className = 'drawer';
}

function renderDrawerList() {
  if (!window.HX || !HX.chat) {
    $drawerList.innerHTML = '<div class="drawer-item"><div class="drawer-item-title">加载失败</div></div>';
    return;
  }
  
  var list = HX.chat.list() || [];
  $drawerList.innerHTML = '';
  
  if (list.length === 0) {
    var emptyItem = document.createElement('div');
    emptyItem.className = 'drawer-item';
    emptyItem.innerHTML = '<div class="drawer-item-title">暂无历史对话</div>';
    $drawerList.appendChild(emptyItem);
    return;
  }
  
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var el = document.createElement('div');
    el.className = 'drawer-item';
    
    var updatedDate = new Date(item.updated);
    var timeStr = (updatedDate.getMonth() + 1) + '/' + updatedDate.getDate() + ' ' +
                  pad2(updatedDate.getHours()) + ':' + pad2(updatedDate.getMinutes());
    
    el.innerHTML = 
      '<div class="drawer-item-title">' + (item.title || '无标题') + '</div>' +
      '<div class="drawer-item-meta">' + timeStr + ' · ' + (item.turns || 0) + '轮</div>' +
      '<button class="drawer-item-del" data-id="' + item.id + '">🗑</button>';
    
    el.onclick = (function(id) {
      return function() {
        HX.chat.setCur(id);
        hideDrawer();
        loadCurrentChat();
      };
    })(item.id);
    
    var delBtn = el.querySelector('.drawer-item-del');
    delBtn.onclick = (function(id, e) {
      e.stopPropagation();
      if (confirm('确定删除该对话？')) {
        HX.chat.del(id);
        if (id === curChatId) { curChatId = null; loadCurrentChat(); } /* Kimi终审翻案D：删的是正聊的这条，主区跟着刷新 */
        renderDrawerList();
      }
    }).bind(null, item.id);
    
    $drawerList.appendChild(el);
  }
}

document.addEventListener('DOMContentLoaded', function() {

});

<script>
/* v0.7.0 刀D：📚收发室逻辑（独立script块，全try护栏；zgOn/createBubble/escHtml等在主块，缺席静默） */
(function(){
  function $(id){ return document.getElementById(id); }
  function esc(s){ try{ return (typeof escHtml==='function') ? escHtml(String(s)) : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }catch(e){ return ''; } }
  function on(){ try{ return (typeof zgOn==='function') && zgOn(); }catch(e){ return false; } }
  function toast(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  var room=$('zgRoom'), body=$('zgRoomBody');
  if(!room||!body) return;
  var $btn=$('zgBtn');
  if($btn){ if(!on()){ $btn.style.display='none'; } }
  /* 公共件三级加载晚到场景：每3秒复查10拍，zg到岗就把📚钮亮回来（治晚到永藏） */
  (function(){ var n=0; var t=setInterval(function(){ n++; try{ if($btn && on()){ $btn.style.display=''; clearInterval(t); return; } }catch(e){} if(n>=10) clearInterval(t); }, 3000); })();
  function close(){ try{ room.className='drawer'; }catch(e){} }
  var $x=$('zgRoomClose'); if($x) $x.onclick=close;
  /* v0.18.0 t123 刀4：📚收发室➖缩小成迷你钮（方便边对话边点亮取用） */
  try {
    if (localStorage.getItem('hx_mini_off') !== '1' && $('zgRoomClose')) {
      var _miniZ = document.createElement('button');
      _miniZ.textContent = '➖';
      _miniZ.className = 'drawer-close';
      _miniZ.style.marginRight = '6px';
      _miniZ.onclick = function () { try { close(); miniFloat('📚', function () { try { if ($btn) $btn.click(); } catch (eR) {} }); } catch (e) {} };
      $('zgRoomClose').parentNode.insertBefore(_miniZ, $('zgRoomClose'));
    }
  } catch (eMiniZ) {}
  if(!$btn) return;
  $btn.onclick=function(){
    try{
      if(!on()){ toast('总管没在岗（公共件没装上或总开关关着）'); return; }
      room.className='drawer open';
      renderBooks();
    }catch(e){}
  };
  function row(html, onclick){
    var d=document.createElement('div');
    d.style.cssText='padding:10px 8px;border-bottom:1px solid #eee;font-size:15px;';
    d.innerHTML=html;
    if(onclick) d.onclick=onclick;
    return d;
  }
  function smallBtn(label, fn){
    var b=document.createElement('button');
    b.className='top-btn';
    b.style.cssText='margin:2px 4px 2px 0;font-size:13px;padding:4px 8px;';
    b.textContent=label;
    b.onclick=function(ev){ try{ ev.stopPropagation(); }catch(e){} try{ fn(); }catch(e2){} };
    return b;
  }
  /* 取最近一条AI回信 */
  function lastAiText(){
    try{
      var d=HX.chat.load(curChatId);
      if(d && (d.msgs instanceof Array)){
        for(var i=d.msgs.length-1;i>=0;i--){
          if(d.msgs[i] && d.msgs[i].r==='a' && d.msgs[i].c) return String(d.msgs[i].c);
        }
      }
    }catch(e){}
    return '';
  }
  function renderBooks(){
    body.innerHTML='';
    var books=[];
    try{ books=HX.zg.listBooks(); }catch(e){ books=[]; }
    if(!books.length){ body.appendChild(row('<span style="color:#999;">小涛的书架上还没有书</span>')); return; }
    books.forEach(function(bk){
      body.appendChild(row('<b>📖 '+esc(bk.title)+'</b><span style="color:#999;font-size:12px;">（'+bk.chapters.length+'章，点开看章）</span>', function(){ renderChaps(bk); }));
    });
  }
  function renderChaps(bk){
    body.innerHTML='';
    body.appendChild(row('<a style="color:#4a6b4f;">← 返回书架</a>', renderBooks));
    body.appendChild(row('<b>📖 '+esc(bk.title)+'</b>'));
    bk.chapters.forEach(function(ch, idx){
      var wrap=document.createElement('div');
      wrap.style.cssText='padding:8px;border-bottom:1px solid #eee;';
      var t=document.createElement('div');
      t.style.cssText='font-size:15px;margin-bottom:4px;';
      t.textContent='第'+(idx+1)+'章 '+ch.t;
      wrap.appendChild(t);
      var bar=document.createElement('div');
      /* 📥取进对话：章正文贴进输入框（待发，不直发） */
      bar.appendChild(smallBtn('📥取进对话', function(){
        try{
          var txt=HX.zg.getChap(bk.id, ch.id);
          if(txt===null){ toast('这章还没正文'); return; }
          var $ta=document.getElementById('inputArea');
          if($ta){ $ta.value='【《'+bk.title+'》'+ch.t+' 原文】\n'+txt+'\n【我的事】\n'; }
          close(); toast('章已取进输入框，补一句您要干啥再发');
        }catch(e){ toast('取章失败'); }
      }));
      /* 🪄融最近回信 */
      bar.appendChild(smallBtn('🪄融最近回信', function(){
        try{
          var mat=lastAiText();
          if(!mat){ toast('本对话还没有AI回信可融'); return; }
          if(!window.confirm('把本对话最近一条AI回信融进「'+ch.t+'」？旧版自动留底可退回。')) return;
          close();
          zgTryCmd('把材料融进《'+bk.title+'》第'+(idx+1)+'章');
        }catch(e){ toast('命令发不出去'); }
      }));
      /* ↩历史版 */
      bar.appendChild(smallBtn('↩历史版', function(){
        try{
          var hs=HX.zg.histList(bk.id, ch.id);
          if(!hs.length){ toast('这章没有留底旧版'); return; }
          var menu='留底旧版（新的在前）：\n';
          for(var i=0;i<hs.length;i++){
            var d=new Date(hs[i].ts);
            menu+=(i+1)+'. '+(d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'　'+hs[i].len+'字　'+hs[i].why+'\n';
          }
          var pick=window.prompt(menu+'\n退回第几版？输序号（别的不动）：','1');
          var n=parseInt(pick,10);
          if(!(n>=1 && n<=hs.length)) return;
          if(!window.confirm('把「'+ch.t+'」退回第'+n+'版？现在的版本也会留底，不丢。')) return;
          var ok=HX.zg.rollback(bk.id, ch.id, hs[n-1].ts);
          toast(ok?'已退回，现在的版本也留了底':'退回失败，章没动');
        }catch(e){ toast('退回失败'); }
      }));
      wrap.appendChild(bar);
      body.appendChild(wrap);
    });
  }
})();

/* ════ v0.9.0 t110刀1：📦话仓浮层（SPEC_t110_话仓）════
   顶部总账+话题数数+条目列表（点开看问答/📥塞书走现成chatSendBook/🗑删）。
   开关hx_hc_off=1藏钮；照zgBtn逻辑公共件晚到3秒复查10拍。 */
(function(){
  function $(id){ return document.getElementById(id); }
  function on(){ try{ return !!(window.HX&&HX.hc)&&localStorage.getItem('hx_hc_off')!=='1'; }catch(e){ return false; } }
  function toast(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  function esc(s){ try{ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }catch(e){ return ''; } }
  var room=$('hcRoom'), body=$('hcRoomBody');
  if(!room||!body) return;
  var $btn=$('hcBtn');
  if($btn){ if(!on()){ $btn.style.display='none'; } }
  /* 公共件三级加载晚到场景：每3秒复查10拍，hc到岗就把📦钮亮回来 */
  (function(){ var n=0; var t=setInterval(function(){ try{ n++; if(on()){ if($btn) $btn.style.display=''; clearInterval(t); } if(n>=10) clearInterval(t); }catch(e){ clearInterval(t); } },3000); })();
  function close(){ room.classList.remove('open'); }
  if($('hcRoomClose')) $('hcRoomClose').onclick=close;
  /* v0.18.0 t123 刀4：📦话仓➖缩小成迷你钮 */
  try {
    if (localStorage.getItem('hx_mini_off') !== '1' && $('hcRoomClose')) {
      var _miniH = document.createElement('button');
      _miniH.textContent = '➖';
      _miniH.className = 'drawer-close';
      _miniH.style.marginRight = '6px';
      _miniH.onclick = function () { try { close(); miniHcPanel(function () { try { if ($btn) $btn.click(); } catch (eR) {} }); } catch (e) {} }; /* v0.19.0 t124刀4：改落迷你列表 */
      $('hcRoomClose').parentNode.insertBefore(_miniH, $('hcRoomClose'));
    }
  } catch (eMiniH) {}
  if($btn) $btn.onclick=function(){ try{ if(!on()){ toast('话仓没上岗（hx-common没到或已退休）'); return; } render(); room.classList.add('open'); }catch(e){} };
  function fmtT(ts){ try{ var d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }catch(e){ return ''; } }
  function smallBtn2(txt, fn){ var b=document.createElement('button'); b.style.cssText='font-size:13px;color:#4a6b4f;background:#eef5ee;border:1px solid #cfe0cf;border-radius:12px;padding:4px 10px;margin-right:6px;'; b.textContent=txt; b.onclick=fn; return b; }
  function render(){
    body.innerHTML='';
    /* 顶部总账 */
    var head=document.createElement('div');
    head.style.cssText='padding:10px;border-bottom:1px solid #eee;';
    var tot={n:0,turns:0};
    try{ tot=HX.hc.count(''); }catch(e){}
    head.innerHTML='<div style="font-size:15px;margin-bottom:8px;">📦 仓里共存 <b>'+tot.n+'</b> 条 · <b>'+tot.turns+'</b> 轮问答</div>';
    /* 话题数数行 */
    var row0=document.createElement('div');
    row0.style.cssText='display:flex;align-items:center;gap:6px;';
    var inp=document.createElement('input');
    inp.style.cssText='flex:1;font-size:14px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;';
    inp.placeholder='输入话题，数数仓里存了多少';
    var cntBtn=smallBtn2('数数', function(){
      try{
        var tp=inp.value.replace(/^\s+|\s+$/g,'');
        if(!tp){ toast('先写个话题词'); return; }
        var r=HX.hc.count(tp);
        resLine.textContent='「'+tp+'」话题：仓里存了 '+r.n+' 条';
        resLine.style.display='block';
      }catch(e){ toast('数数出错'); }
    });
    row0.appendChild(inp); row0.appendChild(cntBtn);
    head.appendChild(row0);
    var resLine=document.createElement('div');
    resLine.style.cssText='display:none;margin-top:6px;font-size:14px;color:#4a6b4f;font-weight:bold;';
    head.appendChild(resLine);
    /* t125刀3b：🧹洗净全仓钮——逐条detail→qa逐个clean→_writeDetail写回，confirm先问，洗完黑框报N条；hx_hc_clean2_off=1不显 */
    try {
      var _t125c2off = (localStorage.getItem('hx_hc_clean2_off') === '1');
      if (!_t125c2off) {
        var _cleanRow = document.createElement('div');
        _cleanRow.style.cssText = 'margin-top:8px;';
        var _cleanBtn = smallBtn2('🧹洗净全仓', function(){
          try {
            if (!window.confirm('把仓里所有条目按书格式重洗一遍？只去废符号，问答内容不删。')) return;
            var _lst = HX.hc.list();
            var _n = 0;
            var _t126left = []; /* t126刀4b：没洗动条目名单 */
            for (var _ci = 0; _ci < _lst.length; _ci++) {
              var _rec = _lst[_ci]; if (!_rec) continue;
              var _det = HX.hc.detail(_rec.id); if (!_det || !(_det.qa instanceof Array)) { _t126left.push(_rec); continue; }
              var _chg = false;
              for (var _qi = 0; _qi < _det.qa.length; _qi++) {
                var _p = _det.qa[_qi]; if (!_p) continue;
                var _nq = HX.hc.clean(_p.q), _na = HX.hc.clean(_p.a);
                if (_nq !== _p.q || _na !== _p.a) { _p.q = _nq; _p.a = _na; _chg = true; }
              }
              if (_chg) { try { if (HX.hc._writeDetail) HX.hc._writeDetail(_det); } catch (eW) {} _n++; }
              else { _t126left.push(_rec); }
            }
            try { if (typeof hxToastHold === 'function') { hxToastHold('洗净' + _n + '条，' + _t126left.length + '条没洗动'); } else { toast('洗净' + _n + '条，' + _t126left.length + '条没洗动'); } } catch (eT) {}
            try { if (_t126left.length > 0 && window.HX && HX.bb && HX.bb.job) { var _t126titles = _t126left.map(function (r) { return String((r && r.title) || '').slice(0, 20); }).join(' | '); HX.bb.job('t126_clean_left', true, 'n=' + _t126left.length + ' titles=' + _t126titles); } } catch (e126L) {}
            render();
          } catch (eC) { toast('洗净出错'); }
        });
        _cleanRow.appendChild(_cleanBtn);
        head.appendChild(_cleanRow);
      }
    } catch (eClean) {}
    body.appendChild(head);
    /* 条目列表 */
    var lst=[];
    try{ lst=HX.hc.list().slice().reverse(); }catch(e){}
    if(!lst.length){
      var emp=document.createElement('div');
      emp.style.cssText='padding:20px;text-align:center;color:#999;font-size:14px;';
      emp.textContent='话仓还空着——跟AI总管聊几句，问答自动存进来';
      body.appendChild(emp);
      return;
    }
    lst.forEach(function(rec){
      if(!rec) return;
      var wrap=document.createElement('div');
      wrap.style.cssText='padding:10px;border-bottom:1px solid #eee;';
      var t=document.createElement('div');
      t.style.cssText='font-size:15px;margin-bottom:4px;cursor:pointer;';
      /* t122-1刀3：条目标题加下划线（总开关hx_t122_off=1不加） */
      try { if (localStorage.getItem('hx_t122_off') !== '1') { t.style.textDecoration = 'underline'; } } catch (eU) {}
      /* t125刀2（终审补）：条目规格扶正=问句首句20字+轮数+日期 */
      t.textContent='📦 '+String(rec.title||'未命名').slice(0,20)+'（'+(rec.turns||0)+'轮 · '+fmtT(rec.updated)+'）';
      var detailBox=document.createElement('div');
      detailBox.style.cssText='display:none;margin-top:6px;';
      var opened=false;
      /* t125刀1+刀2：条目行click+touchstart双路（照t123刀1排除button写法），移动超10px取消防误触；detail取不到黑框明说；点击记黑匣子；总闸hx_t125_off=1全退 */
      var _t125off12=false; try{ _t125off12=(localStorage.getItem('hx_t125_off')==='1'); }catch(eO12){}
      var _t125Open=function(){
        try{
          try{ if(window.HX&&HX.bb&&HX.bb.job) HX.bb.job('t125_hc_click',true,'id='+String(rec.id||'')+' title='+String(rec.title||'').slice(0,40)); }catch(eBB){} /* t126刀3a：第二参传对象=永记败假账，改字符串 */
          if(!opened){
            opened=true;
            detailBox.style.display='block';
            var det=HX.hc.detail(rec.id);
            if(!det||!(det.qa instanceof Array)||!det.qa.length){
              try{ if(typeof hxToastHold==='function'){ hxToastHold('这条仓里读不出（可能已清）'); } else { toast('这条仓里读不出（可能已清）'); } }catch(eTN){}
            }
            if(det&&det.qa){
              det.qa.forEach(function(pair){
                var pb=document.createElement('div');
                pb.style.cssText='margin-bottom:8px;padding:6px;background:#fafafa;border-radius:8px;';
                pb.innerHTML='<div style="font-size:13px;color:#333;margin-bottom:4px;"><b>问：</b>'+esc(pair.q)+'</div>';
                /* t127刀6：答区改走fbParse+fbRender鱼骨树（想法12:10/15:05/17:13话仓也要鱼骨），解析不出退回原文显示 */
                var _ansBox=document.createElement('div');
                _ansBox.style.cssText='font-size:13px;color:#666;max-height:200px;overflow:auto;';
                _ansBox.innerHTML='<b>答：</b>';
                var _ansBody=document.createElement('div');
                var _ansTree=null; try{ _ansTree=fbParse(String(pair.a||'')); }catch(eAP){}
                var _ansOk=false;
                if(_ansTree&&_ansTree.length>=1){ try{ _ansOk=fbRender(_ansBody,_ansTree); }catch(eAF){} }
                if(!_ansOk){ _ansBody.style.whiteSpace='pre-wrap'; _ansBody.textContent=String(pair.a||''); }
                _ansBox.appendChild(_ansBody);
                pb.appendChild(_ansBox);
                var bar=document.createElement('div');
                bar.style.cssText='margin-top:4px;';
                bar.appendChild(smallBtn2('📥塞书', function(){
                  try{ if(typeof chatSendBook==='function') chatSendBook('问：'+pair.q+'\n\n答：'+pair.a); else toast('塞书通道没上岗'); }catch(e){ toast('塞书失败'); }
                }));
                pb.appendChild(bar);
                detailBox.appendChild(pb);
              });
            }
            var delBar=document.createElement('div');
            delBar.style.cssText='margin-top:6px;text-align:right;';
            delBar.appendChild(smallBtn2('🗑删掉这条', function(){
              try{ if(window.confirm('把「'+(rec.title||'')+'」整条从话仓删掉？')){ HX.hc.del(rec.id); render(); toast('已删'); } }catch(e){}
            }));
            detailBox.appendChild(delBar);
          } else {
            detailBox.style.display = detailBox.style.display==='none' ? 'block' : 'none';
          }
        }catch(e){ /* t126刀3b：炸了不静默——黑框报原因+黑匣子带e.message；hx_hc_click2_off=1退回静默 */
          try{
            var _t126c2off=false; try{ _t126c2off=(localStorage.getItem('hx_hc_click2_off')==='1'); }catch(eO3){}
            if(!_t126c2off){
              var _t126msg=String((e&&e.message)||e||'');
              try{ if(typeof hxToastHold==='function'){ hxToastHold('这条打开失败：'+_t126msg); } else { toast('这条打开失败：'+_t126msg); } }catch(eTN2){}
              try{ if(window.HX&&HX.bb&&HX.bb.job){ HX.bb.job('t125_hc_click_err',false,'msg='+_t126msg); } }catch(eBB2){}
            }
          }catch(eO4){}
        }
      };
      /* t125刀1：click+touchstart双路，touchstart兜底真机WebView吞click；移动超10px取消 */
      if(_t125off12){
        t.onclick=_t125Open;
      } else {
        var _t125ty=0,_t125drag=false;
        t.addEventListener('touchstart',function(e){ try{ _t125ty=e.touches[0].clientY; _t125drag=false; }catch(e1){} },{passive:true});
        t.addEventListener('touchmove',function(e){ try{ if(Math.abs(e.touches[0].clientY-_t125ty)>10) _t125drag=true; }catch(e2){} },{passive:true});
        t.addEventListener('touchend',function(e){ try{ if(_t125drag){ _t125drag=false; return; } e.preventDefault(); _t125Open(); }catch(e3){} },{passive:false});
        t.onclick=_t125Open;
      }
      wrap.appendChild(t);
      wrap.appendChild(detailBox);
      body.appendChild(wrap);
    });
  }
})();
</script>
