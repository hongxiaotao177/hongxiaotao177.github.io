<script>
function hxCommonLoad(onHxReady, onHxMissing){
  function runTxt(txt){ try{ var s=document.createElement('script'); s.textContent=txt; document.head.appendChild(s); }catch(e){} }
  function ok(){ return !!(window.HX && window.HX.HX_COMMON_VERSION); }
  function miss(){ try{ if(onHxMissing) onHxMissing(); }catch(e){} }
  function good(){ try{ if(onHxReady) onHxReady(); }catch(e){} }
  if(window.LearnShell){
    var f=null; try{ f=LearnShell.readFile('hx-common.js'); }catch(e){}
    if(f){ try{ runTxt(decodeURIComponent(escape(atob(String(f).replace(/\s+/g,''))))); if(ok()){ good(); return; } }catch(e){} }
  }
  var _c=new AbortController(); var _t=setTimeout(function(){ _c.abort(); }, 8000);
  fetch('hx-common.js?t='+Date.now(), {cache:'no-store', signal:_c.signal}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.text();
  }).then(function(txt){
    clearTimeout(_t); runTxt(txt);
    if(ok()){ good(); } else { hxCommonInstall(good, miss); }
  }).catch(function(){ clearTimeout(_t); hxCommonInstall(good, miss); });
}
function hxCommonInstall(good, miss){
  var _c=new AbortController(); var _t=setTimeout(function(){ _c.abort(); }, 30000);
  fetch('https://hongxiaotao177.github.io/hx-common.js?t='+Date.now(), {cache:'no-store', signal:_c.signal}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.text();
  }).then(function(txt){
    clearTimeout(_t);
    try{ if(window.LearnShell && LearnShell.folderSet && LearnShell.folderSet()) LearnShell.writeFile('hx-common.js', btoa(unescape(encodeURIComponent(txt)))); }catch(e){}
    try{ var s=document.createElement('script'); s.textContent=txt; document.head.appendChild(s); }catch(e){}
    if(window.HX && window.HX.HX_COMMON_VERSION){ good(); } else { miss(); }
  }).catch(function(){ clearTimeout(_t); miss(); });
}
hxCommonLoad(function(){}, function(){});
</script>

<script>
// SW_VERSION 全局变量
var SW_VERSION = "0.2.0";

// 全局状态
var curChatId = null;
var isSending = false;
var sendAbortTimer = null;
var toastTimeout = null;

// DOM缓存
var $warnBar = document.getElementById('warnBar');
var $memLine = document.getElementById('memLine');
var $mainArea = document.getElementById('mainArea');
var $inputArea = document.getElementById('inputArea');
var $sendBtn = document.getElementById('sendBtn');
var $menuBtn = document.getElementById('menuBtn');
var $newBtn = document.getElementById('newBtn');
var $drawer = document.getElementById('drawer');
var $drawerClose = document.getElementById('drawerClose');
var $drawerList = document.getElementById('drawerList');
var $pullCloudBtn = document.getElementById('pullCloudBtn');
var $toastContainer = document.getElementById('toastContainer');
var $toastText = document.getElementById('toastText');
var $toastClose = document.getElementById('toastClose');

// 工具函数
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); } /* Kimi终审翻案A：AI回信/用户输入先转义再换行，防「血钾<3.5」被当标签吃掉、防注入 */
function pad2(n){ return (n<10?'0':'')+n; } /* Kimi终审翻案B：padStart是ES2017老WebView可能没有，改手动补零 */
function formatDate(date) {
  return pad2(date.getHours()) + ':' + pad2(date.getMinutes());
}

function formatTime(timeMs) {
  var d = new Date(timeMs);
  return formatDate(d);
}

function showToast(msg) {
  $toastText.textContent = msg;
  $toastContainer.className = 'toast-container show';
  if (toastTimeout) clearTimeout(toastTimeout);
  // 不自动消失，需手动关闭
}

function hideToast() {
  $toastContainer.className = 'toast-container';
}

/* ===== v0.2.0 成书塞章节：📥送入书（DS实现+Kimi终审翻案2处：①hxToastHold(msg)签名错改showToast（本页黑框常驻带✕）；②curChatTitle不存在改HX.chat.load(curChatId)取title） ===== */
function chatLoadXtBooks() {
  try {
    var raw = null;
    try {
      if (window.HX && HX.store && HX.store.has && HX.store.has()) {
        raw = HX.store.get('xt_books_v1', null);
      }
    } catch (e0) { raw = null; }
    if (raw === null || raw === undefined) {
      try { raw = localStorage.getItem('xt_books_v1'); } catch (e1) { raw = null; }
    }
    if (!raw) return [];
    var arr = null;
    try { arr = JSON.parse(raw); } catch (e2) { arr = null; }
    if (!arr || !(arr instanceof Array)) return [];
    return arr;
  } catch (e) { return []; }
}

function chatSendBook(letterText) {
  try {
    var books = chatLoadXtBooks();
    if (!books || !books.length) {
      try { showToast('小涛笔记里还没有书，先去✍️小涛笔记建一本'); } catch (e0) {}
      return;
    }
    chatShowBookLayer(books, letterText);
  } catch (e) {
    try { showToast('送入书失败'); } catch (e2) {}
  }
}

function chatShowBookLayer(books, letterText) {
  try {
    var old = document.getElementById('chatBookMask');
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var mask = document.createElement('div');
    mask.id = 'chatBookMask';
    mask.className = 'chat-book-mask';

    var card = document.createElement('div');
    card.className = 'chat-book-card';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'chat-book-close';
    closeBtn.innerHTML = '✕';
    closeBtn.onclick = function() {
      try { if (mask.parentNode) mask.parentNode.removeChild(mask); } catch (e) {}
    };
    card.appendChild(closeBtn);

    var titleEl = document.createElement('div');
    titleEl.className = 'chat-book-title';
    titleEl.textContent = '选一本书';
    card.appendChild(titleEl);

    var listEl = document.createElement('div');
    listEl.className = 'chat-book-list';

    for (var i = 0; i < books.length; i++) {
      (function(bk) {
        try {
          if (!bk) return;
          var row = document.createElement('div');
          row.className = 'chat-book-row';
          var chs = (bk.chapters && bk.chapters.length) ? bk.chapters.length : 0;
          row.textContent = '📖 ' + (bk.title || bk.name || '未命名') + '（' + chs + '章）';
          row.onclick = function() {
            try { chatShowChapLayer(mask, card, bk, letterText); } catch (e) {}
          };
          listEl.appendChild(row);
        } catch (e1) {}
      })(books[i]);
    }
    card.appendChild(listEl);

    mask.appendChild(card);
    mask.onclick = function(ev) {
      try { if (ev && ev.target === mask) { if (mask.parentNode) mask.parentNode.removeChild(mask); } } catch (e) {}
    };
    document.body.appendChild(mask);
  } catch (e) {
    try { showToast('送入书失败'); } catch (e2) {}
  }
}

function chatShowChapLayer(mask, card, bk, letterText) {
  try {
    while (card.firstChild) card.removeChild(card.firstChild);

    var closeBtn = document.createElement('button');
    closeBtn.className = 'chat-book-close';
    closeBtn.innerHTML = '✕';
    closeBtn.onclick = function() {
      try { if (mask.parentNode) mask.parentNode.removeChild(mask); } catch (e) {}
    };
    card.appendChild(closeBtn);

    var titleEl = document.createElement('div');
    titleEl.className = 'chat-book-title';
    titleEl.textContent = '《' + (bk.title || bk.name || '未命名') + '》选章';
    card.appendChild(titleEl);

    var listEl = document.createElement('div');
    listEl.className = 'chat-book-list';

    var newRow = document.createElement('div');
    newRow.className = 'chat-book-row chat-book-newrow';
    newRow.textContent = '➕ 新章…';
    newRow.onclick = function() {
      try {
        if (newRow.getAttribute('data-open') === '1') return;
        newRow.setAttribute('data-open', '1');
        var wrap = document.createElement('div');
        wrap.className = 'chat-book-newwrap';
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'chat-book-newinput';
        inp.placeholder = '章名';
        var okBtn = document.createElement('button');
        okBtn.className = 'chat-book-newok';
        okBtn.textContent = '确定';
        okBtn.onclick = function() {
          try {
            var nm = (inp.value || '').replace(/^\s+|\s+$/g, '');
            if (!nm) { try { showToast('章名不能为空'); } catch (e0) {} return; }
            chatConfirmSend(mask, bk, '', nm, letterText);
          } catch (e1) {}
        };
        wrap.appendChild(inp);
        wrap.appendChild(okBtn);
        newRow.appendChild(wrap);
        try { inp.focus(); } catch (e2) {}
      } catch (e3) {}
    };
    listEl.appendChild(newRow);

    var chs = (bk.chapters && bk.chapters.length) ? bk.chapters : [];
    for (var i = 0; i < chs.length; i++) {
      (function(ch) {
        try {
          if (!ch) return;
          var row = document.createElement('div');
          row.className = 'chat-book-row';
          row.textContent = ch.t || ch.title || '未命名章';
          row.onclick = function() {
            try { chatConfirmSend(mask, bk, ch.id || '', '', letterText); } catch (e) {}
          };
          listEl.appendChild(row);
        } catch (e1) {}
      })(chs[i]);
    }
    card.appendChild(listEl);
  } catch (e) {
    try { showToast('送入书失败'); } catch (e2) {}
  }
}

function chatConfirmSend(mask, bk, chapId, newChap, letterText) {
  try {
    var bkTitle = bk.title || bk.name || '未命名';
    var chapName = newChap;
    if (!chapName && chapId) {
      var chs0 = (bk.chapters && bk.chapters.length) ? bk.chapters : [];
      for (var i = 0; i < chs0.length; i++) {
        if (chs0[i] && chs0[i].id === chapId) { chapName = chs0[i].t || chs0[i].title || '未命名章'; break; }
      }
    }
    if (!chapName) chapName = '（最后一章）';
    var ok = false;
    try { ok = window.confirm('把这条AI回话塞进《' + bkTitle + '》/「' + chapName + '」？'); } catch (e0) { ok = false; }
    if (!ok) return;

    var arr = [];
    try {
      var raw = null;
      try {
        if (window.HX && HX.store && HX.store.has && HX.store.has()) {
          raw = HX.store.get('xt_inbox_v1', null);
        }
      } catch (e1) { raw = null; }
      if (raw === null || raw === undefined) {
        try { raw = localStorage.getItem('xt_inbox_v1'); } catch (e2) { raw = null; }
      }
      if (raw) {
        var parsed = null;
        try { parsed = JSON.parse(raw); } catch (e3) { parsed = null; }
        if (parsed && parsed instanceof Array) arr = parsed;
      }
    } catch (e4) { arr = []; }

    var curTitle = '';
    try {
      var curObj = (window.HX && HX.chat && HX.chat.load) ? HX.chat.load(curChatId) : null;
      if (curObj && curObj.title) curTitle = curObj.title;
    } catch (e5) { curTitle = ''; }
    var titleStr = '💬 ' + (curTitle || (letterText ? letterText.slice(0, 20) : ''));

    arr.push({
      title: titleStr,
      text: letterText,
      pt: '',
      ts: Date.now(),
      to: 'book',
      bookId: bk.id || '',
      chapId: chapId || '',
      newChap: newChap || ''
    });

    var jsonStr = JSON.stringify(arr);
    var wrote = false;
    try {
      if (window.HX && HX.store && HX.store.has && HX.store.has()) {
        HX.store.set('xt_inbox_v1', jsonStr);
        wrote = true;
      }
    } catch (e6) { wrote = false; }
    try { localStorage.setItem('xt_inbox_v1', jsonStr); wrote = true; } catch (e7) {}
    if (!wrote) {
      try { showToast('没寄出去：写入失败'); } catch (e8) {}
      return;
    }

    try { if (mask && mask.parentNode) mask.parentNode.removeChild(mask); } catch (e9) {}

    try { showToast('已寄出📮 打开✍️小涛笔记自动收进《' + bkTitle + '》/' + chapName); } catch (e10) {}

    try {
      if (window.HX && HX.bb && HX.bb.log) {
        HX.bb.log('note', 'chat 寄书 《' + bkTitle + '》/' + chapName + ' ' + (letterText ? letterText.length : 0) + '字');
      }
    } catch (e12) {}
  } catch (e) {
    try { showToast('没寄出去：' + (e && e.message ? e.message : '未知错误')); } catch (e2) {}
  }
}

function scrollBottom() {
  try {
    $mainArea.scrollTop = $mainArea.scrollHeight;
  } catch (e) {}
}

function adjustTextareaHeight() {
  $inputArea.style.height = 'auto';
  var newHeight = Math.min($inputArea.scrollHeight, 160);
  $inputArea.style.height = newHeight + 'px';
}

function createBubble(type, content, timeMs, hasCopy) {
  var bubble = document.createElement('div');
  bubble.className = 'bubble ' + (type === 'user' ? 'bubble-user' : 'bubble-ai') + ' round';
  
  var timeDiv = document.createElement('div');
  timeDiv.className = 'bubble-time';
  timeDiv.textContent = formatTime(timeMs);
  
  var contentDiv = document.createElement('div');
  contentDiv.innerHTML = escHtml(content).replace(/\n/g, '<br>');
  
  bubble.appendChild(contentDiv);
  bubble.appendChild(timeDiv);
  
  if (type === 'ai' && hasCopy) {
    var copyBtn = document.createElement('button');
    copyBtn.className = 'bubble-copy';
    copyBtn.innerHTML = '📋';
    copyBtn.onclick = function() {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已复制');
      } catch (e) {
        showToast('复制失败');
      }
    };
    bubble.appendChild(copyBtn);
    try { /* v0.2.0 📥送入书 */
      var _sbOff = false;
      try { _sbOff = (localStorage.getItem('hx_chat_sendbook_off') === '1'); } catch (e0) {}
      if (!_sbOff) {
        var sendBookBtn = document.createElement('button');
        sendBookBtn.className = 'bubble-copy bubble-sendbook';
        sendBookBtn.innerHTML = '📥';
        sendBookBtn.onclick = function() {
          try { chatSendBook(content); } catch (e1) { try { showToast('送入书失败'); } catch (e2) {} }
        };
        bubble.appendChild(sendBookBtn);
      }
    } catch (e3) {}
  }
  
  return bubble;
}

function renderChat(chatObj) {
  if (!chatObj) return;
  
  $mainArea.innerHTML = '';
  
  // 渲染消息流
  var msgs = chatObj.msgs || [];
  if (!msgs.length) { /* 翻案E配套：空对话=欢迎泡 */ var wb = createBubble('ai', '我是您的医学学习AI，问吧', Date.now(), true); $mainArea.appendChild(wb); scrollBottom(); $memLine.style.display='block'; $memLine.textContent='本对话0轮 · 摘要：未压 · 事实卡0条'; return; }
  for (var i = 0; i < msgs.length; i++) {
    var msg = msgs[i];
    var bubble = createBubble(
      msg.r === 'u' ? 'user' : 'ai',
      msg.c,
      msg.t,
      msg.r === 'a'
    );
    $mainArea.appendChild(bubble);
  }
  
  // 更新记忆状态行
  var turns = chatObj.turns || 0;
  var sumStatus = chatObj.sum ? '已压' : '未压';
  var factsLen = (chatObj.facts && Array.isArray(chatObj.facts)) ? chatObj.facts.length : 0;
  $memLine.textContent = '本对话' + turns + '轮 · 摘要：' + sumStatus + ' · 事实卡' + factsLen + '条';
  $memLine.style.display = 'block';
  
  scrollBottom();
}

function loadCurrentChat() {
  if (!window.HX || !HX.chat) {
    $warnBar.style.display = 'block';
    return;
  }
  
  var id = HX.chat.getCur();
  if (!id) {
    id = HX.chat.newChat();
    HX.chat.setCur(id);
  }
  
  curChatId = id;
  var chatObj = HX.chat.load(id);
  if (!chatObj || !(chatObj.msgs && chatObj.msgs.length)) { /* Kimi终审翻案E：新对话有存档但msgs空，也要出欢迎泡（原判null欢迎泡永不出） */
    // 新建欢迎泡
    $mainArea.innerHTML = '';
    var welcomeBubble = createBubble('ai', '我是您的医学学习AI，问吧', Date.now(), true);
    $mainArea.appendChild(welcomeBubble);
    $memLine.style.display = 'none';
  } else {
    renderChat(chatObj);
  }
}

function showDrawer() {
  $drawer.className = 'drawer open';
}

function hideDrawer() {
  $drawer.className = 'drawer';
}

function renderDrawerList() {
  if (!window.HX || !HX.chat) {
    $drawerList.innerHTML = '<div class="drawer-item"><div class="drawer-item-title">加载失败</div></div>';
    return;
  }
  
  var list = HX.chat.list() || [];
  $drawerList.innerHTML = '';
  
  if (list.length === 0) {
    var emptyItem = document.createElement('div');
    emptyItem.className = 'drawer-item';
    emptyItem.innerHTML = '<div class="drawer-item-title">暂无历史对话</div>';
    $drawerList.appendChild(emptyItem);
    return;
  }
  
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var el = document.createElement('div');
    el.className = 'drawer-item';
    
    var updatedDate = new Date(item.updated);
    var timeStr = (updatedDate.getMonth() + 1) + '/' + updatedDate.getDate() + ' ' +
                  pad2(updatedDate.getHours()) + ':' + pad2(updatedDate.getMinutes());
    
    el.innerHTML = 
      '<div class="drawer-item-title">' + (item.title || '无标题') + '</div>' +
      '<div class="drawer-item-meta">' + timeStr + ' · ' + (item.turns || 0) + '轮</div>' +
      '<button class="drawer-item-del" data-id="' + item.id + '">🗑</button>';
    
    el.onclick = (function(id) {
      return function() {
        HX.chat.setCur(id);
        hideDrawer();
        loadCurrentChat();
      };
    })(item.id);
    
    var delBtn = el.querySelector('.drawer-item-del');
    delBtn.onclick = (function(id, e) {
      e.stopPropagation();
      if (confirm('确定删除该对话？')) {
        HX.chat.del(id);
        if (id === curChatId) { curChatId = null; loadCurrentChat(); } /* Kimi终审翻案D：删的是正聊的这条，主区跟着刷新 */
        renderDrawerList();
      }
    }).bind(null, item.id);
    
    $drawerList.appendChild(el);
  }
}

function initPage() {
  // 初始化警告条
  function hxReady() {
    return !!(window.HX && typeof HX.chat !== 'undefined');
  }
  if (!hxReady()) {
    $warnBar.style.display = 'block';
    var _hxRetry = 0;
    var _hxT = setInterval(function() {
      _hxRetry++;
      if (hxReady()) {
        clearInterval(_hxT);
        $warnBar.style.display = 'none';
        loadCurrentChat();
        renderDrawerList();
        try{ if(HX.sj && HX.sj.init) HX.sj.init({app:'AI对话框'}); }catch(e){} /* Kimi终审翻案②：公共件晚到场景，复查命中时补挂浮标+点亮（sj.init有inited防重、pick.bind有防重，重复调用无害） */
        try{ if(HX.pick && HX.pick.bind) HX.pick.bind(); }catch(e){}
      } else if (_hxRetry >= 15) {
        clearInterval(_hxT);
      }
    }, 2000);
  } else {
    $warnBar.style.display = 'none';
  }
  
  // 检查钥匙
  var hasKeys = false;
  if (typeof HX !== 'undefined' && typeof HX.keys !== 'undefined') { /* Kimi终审翻案①：HX整个不在时typeof HX.keys会炸死initPage（t32真机场景），加HX总判 */
    if (HX.keys.get && HX.keys.getQwen) {
      var k1 = HX.keys.get();
      var k2 = HX.keys.getQwen();
      var k3 = '';
      try { k3 = localStorage.getItem('xt_dskey') || ''; } catch (e) {}
      if (!k3 && HX.keys._loadFile) {
        var f = HX.keys._loadFile();
        if (f && f.deepseek) k3 = f.deepseek;
      }
      if (k1 && k1.trim() !== '' || k2 && k2.trim() !== '' || k3 && k3.trim() !== '') {
        hasKeys = true;
      }
    }
  }
  
  if (!hasKeys) {
    var noKeyToast = document.createElement('div');
    noKeyToast.className = 'toast-container show';
    noKeyToast.innerHTML = 
      '<div class="toast" style="background:#000;color:#fff;">' +
      '<span>还没有AI钥匙：去病人大管家→AI面板存一把再来</span>' +
      '<button class="toast-close">×</button>' +
      '</div>';
    document.body.appendChild(noKeyToast);
    
    var closeBtn = noKeyToast.querySelector('.toast-close');
    closeBtn.onclick = function() {
      noKeyToast.remove();
    };
  }
  
  // 绑定事件
  $menuBtn.onclick = function() {
    renderDrawerList(); /* Kimi终审翻案F：开抽屉先重渲（原只在开门渲一次，新对话不上榜） */
    showDrawer();
  };
  
  $newBtn.onclick = function() {
    if (!window.HX || !HX.chat) return;
    var newId = HX.chat.newChat();
    HX.chat.setCur(newId);
    curChatId = newId;
    $mainArea.innerHTML = '';
    var welcomeBubble = createBubble('ai', '我是您的医学学习AI，问吧', Date.now(), true);
    $mainArea.appendChild(welcomeBubble);
    $memLine.style.display = 'none';
    scrollBottom();
  };
  
  $drawerClose.onclick = hideDrawer;
  
  $pullCloudBtn.onclick = function() {
    if (!window.HX || !HX.chat) return;
    $pullCloudBtn.disabled = true;
    HX.chat.pullCloud(function(n) {
      $pullCloudBtn.disabled = false;
      if (n === -1) {
        showToast('云端这条路没通');
      } else {
        showToast('捞回' + n + '条');
        renderDrawerList();
      }
    });
  };
  
  $sendBtn.onclick = function() {
    if (!window.HX || !HX.chat) return;
    if (!curChatId) return;
    if (isSending) {
      // 停止逻辑：仅标记，不真abort
      showToast('已打住，回信还在路上，到了自动贴出');
      return;
    }
    
    var text = $inputArea.value.trim();
    if (!text) return;
    
    // 发送前清理
    $inputArea.value = '';
    adjustTextareaHeight();
    
    // 添加用户气泡
    var now = Date.now();
    var userBubble = createBubble('user', text, now, false);
    $mainArea.appendChild(userBubble);
    scrollBottom();
    
    // 占位AI气泡
    var placeholderBubble = createBubble('ai', '正在写回信…0秒', now, false);
    $mainArea.appendChild(placeholderBubble);
    scrollBottom();
    
    isSending = true;
    $sendBtn.textContent = '✋停止';
    $sendBtn.disabled = false;
    
    // 开始计时器
    var tickSec = 0;
    sendAbortTimer = setInterval(function() {
      tickSec++;
      placeholderBubble.innerHTML = '<div>正在写回信…' + tickSec + '秒</div><div class="bubble-time">' + formatTime(now) + '</div>';
      scrollBottom();
    }, 1000);
    
    // 发送
    HX.chat.send(curChatId, text, {
      onOk: function(reply) {
        if (sendAbortTimer) {
          clearInterval(sendAbortTimer);
          sendAbortTimer = null;
        }
        isSending = false;
        $sendBtn.textContent = '🚀';
        $sendBtn.disabled = false;
        
        // 替换占位气泡
        placeholderBubble.innerHTML = escHtml(reply).replace(/\n/g, '<br>');
        placeholderBubble.className = 'bubble bubble-ai round';
        var timeDiv = document.createElement('div');
        timeDiv.className = 'bubble-time';
        timeDiv.textContent = formatTime(Date.now());
        placeholderBubble.appendChild(timeDiv);
        
        var copyBtn = document.createElement('button');
        copyBtn.className = 'bubble-copy';
        copyBtn.innerHTML = '📋';
        copyBtn.onclick = function() {
          try {
            var textarea = document.createElement('textarea');
            textarea.value = reply;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('已复制');
          } catch (e) {
            showToast('复制失败');
          }
        };
        placeholderBubble.appendChild(copyBtn);
        try { /* v0.2.0 📥送入书 */
          var _sbOff2 = false;
          try { _sbOff2 = (localStorage.getItem('hx_chat_sendbook_off') === '1'); } catch (e0b) {}
          if (!_sbOff2) {
            var sendBookBtn2 = document.createElement('button');
            sendBookBtn2.className = 'bubble-copy bubble-sendbook';
            sendBookBtn2.innerHTML = '📥';
            sendBookBtn2.onclick = function() {
              try { chatSendBook(reply); } catch (e1b) { try { showToast('送入书失败'); } catch (e2b) {} }
            };
            placeholderBubble.appendChild(sendBookBtn2);
          }
        } catch (e3b) {}
        
        // 刷新当前对话显示
        var chatObj = HX.chat.load(curChatId);
        if (chatObj) {
          renderChat(chatObj);
        }
      },
      onErr: function(msg) {
        if (sendAbortTimer) {
          clearInterval(sendAbortTimer);
          sendAbortTimer = null;
        }
        isSending = false;
        $sendBtn.textContent = '🚀';
        $sendBtn.disabled = false;
        
        // 替换占位为错误信息
        placeholderBubble.innerHTML = '<div style="color:#cc6666;">没通：' + escHtml(msg) + '（点🚀可重发）</div><div class="bubble-time">' + formatTime(now) + '</div>';
        placeholderBubble.className = 'bubble bubble-ai round';
        scrollBottom();
      },
      onTick: function(sec) {
        // 已由定时器处理
      }
    });
  };
  
  $inputArea.oninput = adjustTextareaHeight;
  $inputArea.onkeydown = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $sendBtn.click();
    }
  };
  
  // Toast关闭
  $toastClose.onclick = hideToast;
  
  // 初始化
  loadCurrentChat();
  renderDrawerList();
  try{ if(window.HX && HX.sj && HX.sj.init) HX.sj.init({app:'AI对话框'}); }catch(e){}
  try{ if(window.HX && HX.pick && HX.pick.bind) HX.pick.bind(); }catch(e){}
}

// 页面加载完成
document.addEventListener('DOMContentLoaded', function() {
  initPage();
});
</script>

</body>
</html>
