  }
  var _c=new AbortController(); var _t=setTimeout(function(){ _c.abort(); }, 8000);
  fetch('hx-common.js?t='+Date.now(), {cache:'no-store', signal:_c.signal}).then(function(r){

/* ===== v0.3.0 PDF问答：📎选PDF→懒加载引擎抽字→暂存随下句发（SPEC_chat_v0.3.0；Kimi亲手落地） ===== */
function chatB64ToBlobUrl(b64, mime) { /* 照大管家 dsm_b64ToBlobUrl 真签名仿写 */
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mime }));
}

      if (f) { try { runTxt2(decodeURIComponent(escape(atob(String(f).replace(/\s+/g,''))))); if (got()) { afterGot(); return; } } catch (e2) {} }
    }
    var _c1 = new AbortController(); var _t1 = setTimeout(function(){ _c1.abort(); }, 15000);
    fetch('guanjia-pdf-engine.js?t=' + Date.now(), { cache: 'no-store', signal: _c1.signal }).then(function(r) {

function chatParsePdf(arrayBuffer, fileName, cb) {
  /* 照大管家 dsm_parsePDFWithEngine 真用法仿写：逐页getTextContent抽字join；空=扫描件 */
  try {
    if (typeof pdfjsLib === 'undefined' || !window.chat_pdfWorkerReady) { cb(false, 'PDF引擎加载失败'); return; }
    pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdf) {
      var totalPages = pdf.numPages;
      var promises = [];
      for (var i = 1; i <= totalPages; i++) {
        promises.push(pdf.getPage(i).then(function(page) {
          return page.getTextContent().then(function(data) {
            return data.items.map(function(item) { return item.str; }).join(' ');
          });
        }));
      }
      Promise.all(promises).then(function(pagesText) {
        var textContent = pagesText.join('\n\n');
        if (textContent.replace(/^\s+|\s+$/g, '') === '') {
          cb(false, '这份PDF读不出字，可能是扫描件');
        } else {
          cb(true, textContent, totalPages);
        }
      }).catch(function(err) { cb(false, 'PDF没读成: ' + err.message); });
    }).catch(function(err) { cb(false, 'PDF没读成: ' + err.message); });
  } catch (e) { cb(false, 'PDF没读成: ' + e.message); }
}

/* ---------- 终审翻案①：AI直调（端点/模型名照HX.chat内部口径；which='kimi'|'qwen'|'auto'） ---------- */
function presetCallAI(sys, userText, which, cb) {
  try {
    var tries = [];
    if (which === 'kimi') tries = ['kimi'];
    else if (which === 'qwen') tries = ['qwen'];
    else tries = ['kimi', 'qwen', 'deepseek'];
    function keyOf(w) {
      try {
        if (w === 'kimi') return (HX.keys.get && HX.keys.get()) || '';
        if (w === 'qwen') return (HX.keys.getQwen && HX.keys.getQwen()) || '';
        if (w === 'deepseek') { var o = HX.keys._loadFile ? HX.keys._loadFile() : null; return (o && o.deepseek) ? o.deepseek : ''; }
      } catch (e) {}
      return '';
    }
    var conf = {
      kimi: { url: 'https://api.moonshot.cn/v1/chat/completions', model: (function(){ try { return localStorage.getItem('hx_aimodel') || 'kimi-k2.7-code-highspeed'; } catch (e) { return 'kimi-k2.7-code-highspeed'; } })() },
      qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
      deepseek: { url: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' }
    };
    function attempt(idx) {
      if (idx >= tries.length) { cb(false, '没通：钥匙都没有或AI都没回'); return; }
      var w = tries[idx];
      var key = keyOf(w);
      key = String(key || '').replace(/^\s+|\s+$/g, ''); /* v0.4.1刀④（千问实现+Kimi终审）：钥匙trim去首尾空格 */
      if (!key) { attempt(idx + 1); return; }
      var c = conf[w];
      var _continued = false; /* v0.4.1刀②：截断续写硬上限1次（Kimi终审翻案1：千问把_continued写进then里每次重置=没闸，挪进attempt闭包成真闸） */
      function _send(msgs, acc) { /* v0.4.1刀②：发信收进函数，acc=已拼半截 */
        fetch(c.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model: c.model, messages: msgs, max_tokens: 8192 }) /* v0.4.1刀①：2048→8192（三家统一，治腰斩） */
        }).then(function (r) {
          if (!r.ok) { attempt(idx + 1); return { __skip: 1 }; } /* v0.4.1真bug修（千问实现+Kimi终审翻案2：千问!r.ok直return致下个then拿到undefined又跳一次=一家被跳过两次，补__skip哨兵）：HTTP400等不收→换下一家，不再当JSON误解析 */
          return r.json();
        }).then(function (j) {
          if (j && j.__skip) return; /* v0.4.1：哨兵路收工 */
          try {
            var txt = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
            var fr = j && j.choices && j.choices[0] ? j.choices[0].finish_reason : ''; /* v0.4.1刀②：读finish_reason判截断 */
            if (txt && fr === 'length' && !_continued) {
              _continued = true;
              var _m2 = msgs.slice(); /* slice拷贝不动原数组 */
              _m2.push({ role: 'assistant', content: txt });
              _m2.push({ role: 'user', content: '接着断处写，别重头' });
              _send(_m2, acc + txt);
              return;
            }
            if (txt && fr !== 'length') { cb(true, acc + txt); return; }
            /* 续写仍截断：半截信（多半是半截JSON）交了也解析不了，照SPEC换下一家 */
          } catch (e) {}
          attempt(idx + 1);
        }).catch(function () { attempt(idx + 1); });
      }
      _send([{ role: 'system', content: sys }, { role: 'user', content: userText }], '');
    }
    attempt(0);
  } catch (e) { cb(false, e && e.message ? e.message : 'AI调用失败'); }
}

/* ---------- A7 汇成一篇：取轮工具 ---------- */
function presetRecentTurns(chatObj, n) {
  try {
    if (!chatObj || !chatObj.msgs || !chatObj.msgs.length) return [];
    var take = n || 5;
    var msgs = chatObj.msgs;
    var start = Math.max(0, msgs.length - take * 2);
    var out = [];
    for (var j = start; j < msgs.length; j++) { if (msgs[j]) out.push({ r: msgs[j].r, c: msgs[j].c }); }
    return out;
  } catch (e) { return []; }
}

/* A5 文献双岗：千问查→Kimi审→回执+参考文献夹原消息 */
function presetIsLitPreset(p) {
  try {
    if (!p) return false;
    if (p.id === 'preset_factory_lit') return true;
    if ((p.name || '').indexOf('查文献') >= 0) return true;
    return false;
  } catch (e) { return false; }
}

function presetLitQuery(userText, cb) {
  /* 千问查 */
  try {
    var sys = '你是文献检索助手。查真实文献支持用户句子，返回JSON数组[{title,authors,journal,year,quote}]，查无此文不许编。只输出JSON。';
    presetCallAI(sys, userText, 'qwen', function (ok, out) {
      if (!ok) { cb(false, null); return; }
      var arr = null;
      try {
        var s = String(out || '');
        var i1 = s.indexOf('['); var i2 = s.lastIndexOf(']');
        arr = JSON.parse((i1 >= 0 && i2 > i1) ? s.substring(i1, i2 + 1) : s);
        if (!(arr instanceof Array)) arr = [];
      } catch (e) { arr = []; }
      cb(true, arr);
    });
  } catch (e) { cb(false, null); }
}

function presetLitReview(userText, list, cb) {
  /* Kimi审 */
  try {
    var sys = '你是文献审核助手。审JSON文献条目是否真实、是否真支持用户句子。只返回JSON：{"pass":[通过的条目下标数组],"fail":[不通过的下标数组]}。不许编造。';
    presetCallAI(sys, '原句：' + userText + '\n\n文献JSON：' + JSON.stringify(list || []), 'kimi', function (ok, out) {
      if (!ok) { cb(false, null); return; }
      var res = null;
      try {
        var s = String(out || '');
        var o1 = s.indexOf('{'); var o2 = s.lastIndexOf('}');
        res = JSON.parse((o1 >= 0 && o2 > o1) ? s.substring(o1, o2 + 1) : s);
      } catch (e) { res = null; }
      cb(true, res);
    });
  } catch (e) { cb(false, null); }
}

function presetLitRun(userText, cb) {
  /* A5 双岗主流程：审不过打回重查最多2轮 */
  try {
    var round = 0;
    var maxRound = 2;
    function oneRound() {
      round++;
      presetLitQuery(userText, function (okQ, list) {
        if (!okQ) { cb(false, '查文献没查到（千问没回）'); return; }
        var lastList = (list && list instanceof Array) ? list : [];
        if (!lastList.length) { cb(true, { list: [], receipt: '0篇已核/0篇查无此文被毙' }); return; }
        presetLitReview(userText, lastList, function (okR, res) {
          if (!okR || !res) { cb(true, { list: lastList, receipt: lastList.length + '篇已核/0篇查无此文被毙（审岗没回，先按全过）' }); return; }
          var passIdx = (res.pass && res.pass instanceof Array) ? res.pass : [];
          var failIdx = (res.fail && res.fail instanceof Array) ? res.fail : [];
          var passList = [];
          for (var i = 0; i < passIdx.length; i++) { var pi = passIdx[i]; if (lastList[pi]) passList.push(lastList[pi]); }
          if (passList.length) {
            cb(true, { list: passList, receipt: passList.length + '篇已核/' + failIdx.length + '篇查无此文被毙' });
          } else if (round < maxRound) {
            oneRound();
          } else {
            cb(true, { list: [], receipt: '0篇已核/' + lastList.length + '篇查无此文被毙' });
          }
        });
      });
    }
    oneRound();
  } catch (e) { cb(false, e && e.message ? e.message : '查文献失败'); }
}

/* ---------- A2/A4/A7 发送前拼装提示词 ---------- */
function presetBuildPrompt(userText, preset, chatObj) {
  try {
    if (!preset) return userText;
    var head = '【预设:' + (preset.name || '') + '】\n' + (preset.rule || '') + '\n\n';
    var ctxTxt = '';
    if (preset.withCtx && chatObj) {
      var isMerge = (preset.name || '').indexOf('汇成一篇') >= 0 || preset.id === 'preset_factory_merge';
      if (isMerge) {
        /* A7 滚着汇：上一篇📄汇总+其后新几轮一起喂；原文永存不删 */
        var msgs = chatObj.msgs || [];
        var lastMergeIdx = -1;
        for (var i = msgs.length - 1; i >= 0; i--) {
          if (msgs[i] && msgs[i].merged && msgs[i].r === 'a') { lastMergeIdx = i; break; }
        }
        var feedFrom = (lastMergeIdx >= 0) ? lastMergeIdx : 0; /* 含上一篇汇总本轮 */
        for (var j = feedFrom; j < msgs.length; j++) {
          if (msgs[j]) ctxTxt += ((msgs[j].r === 'u') ? '用户：' : 'AI：') + (msgs[j].c || '') + '\n';
        }
      } else {
        var recent = presetRecentTurns(chatObj, preset.ctxN || 5);
        for (var t = 0; t < recent.length; t++) {
          ctxTxt += ((recent[t].r === 'u') ? '用户：' : 'AI：') + (recent[t].c || '') + '\n';
        }
      }
    }
    if (ctxTxt) return head + '【上文】\n' + ctxTxt + '【我的问题】\n' + userText;
    return head + userText;
  } catch (e) { return userText; }
}

function createBubble(type, content, timeMs, hasCopy) {
  var bubble = document.createElement('div');
  bubble.className = 'bubble ' + (type === 'user' ? 'bubble-user' : 'bubble-ai') + ' round';
  
  var timeDiv = document.createElement('div');
  timeDiv.className = 'bubble-time';
  timeDiv.textContent = formatTime(timeMs);
  
  var contentDiv = document.createElement('div');
  contentDiv.innerHTML = escHtml(content).replace(/\n/g, '<br>');
  
  bubble.appendChild(contentDiv);
  bubble.appendChild(timeDiv);
  
  if (type === 'ai' && hasCopy) {
    var copyBtn = document.createElement('button');
    copyBtn.className = 'bubble-copy';
    copyBtn.innerHTML = '📋';
    copyBtn.onclick = function() {
      try {
        var textarea = document.createElement('textarea');
        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已复制');
      } catch (e) {
        showToast('复制失败');
      }
    };
    bubble.appendChild(copyBtn);
    try { /* v0.2.0 📥送入书 */
      var _sbOff = false;
      try { _sbOff = (localStorage.getItem('hx_chat_sendbook_off') === '1'); } catch (e0) {}
      if (!_sbOff) {
        var sendBookBtn = document.createElement('button');
        sendBookBtn.className = 'bubble-copy bubble-sendbook';
        sendBookBtn.innerHTML = '📥';
        sendBookBtn.onclick = function() {
          try { chatSendBook(content); } catch (e1) { try { showToast('送入书失败'); } catch (e2) {} }
        };
        bubble.appendChild(sendBookBtn);
      }
    } catch (e3) {}
  }
  
  return bubble;
}

function renderChat(chatObj) {
  if (!chatObj) return;
  
  $mainArea.innerHTML = '';
  
  // 渲染消息流
  var msgs = chatObj.msgs || [];
  if (!msgs.length) { /* 翻案E配套：空对话=欢迎泡 */ var wb = createBubble('ai', '我是您的医学学习AI，问吧', Date.now(), true); $mainArea.appendChild(wb); scrollBottom(); $memLine.style.display='block'; $memLine.textContent='本对话0轮 · 摘要：未压 · 事实卡0条'; return; }
  for (var i = 0; i < msgs.length; i++) {
    var msg = msgs[i];
    var bubble = createBubble(
      msg.r === 'u' ? 'user' : 'ai',
      msg.c,
      msg.t,
      msg.r === 'a'
    );
    /* v0.4.0 A7 📄汇总标记（显示层，不改物理记录） */
    try {
      if (msg && msg.merged && msg.r === 'a') {
        var _mk = document.createElement('div');
        _mk.style.fontSize = '12px';
        _mk.style.color = '#8a7a4a';
        _mk.style.marginTop = '6px';
        _mk.textContent = '📄 汇总';
        bubble.appendChild(_mk);
      }
    } catch (eMk) {}
    $mainArea.appendChild(bubble);
  }
  
  // 更新记忆状态行
  var turns = chatObj.turns || 0;
  var sumStatus = chatObj.sum ? '已压' : '未压';
  var factsLen = (chatObj.facts && Array.isArray(chatObj.facts)) ? chatObj.facts.length : 0;
  $memLine.textContent = '本对话' + turns + '轮 · 摘要：' + sumStatus + ' · 事实卡' + factsLen + '条';
  $memLine.style.display = 'block';
  
  scrollBottom();
}

function loadCurrentChat() {
  if (!window.HX || !HX.chat) {
    $warnBar.style.display = 'block';
    return;
  }
  
  var id = HX.chat.getCur();
  if (!id) {
    id = HX.chat.newChat();
    HX.chat.setCur(id);
  }
  
  curChatId = id;
  var chatObj = HX.chat.load(id);
  if (!chatObj || !(chatObj.msgs && chatObj.msgs.length)) { /* Kimi终审翻案E：新对话有存档但msgs空，也要出欢迎泡（原判null欢迎泡永不出） */
    // 新建欢迎泡
    $mainArea.innerHTML = '';
    var welcomeBubble = createBubble('ai', '我是您的医学学习AI，问吧', Date.now(), true);
    $mainArea.appendChild(welcomeBubble);
    $memLine.style.display = 'none';
  } else {
    renderChat(chatObj);
  }
}

function renderDrawerList() {
  if (!window.HX || !HX.chat) {
    $drawerList.innerHTML = '<div class="drawer-item"><div class="drawer-item-title">加载失败</div></div>';
    return;
  }
  
  var list = HX.chat.list() || [];
  $drawerList.innerHTML = '';
  
  if (list.length === 0) {
    var emptyItem = document.createElement('div');
    emptyItem.className = 'drawer-item';
    emptyItem.innerHTML = '<div class="drawer-item-title">暂无历史对话</div>';
    $drawerList.appendChild(emptyItem);
    return;
  }
  
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var el = document.createElement('div');
    el.className = 'drawer-item';
    
    var updatedDate = new Date(item.updated);
    var timeStr = (updatedDate.getMonth() + 1) + '/' + updatedDate.getDate() + ' ' +
                  pad2(updatedDate.getHours()) + ':' + pad2(updatedDate.getMinutes());
    
    el.innerHTML = 
      '<div class="drawer-item-title">' + (item.title || '无标题') + '</div>' +
      '<div class="drawer-item-meta">' + timeStr + ' · ' + (item.turns || 0) + '轮</div>' +
      '<button class="drawer-item-del" data-id="' + item.id + '">🗑</button>';
    
    el.onclick = (function(id) {
      return function() {
        HX.chat.setCur(id);
        hideDrawer();
        loadCurrentChat();
      };
    })(item.id);
    
    var delBtn = el.querySelector('.drawer-item-del');
    delBtn.onclick = (function(id, e) {
      e.stopPropagation();
      if (confirm('确定删除该对话？')) {
        HX.chat.del(id);
        if (id === curChatId) { curChatId = null; loadCurrentChat(); } /* Kimi终审翻案D：删的是正聊的这条，主区跟着刷新 */
        renderDrawerList();
      }
    }).bind(null, item.id);
    
    $drawerList.appendChild(el);
  }
}

  function zgOn() {
    try {
      if (!window.HX || !HX.zg) return false;
      if (localStorage.getItem('hx_zg_off') === '1') return false;
      return true;
    } catch (e) { return false; }
  }
  /* 把一条总管回话记进当前对话账（全量留存规矩）：追加 u/a 两条进HX.chat真源 */
  function zgLogToChat(userText, aiText) {
    try {
      var d = HX.chat.load(curChatId);
      if (!d) return;
      if (!(d.msgs instanceof Array)) d.msgs = [];
      d.msgs.push({ r: 'u', c: String(userText), t: Date.now() });
      d.msgs.push({ r: 'a', c: String(aiText), t: Date.now() });
      HX.chat.save(d);
    } catch (e) {}
  }
  /* 命令闸：命中命令→接管，返true；未命中返false走普通发送。文字=用户原始输入（未拼预设） */
  var _zgPassOnce = false; /* v0.8.0二期刀G：模糊链放行旗，passF再点发送时挡递归（点前挂true，闸口认出即清并放行） */
  function zgTryCmd(rawText) {
    if (!zgOn()) return false;
    if (_zgPassOnce) { _zgPassOnce = false; return false; }
    var cmd = null;
    try { cmd = HX.zg.detectCmd(rawText); } catch (e) { cmd = null; }
    /* ════ 二期刀G：detectCmd未命中但含四动词→模糊链（chat v0.8.0 2026-10-23，SPEC_AI总管二期；DS实现+Kimi终审翻案2处亲手落地：①passThrough点sendBtn会重进本闸递归死循环，加_zgPassOnce放行旗②用户气泡改onOk时insertBefore补在进度泡前，miss/err摘泡还文不双贴；另扶正DS编造的listBooks假字段走hx-common侧真身）════ */
    if (!cmd) {
      if (!/融进|写进|塞进|并入/.test(String(rawText || ''))) return false;
      /* 材料缺省=本对话最近3条AI回信拼一起（同一期规则） */
      var matF = '';
      try {
        var dF = HX.chat.load(curChatId);
        var accF = [];
        if (dF && (dF.msgs instanceof Array)) {
          for (var iF = dF.msgs.length - 1; iF >= 0 && accF.length < 3; iF--) {
            if (dF.msgs[iF] && dF.msgs[iF].r === 'a' && dF.msgs[iF].c) accF.unshift(String(dF.msgs[iF].c));
          }
        }
        matF = accF.join('\n---\n');
      } catch (eMF) {}
      try {
        $inputArea.value = '';
        adjustTextareaHeight();
        var nowF = Date.now();
        var phF = createBubble('ai', '🔎 总管正在找该融进哪章…', nowF, false);
        $mainArea.appendChild(phF);
        scrollBottom();
        var linesF = [];
        function renderPhF(failMsg) {
          var hF = '';
          for (var kF = 0; kF < linesF.length; kF++) hF += '<div>' + escHtml(linesF[kF]) + '</div>';
          if (failMsg) hF += '<div style="color:#cc6666;">' + escHtml(failMsg) + '</div>';
          hF += '<div class="bubble-time">' + formatTime(nowF) + '</div>';
          phF.innerHTML = hF;
          phF.className = 'bubble bubble-ai round';
          scrollBottom();
        }
        /* 放行原句走普通发送（不吞话不双贴）：摘进度泡+还原文+挂放行旗再点发送（旗挡递归） */
        function passF() {
          try { if (phF && phF.parentNode) phF.parentNode.removeChild(phF); } catch (eRm) {}
          try {
            _zgPassOnce = true;
            $inputArea.value = rawText;
            adjustTextareaHeight();
            $sendBtn.click();
          } catch (eP) {}
        }
        HX.zg.findChap(String(rawText || '') + '\n' + matF, {
          onOk: function (info) {
            /* 找到章才补用户气泡，插在进度泡前面（原顺序不乱） */
            try { $mainArea.insertBefore(createBubble('user', rawText, nowF, false), phF); scrollBottom(); } catch (eU) {}
            var confTxt = (info.conf === 'ai') ? '（AI配的）' : '（直接配的）';
            linesF.push('找到《' + String(info.book || '') + '》「' + String(info.chapTitle || '') + '」' + confTxt);
            renderPhF('');
            var chapTxt = '';
            try { chapTxt = HX.zg.getChap(info.bid, info.cid) || ''; } catch (eG) { chapTxt = ''; }
            var rate = 0;
            try { rate = HX.zg.dupRate(matF, chapTxt); } catch (eRt) { rate = 0; }
            function runMergeF(rewrite) {
              var mOpts = { bid: info.bid, cid: info.cid, book: info.book, chapTitle: info.chapTitle, material: matF };
              if (rewrite) mOpts.rewrite = 1;
              HX.zg.merge(mOpts, {
                onStep: function (n, s) { linesF.push(s); renderPhF(''); },
                onErr: function (msg) {
                  var failTxtF = '没办成：' + String(msg) + '（章没动，您的东西一个字没丢）';
                  renderPhF(failTxtF);
                  zgLogToChat(rawText, '【总管】' + linesF.join(' / ') + ' / ' + failTxtF);
                },
                onOk: function (info2) {
                  var doneTxtF = '已把材料融进《' + String(info2.book || '') + '》「' + String(info2.chapTitle || '') + '」（' + info2.oldLen + '字→' + info2.newLen + '字），旧版已留底，点📚里「↩历史版」能退回。';
                  linesF.push(doneTxtF);
                  renderPhF('');
                  try { showToast('已融进书，旧版留底可退回'); } catch (eTs) {}
                  zgLogToChat(rawText, '【总管】' + linesF.join(' / '));
                }
              });
            }
            if (rate >= 70) {
              /* 重复三选：跳过/照融/重写融，10秒不点默认跳过不写章 */
              linesF.push('材料跟原章重复约' + rate + '%，您选（10秒不点=跳过）：');
              renderPhF('');
              var btnWrap = document.createElement('div');
              btnWrap.style.marginTop = '6px';
              var picked = false;
              var tmr = null;
              function unPick() { picked = true; try { if (tmr) clearTimeout(tmr); } catch (eCt) {} try { btnWrap.innerHTML = ''; } catch (eCw) {} }
              function doSkipF() {
                if (picked) return; unPick();
                linesF.push('已跳过，章一个字没动。');
                renderPhF('');
                zgLogToChat(rawText, '【总管】' + linesF.join(' / '));
              }
              function doMergeF(rw) { if (picked) return; unPick(); runMergeF(rw); }
              var bSkip = document.createElement('button'); bSkip.textContent = '跳过'; bSkip.style.marginRight = '6px';
              bSkip.onclick = function () { doSkipF(); };
              var bKeep = document.createElement('button'); bKeep.textContent = '照融'; bKeep.style.marginRight = '6px';
              bKeep.onclick = function () { doMergeF(0); };
              var bRe = document.createElement('button'); bRe.textContent = '重写融';
              bRe.onclick = function () { doMergeF(1); };
              btnWrap.appendChild(bSkip); btnWrap.appendChild(bKeep); btnWrap.appendChild(bRe);
              phF.appendChild(btnWrap);
              scrollBottom();
              tmr = setTimeout(function () { doSkipF(); }, 10000);
            } else {
              runMergeF(0);
            }
          },
          onMiss: function (msg) {
            zgLogToChat(rawText, '【总管】没找到该融进哪章（' + String(msg || '') + '），已当普通对话');
            passF();
          },
          onErr: function (msg) {
            zgLogToChat(rawText, '【总管】找章中途出错（' + String(msg || '') + '），已当普通对话');
            passF();
          }
        });
      } catch (eAllF) { return false; }
      return true;
    }
    /* 材料缺省=本对话最近3条AI回信拼一起（「材料」字样=收发室按钮来的，也算缺省） */
    if (!cmd.material || cmd.material === '材料') {
      try {
        var d0 = HX.chat.load(curChatId);
        var acc = [];
        if (d0 && (d0.msgs instanceof Array)) {
          for (var i = d0.msgs.length - 1; i >= 0 && acc.length < 3; i--) {
            if (d0.msgs[i] && d0.msgs[i].r === 'a' && d0.msgs[i].c) acc.unshift(String(d0.msgs[i].c));
          }
        }
        cmd.material = acc.join('\n---\n');
      } catch (eM) {}
    }
    /* 贴用户气泡+进度气泡 */
    try {
      $inputArea.value = '';
      adjustTextareaHeight();
      var nowC = Date.now();
      $mainArea.appendChild(createBubble('user', rawText, nowC, false));
      var ph = createBubble('ai', '🔧 总管开工…', nowC, false);
      $mainArea.appendChild(ph);
      scrollBottom();
      var lines = [];
      function renderPh(failMsg) {
        var h = '';
        for (var k = 0; k < lines.length; k++) h += '<div>' + escHtml(lines[k]) + '</div>';
        if (failMsg) h += '<div style="color:#cc6666;">' + escHtml(failMsg) + '</div>';
        h += '<div class="bubble-time">' + formatTime(nowC) + '</div>';
        ph.innerHTML = h;
        ph.className = 'bubble bubble-ai round';
        scrollBottom();
      }
      var failTxt = '';
      HX.zg.merge(cmd, {
        onStep: function(n, s) { lines.push(s); renderPh(''); },
        onErr: function(msg) {
          failTxt = '没办成：' + String(msg) + '（章没动，您的东西一个字没丢）';
          renderPh(failTxt);
          zgLogToChat(rawText, '【总管】' + lines.join(' / ') + ' / ' + failTxt);
        },
        onOk: function(info) {
          var doneTxt = '已把材料融进《' + String(info.book || '') + '》「' + String(info.chapTitle || '') + '」（' + info.oldLen + '字→' + info.newLen + '字），旧版已留底，点📚里「↩历史版」能退回。';
          lines.push(doneTxt);
          renderPh('');
          try { showToast('已融进书，旧版留底可退回'); } catch (eT) {}
          zgLogToChat(rawText, '【总管】' + lines.join(' / '));
        }
      });
    } catch (eAll) {}
    return true;
  }
  $sendBtn.onclick = function() {
    if (!window.HX || !HX.chat) return;
    if (!curChatId) return;
    if (isSending) {
      // 停止逻辑：仅标记，不真abort
      showToast('已打住，回信还在路上，到了自动贴出');
      return;
    }
    
    var text = $inputArea.value.trim();
    if (!text) {
      try { if (curPreset) { showToast('先写一句或先选预设配字'); return; } } catch (eEmptyPre) {}
      return;
    }
    try { /* v0.7.0 刀C：AI总管命令闸——命中「融进《书》第N章」类命令→接管走命令链，不进普通发送；宁漏不误 */
      if (zgTryCmd(text)) return;
    } catch (eZgCmd) {}
    var _presetRawText = text; /* v0.4.0终审加：气泡显示用原文 */
    var _presetUsed = curPreset;
    var _presetIsLit = false;
    try { _presetIsLit = presetIsLitPreset(_presetUsed); } catch (ePl) {}
    try { /* v0.4.0 A2/A4/A7：选中预设则拼提示词（预设文拼最前，带上文类拼最近N轮） */
      if (_presetUsed) {
        var _chatObjForCtx = null;
        try { _chatObjForCtx = (window.HX && HX.chat && HX.chat.load) ? HX.chat.load(curChatId) : null; } catch (eCtxL) { _chatObjForCtx = null; }
        text = presetBuildPrompt(text, _presetUsed, _chatObjForCtx);
      }
    } catch (ePreJoin) {}
    /* v0.4.0 A5 文献双岗：命中「查文献」预设则先走千问查+Kimi审，再带回执发 */
    if (_presetIsLit && _presetUsed) {
      try {
        var _origText = _presetRawText;
        var _nowLit = Date.now();
        $inputArea.value = '';
        adjustTextareaHeight();
        var _userBubbleLit = createBubble('user', _origText, _nowLit, false);
        $mainArea.appendChild(_userBubbleLit);
        scrollBottom();
        var _phLit = createBubble('ai', '正在查文献（千问查/Kimi审）…', _nowLit, false);
        $mainArea.appendChild(_phLit);
        scrollBottom();
        isSending = true;
        $sendBtn.textContent = '✋停止';
        $sendBtn.disabled = false;
        try { curPreset = null; presetUpdateChip(); } catch (eClr) {}
        presetLitRun(_origText, function(okLit, resLit) {
          try {
            if (!okLit) {
              _phLit.innerHTML = '<div style="color:#cc6666;">没通：' + escHtml(String(resLit || '查文献失败')) + '（点🚀可重发）</div><div class="bubble-time">' + formatTime(Date.now()) + '</div>';
              isSending = false; $sendBtn.textContent = '🚀'; $sendBtn.disabled = false;
              return;
            }
            var _listLit = (resLit && resLit.list) ? resLit.list : [];
            var _receiptLit = (resLit && resLit.receipt) ? resLit.receipt : '0篇已核/0篇查无此文被毙';
            var _refTxt = '';
            for (var _ri = 0; _ri < _listLit.length; _ri++) {
              var _r = _listLit[_ri] || {};
              _refTxt += '[' + (_ri + 1) + '] ' + (_r.authors || '') + '. ' + (_r.title || '') + '. ' + (_r.journal || '') + ', ' + (_r.year || '') + '. ' + (_r.quote || '') + '\n';
            }
            var _finalPrompt = text;
            if (_refTxt) { _finalPrompt = text + '\n\n【参考文献】\n' + _refTxt; }
            HX.chat.send(curChatId, _finalPrompt, {
              onOk: function(reply) {
                try {
                  _phLit.innerHTML = escHtml(reply).replace(/\n/g, '<br>') + '<div class="bubble-time" style="margin-top:6px;font-size:12px;color:#9a8f7c;">' + escHtml(_receiptLit) + '</div>';
                  isSending = false; $sendBtn.textContent = '🚀'; $sendBtn.disabled = false;
                  try { showToast(_receiptLit); } catch (eT) {}
                } catch (eOk) {}
              },
              onErr: function(msg) {
                try {
                  _phLit.innerHTML = '<div style="color:#cc6666;">没通：' + escHtml(String(msg)) + '（点🚀可重发）</div><div class="bubble-time">' + formatTime(Date.now()) + '</div>';
                  isSending = false; $sendBtn.textContent = '🚀'; $sendBtn.disabled = false;
                } catch (eEr) {}
              },
              onTick: function(sec) {}
            });
          } catch (eAfter) {}
        });
        return;
      } catch (eLitHook) {}
    }
    try { /* v0.3.0 PDF问答：有暂存PDF全文则拼前缀随本句发出，只拼一次；气泡仍显示原文 */
      if (curPdfCtx) {
        text = '【附件《' + curPdfName + '》全文】\n' + curPdfCtx + '\n【我的问题】\n' + text;
        curPdfCtx = null;
        curPdfName = '';
      }
    } catch (ePdfJoin) {}
    
    // 发送前清理
    $inputArea.value = '';
    adjustTextareaHeight();
    
    // 添加用户气泡
    var now = Date.now();
    var userBubble = createBubble('user', text, now, false);
    $mainArea.appendChild(userBubble);
    scrollBottom();
    
    // 占位AI气泡
    var placeholderBubble = createBubble('ai', '正在写回信…0秒', now, false);
    $mainArea.appendChild(placeholderBubble);
    scrollBottom();
    
    isSending = true;
    $sendBtn.textContent = '✋停止';
    $sendBtn.disabled = false;
    
    // 开始计时器
    var tickSec = 0;
    sendAbortTimer = setInterval(function() {
      tickSec++;
      placeholderBubble.innerHTML = '<div>正在写回信…' + tickSec + '秒</div><div class="bubble-time">' + formatTime(now) + '</div>';
      scrollBottom();
    }, 1000);
    
    // 发送
    HX.chat.send(curChatId, text, {
      onOk: function(reply) {
        if (sendAbortTimer) {
          clearInterval(sendAbortTimer);
          sendAbortTimer = null;
        }
        isSending = false;
        $sendBtn.textContent = '🚀';
        $sendBtn.disabled = false;
        
        // 替换占位气泡
        placeholderBubble.innerHTML = escHtml(reply).replace(/\n/g, '<br>');
        placeholderBubble.className = 'bubble bubble-ai round';
        var timeDiv = document.createElement('div');
        timeDiv.className = 'bubble-time';
        timeDiv.textContent = formatTime(Date.now());
        placeholderBubble.appendChild(timeDiv);
        
        var copyBtn = document.createElement('button');
        copyBtn.className = 'bubble-copy';
        copyBtn.innerHTML = '📋';
        copyBtn.onclick = function() {
          try {
            var textarea = document.createElement('textarea');
            textarea.value = reply;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('已复制');
          } catch (e) {
            showToast('复制失败');
          }
        };
        placeholderBubble.appendChild(copyBtn);
        try { /* v0.2.0 📥送入书 */
          var _sbOff2 = false;
          try { _sbOff2 = (localStorage.getItem('hx_chat_sendbook_off') === '1'); } catch (e0b) {}
          if (!_sbOff2) {
            var sendBookBtn2 = document.createElement('button');
            sendBookBtn2.className = 'bubble-copy bubble-sendbook';
            sendBookBtn2.innerHTML = '📥';
            sendBookBtn2.onclick = function() {
              try { chatSendBook(reply); } catch (e1b) { try { showToast('送入书失败'); } catch (e2b) {} }
            };
            placeholderBubble.appendChild(sendBookBtn2);
          }
        } catch (e3b) {}
        
        /* v0.4.0 A2 预设用完自动灭 */
        try { curPreset = null; presetUpdateChip(); } catch (eClrP) {}
        /* v0.4.0 A7 汇成一篇产物打📄标记（merged:true，终审翻案：HX.chat.save是单参save(d)） */
        try {
          if (_presetUsed && ((_presetUsed.name || '').indexOf('汇成一篇') >= 0 || _presetUsed.id === 'preset_factory_merge')) {
            var _coMark = (window.HX && HX.chat && HX.chat.load) ? HX.chat.load(curChatId) : null;
            if (_coMark && _coMark.msgs && _coMark.msgs.length) {
              for (var _mi = _coMark.msgs.length - 1; _mi >= 0; _mi--) {
                if (_coMark.msgs[_mi] && _coMark.msgs[_mi].r === 'a') { _coMark.msgs[_mi].merged = true; break; }
              }
              try { if (window.HX && HX.chat && HX.chat.save) HX.chat.save(_coMark); } catch (eSaveM) {}
            }
          }
        } catch (eMergeA) {}
        // 刷新当前对话显示
        var chatObj = HX.chat.load(curChatId);
        if (chatObj) {
          renderChat(chatObj);
        }
      },
      onErr: function(msg) {
        if (sendAbortTimer) {
          clearInterval(sendAbortTimer);
          sendAbortTimer = null;
        }
        isSending = false;
        $sendBtn.textContent = '🚀';
        $sendBtn.disabled = false;
        
        // 替换占位为错误信息
        placeholderBubble.innerHTML = '<div style="color:#cc6666;">没通：' + escHtml(msg) + '（点🚀可重发）</div><div class="bubble-time">' + formatTime(now) + '</div>';
        placeholderBubble.className = 'bubble bubble-ai round';
        scrollBottom();
      },
      onTick: function(sec) {
        // 已由定时器处理
      }
    });
  };
  
  $inputArea.oninput = adjustTextareaHeight;
  $inputArea.onkeydown = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $sendBtn.click();
    }
  };
  
  // Toast关闭
  $toastClose.onclick = hideToast;
  
  // 初始化
  loadCurrentChat();
  renderDrawerList();
  try{ if(window.HX && HX.sj && HX.sj.init) HX.sj.init({app:'AI总管'}); }catch(e){}
  try{ if(window.HX && HX.pick && HX.pick.bind) HX.pick.bind(); }catch(e){}
  /* v0.4.0 提示词预设系统：绑定入口、出厂三条、总开关、云补拉 */
  try { presetBindUI(); } catch (ePresetBind) {}
}

/* v0.6.0（t66，洪老师真机报「汇成一篇后输入框消失」）：底栏看门狗——
   X5老内核flex坑：main-area(flex:1;min-height:0)遇超长文失效撑破body，正常流底栏被推出视口底。
   治法：每2秒+resize+visualViewport.resize量一次底栏getBoundingClientRect，
   底边跑出视口（或顶边<0）=塌方→显式钉main-area高度=视口高-顶行-记忆行-底栏-8(px)、flex改none救回底栏；
   正常时绝不动布局（flex照旧）；全程try静默，量不到元素不动作。 */
(function(){
  function _guard(){
    try{
      var bb=document.querySelector('.bottom-bar'); var ma=document.getElementById('mainArea');
      if(!bb||!ma) return;
      var r=bb.getBoundingClientRect();
      var vh=window.innerHeight||0;
      if(!vh) return;
      if(r.bottom>vh+2 || r.top<0){
        var tb=document.querySelector('.top-bar');
        var ml=document.getElementById('memLine');
        var used=(tb?tb.offsetHeight:0)+((ml&&ml.offsetParent)?ml.offsetHeight:0)+(bb.offsetHeight||0);
        ma.style.flex='none';
        ma.style.height=Math.max(120,(vh-used-8))+'px';
        try{ bb.scrollIntoView(false); }catch(eS){}
      }
    }catch(e){}
  }
  setInterval(_guard,2000);
  try{ window.addEventListener('resize',_guard); }catch(e1){}
  try{ if(window.visualViewport) window.visualViewport.addEventListener('resize',_guard); }catch(e2){}
  setTimeout(_guard,800); /* 开门先量一拍 */
})();

// 页面加载完成
document.addEventListener('DOMContentLoaded', function() {
  initPage();
});

<script>
/* v0.7.0 刀D：📚收发室逻辑（独立script块，全try护栏；zgOn/createBubble/escHtml等在主块，缺席静默） */
(function(){
  function $(id){ return document.getElementById(id); }
  function esc(s){ try{ return (typeof escHtml==='function') ? escHtml(String(s)) : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }catch(e){ return ''; } }
  function on(){ try{ return (typeof zgOn==='function') && zgOn(); }catch(e){ return false; } }
  function toast(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  var room=$('zgRoom'), body=$('zgRoomBody');
  if(!room||!body) return;
  var $btn=$('zgBtn');
  if($btn){ if(!on()){ $btn.style.display='none'; } }
  /* 公共件三级加载晚到场景：每3秒复查10拍，zg到岗就把📚钮亮回来（治晚到永藏） */
  (function(){ var n=0; var t=setInterval(function(){ n++; try{ if($btn && on()){ $btn.style.display=''; clearInterval(t); return; } }catch(e){} if(n>=10) clearInterval(t); }, 3000); })();
  function close(){ try{ room.className='drawer'; }catch(e){} }
  var $x=$('zgRoomClose'); if($x) $x.onclick=close;
  if(!$btn) return;
  $btn.onclick=function(){
    try{
      if(!on()){ toast('总管没在岗（公共件没装上或总开关关着）'); return; }
      room.className='drawer open';
      renderBooks();
    }catch(e){}
  };
  function row(html, onclick){
    var d=document.createElement('div');
    d.style.cssText='padding:10px 8px;border-bottom:1px solid #eee;font-size:15px;';
    d.innerHTML=html;
    if(onclick) d.onclick=onclick;
    return d;
  }
  function smallBtn(label, fn){
    var b=document.createElement('button');
    b.className='top-btn';
    b.style.cssText='margin:2px 4px 2px 0;font-size:13px;padding:4px 8px;';
    b.textContent=label;
    b.onclick=function(ev){ try{ ev.stopPropagation(); }catch(e){} try{ fn(); }catch(e2){} };
    return b;
  }
  /* 取最近一条AI回信 */
  function lastAiText(){
    try{
      var d=HX.chat.load(curChatId);
      if(d && (d.msgs instanceof Array)){
        for(var i=d.msgs.length-1;i>=0;i--){
          if(d.msgs[i] && d.msgs[i].r==='a' && d.msgs[i].c) return String(d.msgs[i].c);
        }
      }
    }catch(e){}
    return '';
  }
  function renderBooks(){
    body.innerHTML='';
    var books=[];
    try{ books=HX.zg.listBooks(); }catch(e){ books=[]; }
    if(!books.length){ body.appendChild(row('<span style="color:#999;">小涛的书架上还没有书</span>')); return; }
    books.forEach(function(bk){
      body.appendChild(row('<b>📖 '+esc(bk.title)+'</b><span style="color:#999;font-size:12px;">（'+bk.chapters.length+'章，点开看章）</span>', function(){ renderChaps(bk); }));
    });
  }
  function renderChaps(bk){
    body.innerHTML='';
    body.appendChild(row('<a style="color:#4a6b4f;">← 返回书架</a>', renderBooks));
    body.appendChild(row('<b>📖 '+esc(bk.title)+'</b>'));
    bk.chapters.forEach(function(ch, idx){
      var wrap=document.createElement('div');
      wrap.style.cssText='padding:8px;border-bottom:1px solid #eee;';
      var t=document.createElement('div');
      t.style.cssText='font-size:15px;margin-bottom:4px;';
      t.textContent='第'+(idx+1)+'章 '+ch.t;
      wrap.appendChild(t);
      var bar=document.createElement('div');
      /* 📥取进对话：章正文贴进输入框（待发，不直发） */
      bar.appendChild(smallBtn('📥取进对话', function(){
        try{
          var txt=HX.zg.getChap(bk.id, ch.id);
          if(txt===null){ toast('这章还没正文'); return; }
          var $ta=document.getElementById('inputArea');
          if($ta){ $ta.value='【《'+bk.title+'》'+ch.t+' 原文】\n'+txt+'\n【我的事】\n'; }
          close(); toast('章已取进输入框，补一句您要干啥再发');
        }catch(e){ toast('取章失败'); }
      }));
      /* 🪄融最近回信 */
      bar.appendChild(smallBtn('🪄融最近回信', function(){
        try{
          var mat=lastAiText();
          if(!mat){ toast('本对话还没有AI回信可融'); return; }
          if(!window.confirm('把本对话最近一条AI回信融进「'+ch.t+'」？旧版自动留底可退回。')) return;
          close();
          zgTryCmd('把材料融进《'+bk.title+'》第'+(idx+1)+'章');
        }catch(e){ toast('命令发不出去'); }
      }));
      /* ↩历史版 */
      bar.appendChild(smallBtn('↩历史版', function(){
        try{
          var hs=HX.zg.histList(bk.id, ch.id);
          if(!hs.length){ toast('这章没有留底旧版'); return; }
          var menu='留底旧版（新的在前）：\n';
          for(var i=0;i<hs.length;i++){
            var d=new Date(hs[i].ts);
            menu+=(i+1)+'. '+(d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'　'+hs[i].len+'字　'+hs[i].why+'\n';
          }
          var pick=window.prompt(menu+'\n退回第几版？输序号（别的不动）：','1');
          var n=parseInt(pick,10);
          if(!(n>=1 && n<=hs.length)) return;
          if(!window.confirm('把「'+ch.t+'」退回第'+n+'版？现在的版本也会留底，不丢。')) return;
          var ok=HX.zg.rollback(bk.id, ch.id, hs[n-1].ts);
          toast(ok?'已退回，现在的版本也留了底':'退回失败，章没动');
        }catch(e){ toast('退回失败'); }
      }));
      wrap.appendChild(bar);
      body.appendChild(wrap);
    });
  }
})();
</script>

</body>
</html>
