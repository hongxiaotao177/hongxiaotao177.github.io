/* ===== v0.2.0 成书塞章节：📥送入书（DS实现+Kimi终审翻案2处：①hxToastHold(msg)签名错改showToast（本页黑框常驻带✕）；②curChatTitle不存在改HX.chat.load(curChatId)取title） ===== */
function chatLoadXtBooks() {
  try {
    var raw = null;
    try {
      if (window.HX && HX.store && HX.store.has && HX.store.has()) {
        raw = HX.store.get('xt_books_v1', null);
      }
    } catch (e0) { raw = null; }
    if (raw === null || raw === undefined) {
      try { raw = localStorage.getItem('xt_books_v1'); } catch (e1) { raw = null; }
    }
    if (!raw) return [];
    var arr = null;
    try { arr = JSON.parse(raw); } catch (e2) { arr = null; }
    if (!arr || !(arr instanceof Array)) return [];
    return arr;
  } catch (e) { return []; }
}

function chatSendBook(letterText) {
  try {
    var books = chatLoadXtBooks();
    if (!books || !books.length) {
      try { showToast('小涛笔记里还没有书，先去✍️小涛笔记建一本'); } catch (e0) {}
      return;
    }
    chatShowBookLayer(books, letterText);
  } catch (e) {
    try { showToast('送入书失败'); } catch (e2) {}
  }
}

function chatShowBookLayer(books, letterText) {
  try {
    var old = document.getElementById('chatBookMask');
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var mask = document.createElement('div');
    mask.id = 'chatBookMask';
    mask.className = 'chat-book-mask';

    var card = document.createElement('div');
    card.className = 'chat-book-card';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'chat-book-close';
    closeBtn.innerHTML = '✕';
    closeBtn.onclick = function() {
      try { if (mask.parentNode) mask.parentNode.removeChild(mask); } catch (e) {}
    };
    card.appendChild(closeBtn);

    var titleEl = document.createElement('div');
    titleEl.className = 'chat-book-title';
    titleEl.textContent = '选一本书';
    card.appendChild(titleEl);

    var autoHomeBtn = document.createElement('button');
    autoHomeBtn.className = 'chat-book-row';
    autoHomeBtn.style.display = 'block';
    autoHomeBtn.style.width = '100%';
    autoHomeBtn.style.margin = '6px 0 8px';
    autoHomeBtn.textContent = '🪄 让AI找家（自动配书配章）';
    autoHomeBtn.onclick = function() {
      try { chatAutoHome(mask, books, letterText, autoHomeBtn); } catch (e) {}
    };
    card.appendChild(autoHomeBtn);

    var listEl = document.createElement('div');
    listEl.className = 'chat-book-list';

    for (var i = 0; i < books.length; i++) {
      (function(bk) {
        try {
          if (!bk) return;
          var row = document.createElement('div');
          row.className = 'chat-book-row';
          var chs = (bk.chapters && bk.chapters.length) ? bk.chapters.length : 0;
          row.textContent = '📖 ' + (bk.title || bk.name || '未命名') + '（' + chs + '章）';
          row.onclick = function() {
            try { chatShowChapLayer(mask, card, bk, letterText); } catch (e) {}
          };
          listEl.appendChild(row);
        } catch (e1) {}
      })(books[i]);
    }
    card.appendChild(listEl);

    mask.appendChild(card);
    mask.onclick = function(ev) {
      try { if (ev && ev.target === mask) { if (mask.parentNode) mask.parentNode.removeChild(mask); } } catch (e) {}
    };
    document.body.appendChild(mask);
  } catch (e) {
    try { showToast('送入书失败'); } catch (e2) {}
  }
}

function chatAutoHome(mask, books, letterText, btn) {
  var oldText = btn ? btn.textContent : '';
  var timeoutId = null;
  var finished = false;

  function restoreBtn() {
    try { if (btn) btn.textContent = oldText; } catch (e) {}
    try { if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; } } catch (e) {}
  }
  function finish() {
    if (finished) return true;
    finished = true;
    restoreBtn();
    return false;

function chatB64ToBlobUrl(b64, mime) { /* 照大管家 dsm_b64ToBlobUrl 真签名仿写 */
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], { type: mime }));
}

function chatLoadPdfEngine(cb) {
  /* 三段式取 guanjia-pdf-engine.js（壳readFile→同目录fetch→GitHub Pages），就绪标记 window.chat_pdfWorkerReady */

        if (typeof pdfjsLib !== 'undefined' && window.chat_pdfWorkerReady) { cb(true); return; }
        var s = document.createElement('script');
        s.src = chatB64ToBlobUrl(PDFJS_B64, 'application/javascript');
        s.onload = function() {
          try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = chatB64ToBlobUrl(PDFWORKER_B64, 'application/javascript');
            window.chat_pdfWorkerReady = true;
            cb(true);
          } catch (e1) { cb(false); }

        s.onerror = function() { cb(false); };

    }
    function runTxt2(txt) { try { var s = document.createElement('script'); s.textContent = txt; document.head.appendChild(s); } catch (e) {} }
    function got(){ return typeof PDFJS_B64 !== 'undefined' && typeof PDFWORKER_B64 !== 'undefined'; }
    if (got()) { afterGot(); return; }
    if (window.LearnShell) {
      var f = null; try { f = LearnShell.readFile('guanjia-pdf-engine.js'); } catch (e1) {}
      if (f) { try { runTxt2(decodeURIComponent(escape(atob(String(f).replace(/\s+/g,''))))); if (got()) { afterGot(); return; } } catch (e2) {} }
    }
    var _c1 = new AbortController(); var _t1 = setTimeout(function(){ _c1.abort(); }, 15000);
    fetch('guanjia-pdf-engine.js?t=' + Date.now(), { cache: 'no-store', signal: _c1.signal }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.text();
    }).then(function(txt) {
      clearTimeout(_t1); runTxt2(txt);
      if (got()) { afterGot(); } else { fromPages(); }
    }).catch(function() { clearTimeout(_t1); fromPages(); });
    function fromPages() {
      var _c2 = new AbortController(); var _t2 = setTimeout(function(){ _c2.abort(); }, 60000);
      fetch('https://hongxiaotao177.github.io/guanjia-pdf-engine.js?t=' + Date.now(), { cache: 'no-store', signal: _c2.signal }).then(function(r) {

        runTxt2(txt);
        if (got()) { afterGot(); } else { cb(false); }
      }).catch(function() { clearTimeout(_t2); cb(false); });

  } catch (e) { cb(false); }
}

function chatParsePdf(arrayBuffer, fileName, cb) {
  /* 照大管家 dsm_parsePDFWithEngine 真用法仿写：逐页getTextContent抽字join；空=扫描件 */
  try {
    if (typeof pdfjsLib === 'undefined' || !window.chat_pdfWorkerReady) { cb(false, 'PDF引擎加载失败'); return; }
    pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdf) {
      var totalPages = pdf.numPages;
      var promises = [];
      for (var i = 1; i <= totalPages; i++) {
        promises.push(pdf.getPage(i).then(function(page) {
          return page.getTextContent().then(function(data) {
            return data.items.map(function(item) { return item.str; }).join(' ');
          });
        }));
      }
      Promise.all(promises).then(function(pagesText) {
        var textContent = pagesText.join('\n\n');
        if (textContent.replace(/^\s+|\s+$/g, '') === '') {
          cb(false, '这份PDF读不出字，可能是扫描件');
        } else {
          cb(true, textContent, totalPages);
        }
      }).catch(function(err) { cb(false, 'PDF没读成: ' + err.message); });
    }).catch(function(err) { cb(false, 'PDF没读成: ' + err.message); });
  } catch (e) { cb(false, 'PDF没读成: ' + e.message); }
}

/* ---------- 终审翻案①：AI直调（端点/模型名照HX.chat内部口径；which='kimi'|'qwen'|'auto'） ---------- */
function presetCallAI(sys, userText, which, cb) {
  try {
    /* v0.10.0 刀1（SPEC_t113 AI总泵归拢一期）：总泵在且未关→走HX.aip.go（trim/8192/截断续写/400哨兵=千问四治法总泵自带），aip不在或hx_aip_off=1→走老链（老体全保留）。注意：老链缺省序kimi→qwen→deepseek，归拢后照总泵口径千问→Kimi→DS */
    var _paAip = false;
    try { _paAip = !!(HX.aip && typeof HX.aip.go === 'function' && localStorage.getItem('hx_aip_off') !== '1'); } catch (eA) { _paAip = false; }
    if (_paAip) {
      try {
        var _paWhich = (which === 'kimi' || which === 'qwen') ? which : (which === 'deepseek' ? 'ds' : undefined);
        HX.aip.go(sys, userText, { which: _paWhich, maxTokens: 8192 }, function (ok, txt, by) {
          try { cb(!!ok, ok ? txt : ('没通：' + String(txt || 'AI都没回'))); } catch (eB) {}
        });
        return;
      } catch (eC) { /* 掉回老链 */ }
    }
    var tries = [];
    if (which === 'kimi') tries = ['kimi'];
    else if (which === 'qwen') tries = ['qwen'];
    else tries = ['kimi', 'qwen', 'deepseek'];
    function keyOf(w) {
      try {
        if (w === 'kimi') return (HX.keys.get && HX.keys.get()) || '';
        if (w === 'qwen') return (HX.keys.getQwen && HX.keys.getQwen()) || '';
        if (w === 'deepseek') { var o = HX.keys._loadFile ? HX.keys._loadFile() : null; return (o && o.deepseek) ? o.deepseek : ''; }
      } catch (e) {}
      return '';
    }
    var conf = {
      kimi: { url: 'https://api.moonshot.cn/v1/chat/completions', model: (function(){ try { return localStorage.getItem('hx_aimodel') || 'kimi-k2.7-code-highspeed'; } catch (e) { return 'kimi-k2.7-code-highspeed'; } })() },
      qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
      deepseek: { url: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' }
    };
    function attempt(idx) {
      if (idx >= tries.length) { cb(false, '没通：钥匙都没有或AI都没回'); return; }
      var w = tries[idx];
      var key = keyOf(w);
      key = String(key || '').replace(/^\s+|\s+$/g, ''); /* v0.4.1刀④（千问实现+Kimi终审）：钥匙trim去首尾空格 */
      if (!key) { attempt(idx + 1); return; }
      var c = conf[w];
      var _continued = false; /* v0.4.1刀②：截断续写硬上限1次（Kimi终审翻案1：千问把_continued写进then里每次重置=没闸，挪进attempt闭包成真闸） */
      function _send(msgs, acc) { /* v0.4.1刀②：发信收进函数，acc=已拼半截 */
        fetch(c.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model: c.model, messages: msgs, max_tokens: 8192 }) /* v0.4.1刀①：2048→8192（三家统一，治腰斩） */
        }).then(function (r) {
          if (!r.ok) { attempt(idx + 1); return { __skip: 1 }; } /* v0.4.1真bug修（千问实现+Kimi终审翻案2：千问!r.ok直return致下个then拿到undefined又跳一次=一家被跳过两次，补__skip哨兵）：HTTP400等不收→换下一家，不再当JSON误解析 */
          return r.json();
        }).then(function (j) {
          if (j && j.__skip) return; /* v0.4.1：哨兵路收工 */
          try {
            var txt = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : '';
            var fr = j && j.choices && j.choices[0] ? j.choices[0].finish_reason : ''; /* v0.4.1刀②：读finish_reason判截断 */
            if (txt && fr === 'length' && !_continued) {
              _continued = true;
              var _m2 = msgs.slice(); /* slice拷贝不动原数组 */
              _m2.push({ role: 'assistant', content: txt });
              _m2.push({ role: 'user', content: '接着断处写，别重头' });
              _send(_m2, acc + txt);
              return;
            }
            if (txt && fr !== 'length') { cb(true, acc + txt); return; }
            /* 续写仍截断：半截信（多半是半截JSON）交了也解析不了，照SPEC换下一家 */
          } catch (e) {}
          attempt(idx + 1);
        }).catch(function () { attempt(idx + 1); });
      }
      _send([{ role: 'system', content: sys }, { role: 'user', content: userText }], '');
    }
    attempt(0);
  } catch (e) { cb(false, e && e.message ? e.message : 'AI调用失败'); }
}

function presetRecentTurns(chatObj, n) {

    var take = n || 5;
    var msgs = chatObj.msgs;
    var start = Math.max(0, msgs.length - take * 2);

    for (var j = start; j < msgs.length; j++) { if (msgs[j]) out.push({ r: msgs[j].r, c: msgs[j].c }); }
    return out;
  } catch (e) { return []; }
}

function presetLitRun(userText, cb) {
  /* A5 双岗主流程：审不过打回重查最多2轮 */

          var passIdx = (res.pass && res.pass instanceof Array) ? res.pass : [];
          var failIdx = (res.fail && res.fail instanceof Array) ? res.fail : [];
          var passList = [];
          for (var i = 0; i < passIdx.length; i++) { var pi = passIdx[i]; if (lastList[pi]) passList.push(lastList[pi]); }
          if (passList.length) {
            cb(true, { list: passList, receipt: passList.length + '篇已核/' + failIdx.length + '篇查无此文被毙' });
          } else if (round < maxRound) {
            oneRound();
          } else {
            cb(true, { list: [], receipt: '0篇已核/' + lastList.length + '篇查无此文被毙' });
          }
        });

    }

}

        var recent = presetRecentTurns(chatObj, preset.ctxN || 5);
        for (var t = 0; t < recent.length; t++) {
          ctxTxt += ((recent[t].r === 'u') ? '用户：' : 'AI：') + (recent[t].c || '') + '\n';
        }
      }
    }
    if (ctxTxt) return head + '【上文】\n' + ctxTxt + '【我的问题】\n' + userText;
    return head + userText;
  } catch (e) { return userText; }
}

/* v0.12.0 鱼骨版面：ygOff闸 / applyFishbone鱼骨化 / delBubble单条删 */
function ygOff() { try { return localStorage.getItem('hx_yg_off') === '1'; } catch (e) { return false; } }

/* AI长回复鱼骨化：按双换行分段，段数≥2且总长≥120字才折；每段一行下划线摘要行（首句≤40字+行尾小字=本段字数），点行展开/再点折回，新展旧折，展开行点亮 */
function applyFishbone(bubble, content) {
  try {
    if (ygOff()) return false;
    var parts = String(content).split(/\n\s*\n/);
    if (parts.length < 2 || String(content).length < 120) return false;
    var box = document.createElement('div');
    var openIdx = -1;
    var bodies = [];
    var lines = [];
    for (var i = 0; i < parts.length; i++) {
      (function (idx) {
        var seg = parts[idx];
        var line = document.createElement('div');
        line.className = 'fb-line';
        var first = seg.split('\n')[0];
        if (first.length > 40) first = first.substring(0, 40) + '…';
        line.innerHTML = escHtml(first) + '<span class="fb-tail">' + seg.length + '字</span>';
        var body = document.createElement('div');
        body.className = 'fb-body';
        body.style.display = 'none';
        body.innerHTML = escHtml(seg).replace(/\n/g, '<br>');
        line.onclick = function () {
          try {
            if (openIdx === idx) { /* 再点折回 */
              bodies[idx].style.display = 'none'; lines[idx].className = 'fb-line'; openIdx = -1;
            } else { /* 新展旧折 */
              if (openIdx >= 0) { bodies[openIdx].style.display = 'none'; lines[openIdx].className = 'fb-line'; }
              bodies[idx].style.display = 'block'; lines[idx].className = 'fb-line fb-sel'; openIdx = idx;
            }
          } catch (e) {}
        };
        lines.push(line); bodies.push(body);
        box.appendChild(line); box.appendChild(body);
      })(i);
    }
    bubble.innerHTML = '';
    bubble.appendChild(box);
    return true;
  } catch (e) { return false; }
}

/* 单条气泡删：按r+内容末匹配删账再删DOM；删前confirm */
function delBubble(role, content, bubbleEl) {
  try {
    if (!confirm('删掉这条气泡？（账本里一起删）')) return;
    var d = HX.chat.load(curChatId);
    if (d && d.msgs instanceof Array) {
      for (var i = d.msgs.length - 1; i >= 0; i--) {
        if (d.msgs[i].r === role && d.msgs[i].c === content) { d.msgs.splice(i, 1); break; }
      }
      try { d.turns = Math.floor(d.msgs.length / 2); } catch (e) {}
      HX.chat.save(d);
    }
    if (bubbleEl && bubbleEl.parentNode) bubbleEl.parentNode.removeChild(bubbleEl);
    showToast('已删一条');
  } catch (e) { try { showToast('删除失败'); } catch (e2) {} }
}

function createBubble(type, content, timeMs, hasCopy, byName) {
  var bubble = document.createElement('div');

  var timeDiv = document.createElement('div');

  timeDiv.textContent = formatTime(timeMs);
  
  var contentDiv = document.createElement('div');
  contentDiv.innerHTML = escHtml(content).replace(/\n/g, '<br>');
  
  bubble.appendChild(contentDiv);
  bubble.appendChild(timeDiv);

  /* v0.12.0 鱼骨版面：by标注+鱼骨化（不达标/闸关=老样） */
  var _ygDone = false;
  if (type === 'ai') {
    try { _ygDone = applyFishbone(bubble, content); } catch (eFb) { _ygDone = false; }
    if (_ygDone) { bubble.appendChild(timeDiv); } /* 鱼骨清过innerHTML，时间行补挂 */
    try {
      var _byTxt = byName || '';
      if (_byTxt && !ygOff()) {
        var _byDiv = document.createElement('div');
        _byDiv.className = 'fb-head';
        _byDiv.textContent = '\uD83E\uDD16 ' + _byTxt + '答';
        bubble.insertBefore(_byDiv, timeDiv);
      }
    } catch (eBy) {}
  }
  
  if (type === 'ai' && hasCopy) {
    var copyBtn = document.createElement('button');
    copyBtn.className = 'bubble-copy';
    copyBtn.innerHTML = '📋';
    copyBtn.onclick = function() {
      try {

        textarea.value = content;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已复制');
      } catch (e) {
        showToast('复制失败');
      }
    };
    bubble.appendChild(copyBtn);
    try { /* v0.2.0 📥送入书 */
      var _sbOff = false;
      try { _sbOff = (localStorage.getItem('hx_chat_sendbook_off') === '1'); } catch (e0) {}
      if (!_sbOff) {
        var sendBookBtn = document.createElement('button');
        sendBookBtn.className = 'bubble-copy bubble-sendbook';
        sendBookBtn.innerHTML = '📥';
        sendBookBtn.onclick = function() {
          try { chatSendBook(content); } catch (e1) { try { showToast('送入书失败'); } catch (e2) {} }
        };
        bubble.appendChild(sendBookBtn);
      }
    } catch (e3) {}
  }

  /* v0.12.0 单条气泡删（终审翻案：挪函数尾部，user/ai气泡都挂，DS版挂在sendBook的if块内只有ai有） */
  try {
    if (!ygOff()) {
      var delBtn = document.createElement('button');
      delBtn.className = 'bubble-copy bubble-del';
      delBtn.innerHTML = '\uD83D\uDDD1';
      delBtn.onclick = function () { try { delBubble(type === 'user' ? 'u' : 'a', content, bubble); } catch (eD) {} };
      bubble.appendChild(delBtn);
    }
  } catch (eDel) {}

  return bubble;
}

     刀C=命令闸+三步命令链（detectCmd命中→接管发送，进度气泡逐步亮，失败红字停下，成功记进对话账全量留存）；

  function zgOn() {

      if (!window.HX || !HX.zg) return false;
      if (localStorage.getItem('hx_zg_off') === '1') return false;
      return true;
    } catch (e) { return false; }
  }
  /* 把一条总管回话记进当前对话账（全量留存规矩）：追加 u/a 两条进HX.chat真源 */
  function zgLogToChat(userText, aiText) {
    try {
      var d = HX.chat.load(curChatId);
      if (!d) return;
      if (!(d.msgs instanceof Array)) d.msgs = [];
      d.msgs.push({ r: 'u', c: String(userText), t: Date.now() });
      d.msgs.push({ r: 'a', c: String(aiText), t: Date.now() });
      HX.chat.save(d);

  }
  /* 命令闸：命中命令→接管，返true；未命中返false走普通发送。文字=用户原始输入（未拼预设） */
  var _zgPassOnce = false; /* v0.8.0二期刀G：模糊链放行旗，passF再点发送时挡递归（点前挂true，闸口认出即清并放行） */
  /* ════ 三期刀B.1（chat v0.8.3 2026-10-24，SPEC_AI总管三期，洪老师拍板「废暗号」）：zgTryCmd前置改判令制════
   发送时（含选中预设）先调HX.zg.judge：①进度泡「🔎总管在判」②act=chat→摘双泡走原普通发送路（预设拼装一字不动）
   ③act=archive→findChap→merge或新书新章（addBook+addChapter+pump总结+putChap）逐步亮进度
   ④judge超时/失败/找不着章→降级普通发送绝不卡发送。
   旧detectCmd/模糊链函数保留不删（刀B.2），发送闸不再走它们。
   Kimi终审翻案1处：DS版passThrough没摘用户气泡，降级重进普通发送会双贴——补摘uBubJ。 */
function zgTryCmd(rawText) {
    if (!zgOn()) return false;
    if (_zgPassOnce) { _zgPassOnce = false; return false; }
    var nowJ = Date.now();
    var phJ = null, uBubJ = null;
    var presetRuleJ = '';
    try { if (curPreset && curPreset.rule) presetRuleJ = String(curPreset.rule || ''); } catch (ePR) {}
    function passThroughJ() {
      try { if (phJ && phJ.parentNode) phJ.parentNode.removeChild(phJ); } catch (eRm) {}
      try { if (uBubJ && uBubJ.parentNode) uBubJ.parentNode.removeChild(uBubJ); } catch (eRm2) {}
      try {
        _zgPassOnce = true;
        $inputArea.value = rawText;
        adjustTextareaHeight();
        $sendBtn.click();
      } catch (eP) {}
    }
    try {
      $inputArea.value = '';
      adjustTextareaHeight();
      uBubJ = createBubble('user', rawText, nowJ, false);
      $mainArea.appendChild(uBubJ);
      phJ = createBubble('ai', '🔎 总管在判：闲聊还是归档…', nowJ, false);
      $mainArea.appendChild(phJ);
      scrollBottom();
    } catch (eBub) {}
    var linesJ = [];
    function renderPhJ() {
      if (!phJ) return;
      var hJ = '';
      for (var kJ = 0; kJ < linesJ.length; kJ++) hJ += '<div>' + escHtml(linesJ[kJ]) + '</div>';
      hJ += '<div class="bubble-time">' + formatTime(nowJ) + '</div>';
      phJ.innerHTML = hJ;
      scrollBottom();
    }
    function recentMatJ() {
      var mat = '';
      try {
        var dJ = HX.chat.load(curChatId);
        var accJ = [];
        if (dJ && (dJ.msgs instanceof Array)) {
          for (var iJ = dJ.msgs.length - 1; iJ >= 0 && accJ.length < 3; iJ--) {
            if (dJ.msgs[iJ] && dJ.msgs[iJ].r === 'a' && dJ.msgs[iJ].c) accJ.unshift(String(dJ.msgs[iJ].c));
          }
        }
        mat = accJ.join('\n---\n');
      } catch (eMJ) {}
      return mat;
    }
    function runArchiveJ(hint) {
      var matJ = recentMatJ();
      var findHint = String(hint || '') + '\n' + String(rawText || '') + (matJ ? ('\n' + matJ) : '');
      linesJ.push('📚 正在选书/章…');
      renderPhJ();
      HX.zg.findChap(findHint, {
        onOk: function (info) {
          if (info && info.conf === 'newbook') {
            var newBookTitle = String(info.book || '未命名书');
            linesJ.push('🆕 独立成书《' + newBookTitle + '》');
            renderPhJ();
            var bidNb = null, cidNb = null;
            try { bidNb = HX.zg.addBook(newBookTitle); } catch (eNb1) { bidNb = null; }
            if (!bidNb) {
              linesJ.push('❌ 没办成：建书失败（原文没丢，点🚀重发）'); renderPhJ();
              zgLogToChat(rawText, '【总管】' + linesJ.join(' / ')); return;
            }
            try { cidNb = HX.zg.addChapter(bidNb, '第1章'); } catch (eNb2) { cidNb = null; }
            if (!cidNb) {
              linesJ.push('❌ 没办成：建章失败（原文没丢，点🚀重发）'); renderPhJ();
              zgLogToChat(rawText, '【总管】' + linesJ.join(' / ')); return;
            }

  /* v0.4.0 提示词预设系统：绑定入口、出厂三条、总开关、云补拉 */
  try { presetBindUI(); } catch (ePresetBind) {}
}

/* v0.6.0（t66，洪老师真机报「汇成一篇后输入框消失」）：底栏看门狗——
   X5老内核flex坑：main-area(flex:1;min-height:0)遇超长文失效撑破body，正常流底栏被推出视口底。
   治法：每2秒+resize+visualViewport.resize量一次底栏getBoundingClientRect，
   底边跑出视口（或顶边<0）=塌方→显式钉main-area高度=视口高-顶行-记忆行-底栏-8(px)、flex改none救回底栏；
   正常时绝不动布局（flex照旧）；全程try静默，量不到元素不动作。 */
(function(){
  function _guard(){
    try{
      var bb=document.querySelector('.bottom-bar'); var ma=document.getElementById('mainArea');
      if(!bb||!ma) return;
      var r=bb.getBoundingClientRect();
      var vh=window.innerHeight||0;
      if(!vh) return;
      if(r.bottom>vh+2 || r.top<0){
        var tb=document.querySelector('.top-bar');
        var ml=document.getElementById('memLine');
        var used=(tb?tb.offsetHeight:0)+((ml&&ml.offsetParent)?ml.offsetHeight:0)+(bb.offsetHeight||0);
        ma.style.flex='none';
        ma.style.height=Math.max(120,(vh-used-8))+'px';
        try{ bb.scrollIntoView(false); }catch(eS){}
      }
    }catch(e){}
  }
  setInterval(_guard,2000);
  try{ window.addEventListener('resize',_guard); }catch(e1){}
  try{ if(window.visualViewport) window.visualViewport.addEventListener('resize',_guard); }catch(e2){}
  setTimeout(_guard,800); /* 开门先量一拍 */
})();

// 页面加载完成
document.addEventListener('DOMContentLoaded', function() {
  initPage();
});
</script>

<script>
/* v0.7.0 刀D：📚收发室逻辑（独立script块，全try护栏；zgOn/createBubble/escHtml等在主块，缺席静默） */
(function(){
  function $(id){ return document.getElementById(id); }
  function esc(s){ try{ return (typeof escHtml==='function') ? escHtml(String(s)) : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }catch(e){ return ''; } }
  function on(){ try{ return (typeof zgOn==='function') && zgOn(); }catch(e){ return false; } }
  function toast(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  var room=$('zgRoom'), body=$('zgRoomBody');
  if(!room||!body) return;
  var $btn=$('zgBtn');
  if($btn){ if(!on()){ $btn.style.display='none'; } }
  /* 公共件三级加载晚到场景：每3秒复查10拍，zg到岗就把📚钮亮回来（治晚到永藏） */
  (function(){ var n=0; var t=setInterval(function(){ n++; try{ if($btn && on()){ $btn.style.display=''; clearInterval(t); return; } }catch(e){} if(n>=10) clearInterval(t); }, 3000); })();
  function close(){ try{ room.className='drawer'; }catch(e){} }
  var $x=$('zgRoomClose'); if($x) $x.onclick=close;
  if(!$btn) return;
  $btn.onclick=function(){
    try{
      if(!on()){ toast('总管没在岗（公共件没装上或总开关关着）'); return; }
      room.className='drawer open';
      renderBooks();
    }catch(e){}
  };
  function row(html, onclick){
    var d=document.createElement('div');
    d.style.cssText='padding:10px 8px;border-bottom:1px solid #eee;font-size:15px;';
    d.innerHTML=html;
    if(onclick) d.onclick=onclick;
    return d;
  }
  function smallBtn(label, fn){
    var b=document.createElement('button');
    b.className='top-btn';
    b.style.cssText='margin:2px 4px 2px 0;font-size:13px;padding:4px 8px;';
    b.textContent=label;
    b.onclick=function(ev){ try{ ev.stopPropagation(); }catch(e){} try{ fn(); }catch(e2){} };
    return b;
  }
  /* 取最近一条AI回信 */
  function lastAiText(){
    try{
      var d=HX.chat.load(curChatId);
      if(d && (d.msgs instanceof Array)){
        for(var i=d.msgs.length-1;i>=0;i--){
          if(d.msgs[i] && d.msgs[i].r==='a' && d.msgs[i].c) return String(d.msgs[i].c);
        }
      }
    }catch(e){}
    return '';
  }
  function renderBooks(){
    body.innerHTML='';
    var books=[];
    try{ books=HX.zg.listBooks(); }catch(e){ books=[]; }
    if(!books.length){ body.appendChild(row('<span style="color:#999;">小涛的书架上还没有书</span>')); return; }
    books.forEach(function(bk){
      body.appendChild(row('<b>📖 '+esc(bk.title)+'</b><span style="color:#999;font-size:12px;">（'+bk.chapters.length+'章，点开看章）</span>', function(){ renderChaps(bk); }));
    });
  }
  function renderChaps(bk){
    body.innerHTML='';
    body.appendChild(row('<a style="color:#4a6b4f;">← 返回书架</a>', renderBooks));
    body.appendChild(row('<b>📖 '+esc(bk.title)+'</b>'));
    bk.chapters.forEach(function(ch, idx){
      var wrap=document.createElement('div');
      wrap.style.cssText='padding:8px;border-bottom:1px solid #eee;';
      var t=document.createElement('div');
      t.style.cssText='font-size:15px;margin-bottom:4px;';
      t.textContent='第'+(idx+1)+'章 '+ch.t;
      wrap.appendChild(t);
      var bar=document.createElement('div');
      /* 📥取进对话：章正文贴进输入框（待发，不直发） */
      bar.appendChild(smallBtn('📥取进对话', function(){
        try{
          var txt=HX.zg.getChap(bk.id, ch.id);
          if(txt===null){ toast('这章还没正文'); return; }
          var $ta=document.getElementById('inputArea');
          if($ta){ $ta.value='【《'+bk.title+'》'+ch.t+' 原文】\n'+txt+'\n【我的事】\n'; }
          close(); toast('章已取进输入框，补一句您要干啥再发');
        }catch(e){ toast('取章失败'); }
      }));
      /* 🪄融最近回信 */
      bar.appendChild(smallBtn('🪄融最近回信', function(){
        try{
          var mat=lastAiText();
          if(!mat){ toast('本对话还没有AI回信可融'); return; }
          if(!window.confirm('把本对话最近一条AI回信融进「'+ch.t+'」？旧版自动留底可退回。')) return;
          close();
          zgTryCmd('把材料融进《'+bk.title+'》第'+(idx+1)+'章');
        }catch(e){ toast('命令发不出去'); }
      }));
      /* ↩历史版 */
      bar.appendChild(smallBtn('↩历史版', function(){
        try{
          var hs=HX.zg.histList(bk.id, ch.id);
          if(!hs.length){ toast('这章没有留底旧版'); return; }
          var menu='留底旧版（新的在前）：\n';
          for(var i=0;i<hs.length;i++){
            var d=new Date(hs[i].ts);
            menu+=(i+1)+'. '+(d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'　'+hs[i].len+'字　'+hs[i].why+'\n';
          }
          var pick=window.prompt(menu+'\n退回第几版？输序号（别的不动）：','1');
          var n=parseInt(pick,10);
          if(!(n>=1 && n<=hs.length)) return;
          if(!window.confirm('把「'+ch.t+'」退回第'+n+'版？现在的版本也会留底，不丢。')) return;
          var ok=HX.zg.rollback(bk.id, ch.id, hs[n-1].ts);
          toast(ok?'已退回，现在的版本也留了底':'退回失败，章没动');
        }catch(e){ toast('退回失败'); }
      }));
      wrap.appendChild(bar);
      body.appendChild(wrap);
    });
  }
})();

/* ════ v0.9.0 t110刀1：📦话仓浮层（SPEC_t110_话仓）════
   顶部总账+话题数数+条目列表（点开看问答/📥塞书走现成chatSendBook/🗑删）。
   开关hx_hc_off=1藏钮；照zgBtn逻辑公共件晚到3秒复查10拍。 */
(function(){
  function $(id){ return document.getElementById(id); }
  function on(){ try{ return !!(window.HX&&HX.hc)&&localStorage.getItem('hx_hc_off')!=='1'; }catch(e){ return false; } }
  function toast(m){ try{ if(typeof showToast==='function') showToast(m); }catch(e){} }
  function esc(s){ try{ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }catch(e){ return ''; } }
  var room=$('hcRoom'), body=$('hcRoomBody');
  if(!room||!body) return;
  var $btn=$('hcBtn');
  if($btn){ if(!on()){ $btn.style.display='none'; } }
  /* 公共件三级加载晚到场景：每3秒复查10拍，hc到岗就把📦钮亮回来 */
  (function(){ var n=0; var t=setInterval(function(){ try{ n++; if(on()){ if($btn) $btn.style.display=''; clearInterval(t); } if(n>=10) clearInterval(t); }catch(e){ clearInterval(t); } },3000); })();
  function close(){ room.classList.remove('open'); }
  if($('hcRoomClose')) $('hcRoomClose').onclick=close;
  if($btn) $btn.onclick=function(){ try{ if(!on()){ toast('话仓没上岗（hx-common没到或已退休）'); return; } render(); room.classList.add('open'); }catch(e){} };
  function fmtT(ts){ try{ var d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }catch(e){ return ''; } }
  function smallBtn2(txt, fn){ var b=document.createElement('button'); b.style.cssText='font-size:13px;color:#4a6b4f;background:#eef5ee;border:1px solid #cfe0cf;border-radius:12px;padding:4px 10px;margin-right:6px;'; b.textContent=txt; b.onclick=fn; return b; }
  function render(){
    body.innerHTML='';
    /* 顶部总账 */
    var head=document.createElement('div');
    head.style.cssText='padding:10px;border-bottom:1px solid #eee;';
    var tot={n:0,turns:0};
    try{ tot=HX.hc.count(''); }catch(e){}
    head.innerHTML='<div style="font-size:15px;margin-bottom:8px;">📦 仓里共存 <b>'+tot.n+'</b> 条 · <b>'+tot.turns+'</b> 轮问答</div>';
    /* 话题数数行 */
    var row0=document.createElement('div');
    row0.style.cssText='display:flex;align-items:center;gap:6px;';
    var inp=document.createElement('input');
    inp.style.cssText='flex:1;font-size:14px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;';
    inp.placeholder='输入话题，数数仓里存了多少';
    var cntBtn=smallBtn2('数数', function(){
      try{
        var tp=inp.value.replace(/^\s+|\s+$/g,'');
        if(!tp){ toast('先写个话题词'); return; }
        var r=HX.hc.count(tp);
        resLine.textContent='「'+tp+'」话题：仓里存了 '+r.n+' 条';
        resLine.style.display='block';
      }catch(e){ toast('数数出错'); }
    });
    row0.appendChild(inp); row0.appendChild(cntBtn);
    head.appendChild(row0);
    var resLine=document.createElement('div');
    resLine.style.cssText='display:none;margin-top:6px;font-size:14px;color:#4a6b4f;font-weight:bold;';
    head.appendChild(resLine);
    body.appendChild(head);
    /* 条目列表 */
    var lst=[];
    try{ lst=HX.hc.list().slice().reverse(); }catch(e){}
    if(!lst.length){
      var emp=document.createElement('div');
      emp.style.cssText='padding:20px;text-align:center;color:#999;font-size:14px;';
      emp.textContent='话仓还空着——跟AI总管聊几句，问答自动存进来';
      body.appendChild(emp);
      return;
    }
    lst.forEach(function(rec){
      if(!rec) return;
      var wrap=document.createElement('div');
      wrap.style.cssText='padding:10px;border-bottom:1px solid #eee;';
      var t=document.createElement('div');
      t.style.cssText='font-size:15px;margin-bottom:4px;cursor:pointer;';
      /* t122-1刀3：条目标题加下划线（总开关hx_t122_off=1不加） */
      try { if (localStorage.getItem('hx_t122_off') !== '1') { t.style.textDecoration = 'underline'; } } catch (eU) {}
      t.textContent='📦 '+(rec.title||'未命名')+'（'+(rec.turns||0)+'轮 · '+fmtT(rec.updated)+'）';
      var detailBox=document.createElement('div');
      detailBox.style.cssText='display:none;margin-top:6px;';
      var opened=false;
      t.onclick=function(){
        try{
          if(!opened){
            opened=true;
            detailBox.style.display='block';
            var det=HX.hc.detail(rec.id);
            if(det&&det.qa){
              det.qa.forEach(function(pair){
                var pb=document.createElement('div');
                pb.style.cssText='margin-bottom:8px;padding:6px;background:#fafafa;border-radius:8px;';
                pb.innerHTML='<div style="font-size:13px;color:#333;margin-bottom:4px;"><b>问：</b>'+esc(pair.q)+'</div>'
                  +'<div style="font-size:13px;color:#666;white-space:pre-wrap;max-height:120px;overflow:auto;"><b>答：</b>'+esc(pair.a)+'</div>';
                var bar=document.createElement('div');
                bar.style.cssText='margin-top:4px;';
                bar.appendChild(smallBtn2('📥塞书', function(){
                  try{ if(typeof chatSendBook==='function') chatSendBook('问：'+pair.q+'\n\n答：'+pair.a); else toast('塞书通道没上岗'); }catch(e){ toast('塞书失败'); }
                }));
                pb.appendChild(bar);
                detailBox.appendChild(pb);
              });
            }
            var delBar=document.createElement('div');
            delBar.style.cssText='margin-top:6px;text-align:right;';
            delBar.appendChild(smallBtn2('🗑删掉这条', function(){
              try{ if(window.confirm('把「'+(rec.title||'')+'」整条从话仓删掉？')){ HX.hc.del(rec.id); render(); toast('已删'); } }catch(e){}
            }));
            detailBox.appendChild(delBar);
          } else {
            detailBox.style.display = detailBox.style.display==='none' ? 'block' : 'none';
          }
        }catch(e){}
      };
      wrap.appendChild(t);
      wrap.appendChild(detailBox);
      body.appendChild(wrap);
    });
  }
})();
</script>
